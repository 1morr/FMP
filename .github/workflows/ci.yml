name: CI

# repo 裡有兩個專案：根目錄的舊專案（凍結，只收緊急修正）與 app/ 的新專案
# （ADR 0008）。`changes` job 依變動路徑分流（ADR 0015 §決定 9），兩邊的 CI
# 失敗不會互相擋 PR：
# - app/**、.github/** 或 repo 根的 release-please 設定有變動：跑 `app` 與
#   `app-` 開頭的 job。
# - app/ 以外有任何變動：跑舊專案的三個 job。文件變更也算，因為 Markdown
#   承載由測試守著的規則（尤其是 agent 指令檔），只改文字的 commit 正是最
#   不能跳過 `validate` 的那種。所以舊專案的篩選條件是「app/ 以外」，不是
#   「是不是程式碼」。
# - 手動觸發一律全跑。
# 分流在 job 層級做，不用觸發層級的 `paths`／`paths-ignore`：必要檢查只有最後
# 的 `CI Result`，它每次都要回報，被跳過的 job 算通過、失敗或取消的算失敗。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PR 的新 push 取代同一個 PR 還在跑的 run；main 與手動觸發則一個 commit 一組，
# 互不取消。以 ref 分組時，連續合併兩個 PR 會取消前一個 commit 的 run，那個
# commit 就永遠沒有 CI 結果（2026-09 查到 main 上有 20 個 commit 是這樣）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  # app/ 跟隨當時的 stable（ADR 0015；M1 design §3）；舊專案維持上面那版。
  APP_FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # pull_request 事件以 REST API 取變動檔案清單。
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      legacy: ${{ steps.filter.outputs.legacy }}

    steps:
      # push 事件以 git 比對變動，需要 checkout。
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        # 手動觸發時下游 job 本來就全跑；跳過比對，免得找不到比對基準時整條 CI 被擋。
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `legacy` 要「符合 ** 且不符合 !app/**」；預設的 `some` 只要符合
          # 任一條就算，app/ 的檔案也會觸發舊專案。
          predicate-quantifier: some-with-excludes
          filters: |
            app:
              - 'app/**'
              - '.github/**'
              # app 的發版設定在 repo 根（release-please 的慣例），由
              # app/test/release/ 守著。
              - 'release-please-config.json'
              - '.release-please-manifest.json'
            legacy:
              - '**'
              - '!app/**'

  validate:
    name: Analyze and Test
    needs: changes
    if: needs.changes.outputs.legacy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test/workflows/pubspec_version_test.dart compares the committed
          # version against the newest reachable tag; a shallow checkout has
          # no tags and the guard would silently skip.
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # Runs before codegen: generated code (e.g. slang's strings.g.dart) is
      # not guaranteed to be dart-format-clean, and *.g.dart is gitignored so
      # it does not exist yet at this point on a fresh checkout anyway.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Static analysis
        run: flutter analyze

      # test/live/ talks to Bilibili, YouTube and NetEase for real. Excluded
      # here because an upstream API change must not turn an unrelated pull
      # request red; run it by hand when playback breaks.
      - name: Unit and widget tests
        run: flutter test --coverage --exclude-tags live

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    name: Android Build Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Build Android arm64 APK
        run: flutter build apk --release --target-platform android-arm64

  build-windows:
    name: Windows Build Smoke
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Build Windows release
        run: flutter build windows --release

  app:
    name: App Analyze and Test
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 兩次 dart analyze（含第一次編譯插件）比 PR 2 多幾分鐘。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # drift 與 slang 產生的 *.g.dart 有提交（app/AGENTS.md § 資料層、§ 介面）。
      # 重跑兩者後 app/ 有任何變動或新檔，就是改了 table 或翻譯檔卻沒重新產生。
      # slang 用自己的 CLI（設定在 slang.yaml），不走 build_runner。
      # 路徑用 `.`：這個 job 的工作目錄已經是 app/。
      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          changes="$(git status --porcelain -- .)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- .
            echo "Generated code is stale: run 'dart run build_runner build --delete-conflicting-outputs' and 'dart run slang' in app/ and commit the result."
            exit 1
          fi

      # fmp_lints 與 riverpod_lint 是 analyzer 插件，只有 dart analyze 看得到
      # 它們的診斷（flutter/flutter#187999）。第一次會解析並編譯插件，要連 pub。
      - name: Plugin lints (dart analyze)
        run: dart analyze --fatal-infos

      # 暫放違反每條 fmp 規則的檔案，斷言 dart analyze 失敗且報出每條規則名：
      # 插件沒載入或規則沒開時，上一步會照樣綠。
      - name: Lint wiring sentinel
        run: dart run tool/lint_sentinel.dart

      # 留著：Flutter 專屬的診斷只在這裡。它不顯示插件診斷，見上。
      - name: Static analysis
        run: flutter analyze

      # 第二次以 Windows 路徑重跑，驗證規則的允許清單不受分隔符影響。
      - name: Lint rule tests
        working-directory: app/packages/fmp_lints
        run: |
          dart test
          TEST_ANALYZER_WINDOWS_PATHS=true dart test

      # 不加參數：dart_test.yaml 讓 live 預設跳過（ADR 0015 §決定 3）。
      # 身分測試要 cmake，ubuntu runner 內建。插件執行環境的測試跑真的
      # QuickJS：test/support/quickjs.dart 預先載入 flutter_js 內附的 .so，
      # 不用先建置桌面版；載入失敗會讓測試失敗，不會跳過。插件契約執行器
      # （test/plugins/contract/contract_test.dart，ADR 0015 §決定 6）也在
      # 這一步：它以 fixture 重播跑 test/fixtures/plugins/ 的每個測試插件。
      - name: Unit and widget tests
        run: flutter test

      # golden（alchemist 的 CI 版）比對失敗時，flutter_test 把差異圖寫在
      # 各 golden 目錄旁的 failures/；上傳才看得到哪裡不同。
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-golden-failures
          path: app/test/**/failures/
          if-no-files-found: ignore

  # 五個平台的建置（ADR 0009 §決定 9、ADR 0015 §決定 9），都建發出去的 prod
  # release；dev 由下面的整合測試與本機建置涵蓋。只有 macOS、iOS 另建 dev：
  # 兩者的 dev／prod Xcode scheme 與 build configuration 是手寫的，兩個都要有
  # CI 守著。Linux、macOS、iOS 還沒有平台實作，App 只開「此平台尚未支援」，
  # 這裡只證明建得起來。
  app-build-android:
    name: App Build (Android)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGP 9 要 JDK 17 以上；順便快取 Gradle。
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # 沒有 android/key.properties，release 用 debug 金鑰；正式簽名只在
      # app-release.yml（app/AGENTS.md § 發版）。
      - name: Build APK (prod, release)
        run: flutter build apk --flavor prod --release

      # INTERNET 只寫在 main 的 manifest（debug、profile 另有一份給 Flutter
      # 工具）。身分測試守原始檔，這一步看合併後的 release manifest。
      - name: Check the release APK requests INTERNET
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt2="$build_tools/aapt2"
          permissions="$("$aapt2" dump permissions build/app/outputs/flutter-apk/app-prod-release.apk)"
          echo "$permissions"
          grep -q "android.permission.INTERNET" <<< "$permissions"

  app-build-windows:
    name: App Build (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # media_kit_libs_windows_audio 在建置時從 GitHub 下載 libmpv。
      - name: Build Windows (prod, release)
        run: flutter build windows --flavor prod --release

  app-build-linux:
    name: App Build (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Flutter 官方 Linux 桌面的建置依賴（docs.flutter.dev/platform-integration/linux/setup）。
      # 插件沒有另外的系統依賴：flutter_js 用 runner 內建的 gcc 與 GTK，
      # jni 的原生庫只在找得到 JDK 時才建（它的 src/CMakeLists.txt）。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Linux (prod, release)
        run: flutter build linux --flavor prod --release

  app-build-macos:
    name: App Build (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # flutter 工具以 flavor 找同名 scheme，再找 <模式>-<flavor> 的 build
      # configuration；prod 走 Release-prod，dev 走 Debug-dev，兩組都建一次。
      # flutter_js 只有 podspec，建置時會產生 Podfile 並 pod install。
      - name: Build macOS (prod, release)
        run: flutter build macos --flavor prod --release

      - name: Build macOS (dev, debug)
        run: flutter build macos --flavor dev --debug

  app-build-ios:
    name: App Build (iOS)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # 不簽名（ADR 0009 §決定 9）：iOS 經 GitHub 發 IPA、由使用者側載時重簽。
      - name: Build iOS (prod, release)
        run: flutter build ios --flavor prod --release --no-codesign

      - name: Build iOS (dev, debug)
        run: flutter build ios --flavor dev --debug --no-codesign

  # ADR 0015 §決定 9 的整合測試：插件執行環境、安裝與資料庫是真的，播放後端
  # 是假的（runner 沒有音訊裝置，Linux 也還沒有後端）。桌面裝置一次
  # `flutter test` 只能跑一個整合測試檔：flutter_tools 每個桌面裝置只有一個
  # log reader，第一個 App 結束時就關掉了，第二個檔案的 App 找不到 VM
  # service（desktop_device.dart 的 DesktopLogReader），所以每個檔案一步。
  # 真後端的 audio_backend_contract_test.dart 與量測不在 CI 跑。
  app-integration-linux:
    name: App Integration Tests (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 建置依賴同 app-build-linux；xvfb 給 GTK 視窗一個畫面。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install a plugin, search and play
        run: xvfb-run -a flutter test integration_test/install_search_play_test.dart -d linux

      - name: Toasts above routes
        run: xvfb-run -a flutter test integration_test/toast_layering_test.dart -d linux

  app-integration-windows:
    name: App Integration Tests (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install a plugin, search and play
        run: flutter test integration_test/install_search_play_test.dart -d windows

      - name: Toasts above routes
        run: flutter test integration_test/toast_layering_test.dart -d windows

  ci-result:
    name: CI Result
    if: always()
    needs:
      - changes
      - validate
      - build-android
      - build-windows
      - app
      - app-build-android
      - app-build-windows
      - app-build-linux
      - app-build-macos
      - app-build-ios
      - app-integration-linux
      - app-integration-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 唯一的必要檢查。被路徑篩掉而跳過的 job 算通過；失敗、取消或
      # `changes` 本身失敗（下游全被跳過）都算失敗。
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

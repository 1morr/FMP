name: CI

# No path filter. Markdown carries rules that tests enforce -- the agent
# instruction files most of all -- so a prose-only commit is exactly the one
# that must not skip `validate`. `paths-ignore` is trigger-level and cannot
# skip only the build jobs; measured run time is 23 minutes total (validate 7,
# Android 6, Windows 10), which is not worth a changed-files job to avoid.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  validate:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test/workflows/pubspec_version_test.dart compares the committed
          # version against the newest reachable tag; a shallow checkout has
          # no tags and the guard would silently skip.
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # Runs before codegen: generated code (e.g. slang's strings.g.dart) is
      # not guaranteed to be dart-format-clean, and *.g.dart is gitignored so
      # it does not exist yet at this point on a fresh checkout anyway.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Static analysis
        run: flutter analyze

      # test/live/ talks to Bilibili, YouTube and NetEase for real. Excluded
      # here because an upstream API change must not turn an unrelated pull
      # request red; run it by hand when playback breaks.
      - name: Unit and widget tests
        run: flutter test --coverage --exclude-tags live

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    name: Android Build Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Build Android arm64 APK
        run: flutter build apk --release --target-platform android-arm64

  build-windows:
    name: Windows Build Smoke
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate code (Isar models)
        run: dart run build_runner build

      - name: Generate i18n (slang)
        run: dart run slang

      - name: Build Windows release
        run: flutter build windows --release

name: App Release

# 新 App（app/）的發版（ADR 0022 §決定 1），全部在同一個 workflow：
# 1. release-please 依 Conventional Commits 維護發版 PR（改 app/pubspec.yaml、
#    app/CHANGELOG.md、.release-please-manifest.json）。
# 2. 發版 PR 合併後的那一次 run，release-please 建 tag v{版本} 與草稿 release
#    （release-please-config.json 的 draft、force-tag-creation），接著建置、
#    verify、上傳 asset，最後把草稿轉為正式發布。沒有新 release 就到此為止。
# GitHub 預設 token 建的 tag 與 release 不會觸發其他 workflow，所以建置與發布
# 不能拆到 tag 觸發的另一個 workflow。
#
# 只能手動觸發：重寫期間不發版（M1 prd 擁有者決定 4），M9 才加
# `push: branches: [main]`。閘門：app/test/release/release_workflow_test.dart。
# 發版的契約（版本號、簽名、失敗時怎麼辦）見 app/AGENTS.md § 發版。
on:
  workflow_dispatch:

permissions: {}

# 一次只跑一個：兩個 run 同時跑 release-please 可能對同一個發版 PR 各建一次
# release。
concurrency:
  group: app-release
  cancel-in-progress: false

env:
  # 與 ci.yml 的 APP_FLUTTER_VERSION 相同。
  APP_FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  release-please:
    name: Release PR and Draft Release
    # release-please 一律處理預設分支；從別的分支觸發時，跑的 workflow 與它處理
    # 的 main 不是同一份，所以不跑。
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # tag、草稿 release、發版 PR 的分支
      contents: write
      # 開、更新發版 PR
      pull-requests: write
      # 發版 PR 的 autorelease 標籤
      issues: write
    outputs:
      # 套件路徑是 app，所以 release-please 的輸出都帶 `app--` 前綴；沒有建
      # release 時它們不存在，下游 job 的條件因此為否。
      release_created: ${{ steps.release.outputs['app--release_created'] }}
      tag: ${{ steps.release.outputs['app--tag_name'] }}
      sha: ${{ steps.release.outputs['app--sha'] }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      # 設定檔與 manifest 用預設路徑（repo 根的 release-please-config.json、
      # .release-please-manifest.json）。
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # versionCode 沿用舊版的公式（ADR 0022 §決定 1），舊版使用者的 APK 才升得
      # 上來。建置時以 --build-number 帶入，pubspec 不寫 build number（release-please
      # 會把它加 1）。verify 以 Dart 再算一次核對。
      - name: Compute the version code
        id: version
        if: steps.release.outputs['app--release_created'] == 'true'
        env:
          TAG: ${{ steps.release.outputs['app--tag_name'] }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release-please created $TAG; expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "::error::$TAG does not fit major*1000000 + minor*1000 + patch"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APKs
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      VERSION_CODE: ${{ needs.release-please.outputs.version_code }}

    steps:
      # 建 release-please 打 tag 的那個 commit，不是觸發時的 HEAD。
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # AGP 9 要 JDK 17 以上；順便快取 Gradle。
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # 與舊版同一把金鑰（ADR 0008 §決定 3），secrets 名稱也沿用舊 release.yml。
      # 缺任何一個就失敗：android/app/build.gradle.kts 沒有 key.properties 時會
      # 退回 debug 簽名，不能讓它悄悄發生（verify 也會擋 debug 簽名）。金鑰放在
      # runner 的暫存目錄，不在 checkout 裡。
      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("KEYSTORE_PASSWORD")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required release secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # 每個 ABI 一個 APK，加一個含全部 ABI 的 universal（ADR 0022 §決定 3）。
      # 不用 --split-per-abi：它把 versionCode 加上 ABI 的位移，與舊版的公式不同。
      - name: Build APKs (prod, release)
        run: |
          out="$RUNNER_TEMP/android-assets"
          mkdir -p "$out"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            case "$abi" in
              arm64-v8a) platform=(--target-platform android-arm64) ;;
              armeabi-v7a) platform=(--target-platform android-arm) ;;
              x86_64) platform=(--target-platform android-x64) ;;
              universal) platform=() ;;
            esac
            flutter build apk --flavor prod --release \
              --build-name "$VERSION" --build-number "$VERSION_CODE" "${platform[@]}"
            mv build/app/outputs/flutter-apk/app-prod-release.apk "$out/fmp-$TAG-android-$abi.apk"
          done
          ls -l "$out"

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: ${{ runner.temp }}/android-assets/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows Zip and Installer
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # 預裝 Inno Setup 6（runner-images 的 Windows2022-Readme）。
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
        shell: pwsh
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      VERSION_CODE: ${{ needs.release-please.outputs.version_code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # media_kit_libs_windows_audio 在建置時從 GitHub 下載 libmpv。
      - name: Build Windows (prod, release)
        run: flutter build windows --flavor prod --release --build-name $env:VERSION --build-number $env:VERSION_CODE

      # zip 與安裝檔裝的是同一個程式目錄。VC++ runtime 放進去：安裝檔會先清空
      # 安裝目錄（windows/installer/fmp.iss 的 [InstallDelete]），舊版安裝檔附的
      # 那三個 DLL 也在其中，沒有系統 runtime 的機器更新後就開不起來。
      - name: Stage the program directory
        run: |
          $program = Join-Path $env:RUNNER_TEMP 'fmp'
          Copy-Item -Recurse 'build\windows\x64\prod\runner\Release' $program
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $env:SystemRoot "System32\$dll") $program
          }
          Get-ChildItem $program

      # zip 的根就是程式目錄（ADR 0022 §決定 4）：舊版的免安裝版更新器把整包解開
      # 後蓋到程式目錄，再啟動其中的 fmp.exe。
      - name: Package the zip
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'windows-assets'
          New-Item -ItemType Directory -Force $out | Out-Null
          $program = Join-Path $env:RUNNER_TEMP 'fmp'
          Compress-Archive -Path "$program\*" -DestinationPath (Join-Path $out "fmp-$env:TAG-windows.zip")

      # 手寫的 .iss，不用舊版的 inno_bundle：它不認得 flavor 的輸出目錄，舊版還
      # 要以 regex 修補它產生的腳本才有 AppUserModelID。
      - name: Build the installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup 6 is not installed at $iscc"
            exit 1
          }
          $program = Join-Path $env:RUNNER_TEMP 'fmp'
          $installer = Join-Path $env:RUNNER_TEMP 'installer'
          & $iscc "/DAppVersion=$env:VERSION" "/DProgramDir=$program" "/DOutputDir=$installer" 'windows\installer\fmp.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'windows-assets'
          Move-Item (Join-Path $installer 'fmp-setup.exe') (Join-Path $out "fmp-$env:TAG-windows-installer.exe")
          Get-ChildItem $out

      - name: Upload Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: ${{ runner.temp }}/windows-assets/
          if-no-files-found: error
          retention-days: 7

  # 草稿轉正式之前看過產物的只有這個 job。publish 上傳的就是它檢查過、再打包成
  # release-assets 的那一份。
  verify:
    name: Verify Release Assets
    needs: [release-please, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      # 不指定 ref：檢查腳本跟著 workflow 走，不跟著被發布的 commit 走。
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.APP_FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ env.APP_FLUTTER_VERSION }}-${{ runner.os }}
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      # 不設 name：這次 run 的每個 artifact 都收進來，多出來的檔案會被檢查擋下。
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      # checksums 只列版本化檔（ADR 0022 §決定 3）；別名是版本化檔的複本，舊版
      # 更新器下載別名時也拿版本化檔名去查 checksums。
      - name: Add the checksums and the latest aliases
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          versioned=()
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            versioned+=("fmp-$TAG-android-$abi.apk")
          done
          versioned+=("fmp-$TAG-windows-installer.exe" "fmp-$TAG-windows.zip")
          sha256sum "${versioned[@]}" > "fmp-$TAG-checksums.sha256"
          cat "fmp-$TAG-checksums.sha256"
          for suffix in android-arm64-v8a.apk android-universal.apk windows.zip windows-installer.exe; do
            cp "fmp-$TAG-$suffix" "fmp-latest-$suffix"
          done

      - name: Verify release assets
        run: |
          ls -l "$RUNNER_TEMP/release-assets"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="$build_tools/aapt2" APKSIGNER="$build_tools/apksigner" \
            dart run tool/release/verify_release_assets.dart "$RUNNER_TEMP/release-assets" "$TAG"

      - name: Upload verified assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  # 上傳全部 asset 之後才轉為正式發布：`releases/latest` 不會指到缺檔的版本，
  # 舊版與新版的更新器看到的一定是完整的一組。上傳中途失敗只留下草稿。
  publish:
    name: Publish Release
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets

      # --clobber：重跑這個 job 時覆蓋上一次傳到一半的檔案。
      - name: Upload the assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest

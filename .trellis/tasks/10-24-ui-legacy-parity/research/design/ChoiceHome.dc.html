<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>B-08 B-15 選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1400px;height:820px;box-sizing:border-box;padding:32px 40px;background:#F4F1F8;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;display:flex;flex-direction:column;gap:20px">
  <h2 style="margin:0;font-size:22px;font-weight:700">B-08 首頁歌單卡片</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">舊版：有底色卡片＋桌面捲動箭頭</span></div>
      <div style="background:#141218;border-radius:12px;padding:20px;height:220px;position:relative;overflow:hidden;color:#E6E0E9">
        <div style="font-size:18px;margin-bottom:12px">我的歌單</div>
        <div style="display:flex;gap:12px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
            <div style="width:120px;height:150px;border-radius:12px;background:#36343B;overflow:hidden;flex-shrink:0">
              <div style="height:96px;background:{{c.bg}}"></div>
              <div style="padding:8px"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</div><div style="font-size:11px;color:#CAC4D0">{{c.count}}</div></div>
            </div>
          </sc-for>
        </div>
        <div style="position:absolute;right:0;top:56px;width:90px;height:150px;background:linear-gradient(90deg,rgba(20,18,24,0),#141218)"></div>
        <span aria-hidden="true" style="position:absolute;right:16px;top:112px;width:36px;height:36px;border-radius:18px;background:#36343B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E6E0E9" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">新版：無底色、144dp 方形封面</span></div>
      <div style="background:#141218;border-radius:12px;padding:20px;height:220px;overflow:hidden;color:#E6E0E9">
        <div style="font-size:18px;margin-bottom:12px">我的歌單</div>
        <div style="display:flex;gap:8px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
            <div style="width:124px;flex-shrink:0;padding:4px;box-sizing:border-box">
              <div style="width:116px;height:116px;border-radius:8px;background:{{c.bg}}"></div>
              <div style="font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</div>
              <div style="font-size:11px;color:#CAC4D0">{{c.kind}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <h2 style="margin:12px 0 0;font-size:22px;font-weight:700">B-15 首頁的「正在播放」卡</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">舊版：首頁底部有正在播放＋接下來播放</span></div>
      <div style="background:#141218;border-radius:12px;padding:20px;height:270px;box-sizing:border-box;color:#E6E0E9;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:18px">正在播放</div>
        <div style="background:rgba(208,188,255,.3);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px">
          <div style="width:64px;height:64px;border-radius:8px;background:#3F7CAC"></div>
          <div style="flex:1"><div style="font-size:15px;font-weight:500">潮汐之間（Live at 河岸音樂節）</div><div style="font-size:12px;color:#CAC4D0">微光樂團</div></div>
          <span aria-hidden="true" style="width:44px;height:44px;border-radius:22px;background:#D0BCFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="#381E72"/></svg></span>
        </div>
        <div style="display:flex;align-items:center"><span style="font-size:16px;flex:1">接下來播放</span><span style="color:#D0BCFF;font-size:14px">查看佇列</span></div>
        <div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;border-radius:6px;background:#4E9A7E"></div><div style="font-size:13px">Northbound Lights<div style="font-size:11px;color:#CAC4D0">Lumen Drift</div></div></div>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">新版：不放，首頁到電台／最近播放為止</span></div>
      <div style="background:#141218;border-radius:12px;padding:20px;height:270px;box-sizing:border-box;color:#E6E0E9;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:18px">最近播放</div>
        <div style="display:flex;gap:12px">
          <div style="width:110px;height:110px;border-radius:12px;background:#C9A24A"></div>
          <div style="width:110px;height:110px;border-radius:12px;background:#B5838D"></div>
          <div style="width:110px;height:110px;border-radius:12px;background:#2F6E6E"></div>
          <div style="width:110px;height:110px;border-radius:12px;background:#7E6BC4"></div>
        </div>
        <div style="margin-top:auto;height:44px;border-radius:8px;background:#2B2930;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;color:#CAC4D0"><div style="width:28px;height:28px;border-radius:6px;background:#3F7CAC"></div>目前歌曲只在播放列與右側面板顯示</div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const cards = [['夜行列車', '86 首歌', '本機 · 86 首', '#C46B6B'], ['雨天的 Lo-fi 收藏', '128 首歌', '匯入 · 128 首', '#4E9A7E'], ['城市散步', '64 首歌', '匯入 · 64 首', '#C9A24A'], ['老派日語流行', '212 首歌', '匯入 · 212 首', '#5B5F97'], ['專注工作用', '45 首歌', '本機 · 45 首', '#B5838D']]
      .map(([name, count, kind, bg]) => ({ name, count, kind, bg }));
    return { cards };
  }
}
</script>
</body>
</html>

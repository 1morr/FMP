<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>佇列入口 選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1440px;height:760px;box-sizing:border-box;padding:32px 40px;background:#F4F1F8;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;display:flex;flex-direction:column;gap:18px">
  <h2 style="margin:0;font-size:22px;font-weight:700">B-17／P-03／P-21 佇列從哪裡進</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">回到一級導覽：桌面側欄、手機底部 6 項，佇列是整頁</span></div>
      <div style="width:660px;height:300px;border-radius:12px;overflow:hidden;background:#141218;display:flex;color:#E6E0E9">
        <div style="width:64px;background:#1D1B20;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:18px">
          <sc-for list="{{rail}}" as="n" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#CAC4D0"><span style="width:44px;height:26px;border-radius:13px;background:{{n.bg}};display:flex;align-items:center;justify-content:center;color:{{n.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg></span>{{n.label}}</div>
          </sc-for>
        </div>
        <div style="flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:8px">
          <div style="text-align:center;font-size:17px">播放佇列</div>
          <div style="height:30px;border-radius:4px;background:rgba(208,188,255,.12);display:flex;align-items:center;padding:0 10px;font-size:12px">正在播放第 12 首<span style="margin-left:auto;color:#CAC4D0">共 48 首</span></div>
          <div style="height:40px;border-radius:6px;background:#211F26"></div><div style="height:40px;border-radius:6px;background:rgba(208,188,255,.16)"></div><div style="height:40px;border-radius:6px;background:#211F26"></div><div style="height:40px;border-radius:6px;background:#211F26"></div>
        </div>
        <div style="width:150px;background:#1D1B20;padding:12px;font-size:12px;color:#CAC4D0">正在播放面板<div style="height:80px;border-radius:8px;background:#3F7CAC;margin-top:10px"></div></div>
      </div>
      <div style="display:flex;gap:16px;align-items:flex-end">
        <div style="width:390px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #E6E0E9"><dc-import name="PhoneNav" active="queue" show-tags="{{false}}" hint-size="390px,114px"></dc-import></div>
        <span style="font-size:13px;color:#49454F;padding-bottom:8px">手機：6 項、標籤兩字</span>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">不當導覽項：播放列「佇列」鈕 → 桌面右側面板／手機底部面板</span></div>
      <div style="width:660px;border-radius:12px;overflow:hidden;background:#141218;color:#E6E0E9">
        <div style="height:228px;display:flex">
          <div style="width:64px;background:#1D1B20"></div>
          <div style="flex:1;padding:16px;font-size:15px">首頁（任何頁）<div style="height:60px;border-radius:8px;background:#211F26;margin-top:12px"></div><div style="height:60px;border-radius:8px;background:#211F26;margin-top:10px"></div></div>
          <div style="width:240px;background:#1D1B20;border-left:1px solid #36343B;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;gap:4px;font-size:12px"><span style="padding:4px 10px;color:#CAC4D0">正在播放</span><span style="padding:4px 10px;border-bottom:2px solid #D0BCFF;color:#D0BCFF">佇列</span></div>
            <div style="font-size:11px;color:#CAC4D0">第 12 首／共 48 首</div>
            <div style="height:34px;border-radius:6px;background:rgba(208,188,255,.16)"></div><div style="height:34px;border-radius:6px;background:#211F26"></div><div style="height:34px;border-radius:6px;background:#211F26"></div>
          </div>
        </div>
        <dc-import name="MiniPlayer" w="{{660}}" queue-button="{{true}}" hint-size="660px,72px"></dc-import>
      </div>
      <div style="display:flex;gap:16px;align-items:flex-end">
        <div style="width:390px;border-radius:12px;overflow:hidden;background:#1D1B20">
          <div style="background:#F7F2FA;border-radius:16px 16px 0 0;padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px">
            <div style="width:32px;height:4px;border-radius:2px;background:#79747E;align-self:center"></div>
            <div style="font-size:15px;font-weight:500">播放佇列 <span style="font-size:12px;color:#49454F;font-weight:400">共 48 首</span></div>
            <div style="height:36px;border-radius:6px;background:rgba(103,80,164,.12)"></div><div style="height:36px;border-radius:6px;background:#ECE6F0"></div>
          </div>
          <dc-import name="PhoneMini" queue-button="{{true}}" show-tags="{{false}}" hint-size="390px,64px"></dc-import>
        </div>
        <span style="font-size:13px;color:#49454F;padding-bottom:8px">手機：播放列加佇列鈕，開底部面板</span>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const rail = [
      ['首頁', 'M3 11l9-7 9 7v9h-6v-6H9v6H3z'],
      ['搜尋', 'M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4'],
      ['佇列', 'M3 6h12M3 11h12M3 16h7M19 5v11M14 16.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0', true],
      ['音樂庫', 'M8 3h12v12H8zM4 7v13h13'],
      ['電台', 'M3 9h18v11H3zM6 9l12-5'],
      ['設定', 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 2v3M12 19v3M2 12h3M19 12h3']
    ].map(([label, d, on]) => ({ label, d, bg: on ? '#4A4458' : 'transparent', fg: on ? '#E8DEF8' : '#CAC4D0' }));
    return { rail };
  }
}
</script>
</body>
</html>

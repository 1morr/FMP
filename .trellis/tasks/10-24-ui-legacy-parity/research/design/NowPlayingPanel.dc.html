  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="width:308px;height:173px;border-radius:16px;background:#3F7CAC;position:relative;overflow:hidden">
      <div style="position:absolute;left:-30px;top:60px;width:200px;height:200px;border-radius:100px;background:#5A97C4"></div>
      <div style="position:absolute;right:40px;top:30px;width:70px;height:70px;border-radius:12px;background:rgba(255,255,255,.28);transform:rotate(14deg)"></div>
      <span style="position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px">4:09</span>
    </div>

      <span>微光樂團</span><span style="color:#CAC4D0">· 2026-09-12</span>

    <div style="display:flex;gap:14px;font-size:12px;color:#CAC4D0"><span>▶ 32.4 萬</span><span>讚 1.2 萬</span><span>收藏 8,421</span></div>

      <div style="width:56px;height:56px;border-radius:8px;background:#4E9A7E;position:relative;overflow:hidden;flex-shrink:0"><div style="position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.35)"></div></div>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>網址匯入 iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FEF7FF;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;position:relative;overflow:hidden;border-radius:44px">
  <div style="height:54px;position:relative">
    <div style="position:absolute;left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000;z-index:2"></div>
  </div>
  <main style="height:612px;overflow:hidden">
    <header style="height:56px;display:flex;align-items:center;padding:0 4px">
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg></span>
      <h1 style="flex:1;margin:0;text-align:center;font-size:20px;font-weight:400">音樂庫</h1>
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>
    </header>
    <div style="height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#49454F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg><span style="flex:1">歷史</span><span style="color:#49454F">›</span></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:8px 16px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
        <div style="border-radius:12px;background:#E6E0E9;overflow:hidden">
          <div style="height:150px;background:{{c.bg}}"></div>
          <div style="padding:8px 10px"><div style="font-size:14px;font-weight:500">{{c.name}}</div><div style="font-size:12px;color:#49454F">{{c.count}}</div></div>
        </div>
      </sc-for>
    </div>
  </main>
  <div style="position:absolute;left:0;bottom:0">
    <dc-import name="PhoneMini" show-tags="{{false}}" hint-size="390px,64px"></dc-import>
    <dc-import name="PhoneNav" active="library" show-tags="{{false}}" hint-size="390px,114px"></dc-import>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.32)"></div>
  <span style="display:{{tagDisplay}};position:absolute;left:24px;top:184px;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#C2255C;color:#fff;font-size:10px;font-weight:600">背景：L-08 手機也用格狀（照建議，未定）</span>

  <div role="dialog" aria-label="匯入歌單" style="position:absolute;left:24px;right:24px;top:220px;background:#ECE6F0;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)">
    <h2 style="margin:0;font-size:22px;font-weight:400">匯入歌單</h2>
    <label style="height:52px;border-radius:12px;background:#E6E0E9;display:flex;align-items:center;gap:8px;padding:0 12px;color:rgba(29,27,32,.45);font-size:14px;box-shadow:inset 0 0 0 1px #CAC4D0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <input aria-label="歌單網址" disabled value="https://www.bilibili.com/medialist/…" style="flex:1;border:0;background:none;font:inherit;color:inherit;outline:none;min-width:0">
    </label>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:14px;color:rgba(29,27,32,.55)">
      <span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:9px;border:2px solid rgba(103,80,164,.5);box-sizing:border-box;display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:4px;background:rgba(103,80,164,.5)"></span></span>匯入為平台歌單（嗶哩嗶哩）</span>
      <span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:9px;border:2px solid rgba(73,69,79,.4);box-sizing:border-box"></span>配對到其他音源</span>
      <span style="display:{{tagDisplay}};align-self:flex-start;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#0B7285;color:#fff;font-size:10px;font-weight:600">新版新增</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:baseline"><span style="font-size:15px;font-weight:600;color:#6750A4">已匯入 312／1195 首</span><span style="margin-left:auto;font-size:12px;color:#49454F">26%</span></div>
      <div style="height:4px;border-radius:2px;background:#CAC4D0"><div style="width:26%;height:4px;border-radius:2px;background:#6750A4"></div></div>
      <div style="font-size:12px;color:#49454F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">正在讀取：晚安，月台（雨夜吉他版）</div>
    </div>
    <span style="display:{{tagDisplay}};align-self:flex-start;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#C2255C;color:#fff;font-size:10px;font-weight:600">L-02 A 確定式進度＋目前曲名＋可取消</span>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button style="height:40px;padding:0 16px;border-radius:20px;border:0;background:none;color:#6750A4;font:inherit;font-size:14px;font-weight:500">取消</button>
      <button disabled style="height:40px;padding:0 20px;border-radius:20px;border:0;background:rgba(29,27,32,.12);color:rgba(29,27,32,.38);font:inherit;font-size:14px;display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:7px;border:2px solid rgba(29,27,32,.38);border-right-color:transparent;box-sizing:border-box"></span>匯入</button>
    </div>
  </div>
  <div style="position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:#1D1B20"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTags":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tags = this.props.showTags ?? true;
    const cards = [['夜行列車', '86 首歌', '#C46B6B'], ['雨天的 Lo-fi 收藏', '1195 首歌', '#4E9A7E'], ['城市散步', '64 首歌', '#C9A24A'], ['老派日語流行', '212 首歌', '#5B5F97']]
      .map(([name, count, bg]) => ({ name, count, bg }));
    return { cards, tagDisplay: tags ? 'inline-flex' : 'none' };
  }
}
</script>
</body>
</html>

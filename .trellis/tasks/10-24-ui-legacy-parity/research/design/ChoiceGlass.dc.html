<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>APL-1 選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1400px;height:760px;box-sizing:border-box;padding:32px 40px;background:#F4F1F8;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;display:flex;flex-direction:column;gap:18px">
  <h2 style="margin:0;font-size:22px;font-weight:700">APL-1 iOS／macOS 要不要用液態玻璃</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">全平台同一套舊版 Material（不透明面板）＋ Apple 慣例</span></div>
      <div style="display:flex;gap:16px">
        <div style="width:400px;height:300px;border-radius:12px;overflow:hidden;background:#141218;display:flex;flex-direction:column;color:#E6E0E9">
          <div style="height:22px;background:#141218;position:relative"><span style="position:absolute;left:8px;top:6px;display:flex;gap:5px"><span style="width:9px;height:9px;border-radius:5px;background:#FF5F57;display:block"></span><span style="width:9px;height:9px;border-radius:5px;background:#FEBC2E;display:block"></span><span style="width:9px;height:9px;border-radius:5px;background:#28C840;display:block"></span></span></div>
          <div style="flex:1;display:flex">
            <div style="width:44px;background:#1D1B20;border-right:1px solid #36343B"></div>
            <div style="flex:1;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start">
              <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6"><div style="height:70px;border-radius:10px;background:{{t}}"></div></sc-for>
            </div>
            <div style="width:90px;background:#1D1B20;border-left:1px solid #36343B"></div>
          </div>
          <div style="height:46px;background:#2B2930;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px"><span style="width:30px;height:30px;border-radius:6px;background:#3F7CAC"></span>潮汐之間<span style="margin-left:auto;width:26px;height:26px;border-radius:13px;background:#D0BCFF"></span></div>
        </div>
        <div style="width:200px;height:300px;border-radius:26px;overflow:hidden;background:#FEF7FF;box-shadow:0 0 0 5px #1D1B20;display:flex;flex-direction:column">
          <div style="flex:1;padding:30px 10px 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6"><div style="height:58px;border-radius:10px;background:{{t}}"></div></sc-for>
          </div>
          <div style="height:38px;background:#ECE6F0;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10px"><span style="width:24px;height:24px;border-radius:5px;background:#3F7CAC"></span>潮汐之間</div>
          <div style="height:48px;background:#FEF7FF;display:flex;justify-content:space-around;align-items:center"><span style="width:36px;height:20px;border-radius:10px;background:#E8DEF8"></span><span style="width:16px;height:16px;border-radius:4px;background:#CAC4D0"></span><span style="width:16px;height:16px;border-radius:4px;background:#CAC4D0"></span><span style="width:16px;height:16px;border-radius:4px;background:#CAC4D0"></span></div>
        </div>
      </div>
      <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#1D1B20">
        <li>一套元件、一套測試，三個平台長一樣</li>
        <li>Apple 的部分只做：紅綠燈標題列、⌘ 快捷鍵、蘋方、安全區域與右滑返回</li>
      </ul>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">Apple 平台用液態玻璃：浮動、半透明的導覽與播放列</span></div>
      <div style="display:flex;gap:16px">
        <div style="width:400px;height:300px;border-radius:12px;overflow:hidden;background:#141218;position:relative;color:#fff">
          <div style="position:absolute;left:0;right:0;top:0;bottom:0;padding:30px 12px 12px 74px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6"><div style="height:90px;border-radius:10px;background:{{t}}"></div></sc-for>
          </div>
          <span style="position:absolute;left:14px;top:12px;display:flex;gap:5px;z-index:2"><span style="width:9px;height:9px;border-radius:5px;background:#FF5F57;display:block"></span><span style="width:9px;height:9px;border-radius:5px;background:#FEBC2E;display:block"></span><span style="width:9px;height:9px;border-radius:5px;background:#28C840;display:block"></span></span>
          <div style="position:absolute;left:8px;top:8px;bottom:62px;width:56px;border-radius:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)"></div>
          <div style="position:absolute;left:80px;right:16px;bottom:10px;height:44px;border-radius:22px;background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;padding:0 8px;font-size:11px"><span style="width:28px;height:28px;border-radius:14px;background:#3F7CAC"></span>潮汐之間<span style="margin-left:auto;width:26px;height:26px;border-radius:13px;background:rgba(255,255,255,.85)"></span></div>
        </div>
        <div style="width:200px;height:300px;border-radius:26px;overflow:hidden;background:#FEF7FF;box-shadow:0 0 0 5px #1D1B20;position:relative">
          <div style="position:absolute;inset:0;padding:30px 10px 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start">
            <sc-for list="{{tilesLong}}" as="t" hint-placeholder-count="8"><div style="height:58px;border-radius:10px;background:{{t}}"></div></sc-for>
          </div>
          <div style="position:absolute;left:10px;right:10px;bottom:56px;height:36px;border-radius:18px;background:rgba(255,255,255,.4);backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;padding:0 6px;font-size:10px"><span style="width:24px;height:24px;border-radius:12px;background:#3F7CAC"></span>潮汐之間</div>
          <div style="position:absolute;left:16px;right:16px;bottom:12px;height:38px;border-radius:19px;background:rgba(255,255,255,.4);backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.15);display:flex;justify-content:space-around;align-items:center"><span style="width:34px;height:22px;border-radius:11px;background:rgba(103,80,164,.25)"></span><span style="width:14px;height:14px;border-radius:4px;background:#49454F"></span><span style="width:14px;height:14px;border-radius:4px;background:#49454F"></span><span style="width:14px;height:14px;border-radius:4px;background:#49454F"></span></div>
        </div>
      </div>
      <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:#1D1B20">
        <li>Flutter 官方液態玻璃元件還沒釋出（flutter#170310），只能自己仿</li>
        <li>Apple 平台與 Windows／Android 要維護兩套外觀；ADR 0024 已否決整套玻璃</li>
      </ul>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const tiles = ['#C46B6B', '#4E9A7E', '#C9A24A', '#5B5F97', '#B5838D', '#2F6E6E'];
    return { tiles, tilesLong: tiles.concat(['#7E6BC4', '#3F7CAC']) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>設定 Mac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1280px;height:800px;background:#141218">
  <dc-import name="SettingsWin" platform="mac" show-tags="{{showTags}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTags":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { showTags: this.props.showTags ?? true };
  }
}
</script>
</body>
</html>

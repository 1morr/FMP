<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>B-18 B-20 選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1400px;height:760px;box-sizing:border-box;padding:32px 40px;background:#F4F1F8;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;display:flex;flex-direction:column;gap:18px">
  <h2 style="margin:0;font-size:22px;font-weight:700">B-18 桌面側欄</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">舊版：可在 72 ↔ 256dp 間展開，展開時顯示 FMP</span></div>
      <div style="display:flex;gap:16px;height:300px">
        <div style="width:256px;background:#1D1B20;border-radius:12px;color:#E6E0E9;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:center;height:48px;padding-left:12px"><span style="font-size:24px;font-weight:700;flex:1">FMP</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></div>
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <div style="height:38px;border-radius:19px;background:{{n.bg}};display:flex;align-items:center;gap:12px;padding:0 16px;font-size:14px;color:{{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</div>
          </sc-for>
        </div>
        <div style="width:72px;background:#1D1B20;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:16px;color:#CAC4D0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px"><span style="width:44px;height:26px;border-radius:13px;background:{{n.bg}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg></span>{{n.label}}</div>
          </sc-for>
        </div>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">新版：M3 軌道（中寬）／常駐抽屜（large 以上，約 360dp）</span></div>
      <div style="display:flex;gap:16px;height:300px">
        <div style="width:80px;background:#141218;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:20px;gap:14px;color:#CAC4D0">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px"><span style="width:52px;height:28px;border-radius:14px;background:{{n.bg}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg></span>{{n.label}}</div>
          </sc-for>
        </div>
        <div style="width:330px;background:#141218;border-radius:12px;color:#E6E0E9;padding:16px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <div style="height:44px;border-radius:22px;background:{{n.bg}};display:flex;align-items:center;gap:12px;padding:0 16px;font-size:14px;color:{{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</div>
          </sc-for>
        </div>
      </div>
    </section>
  </div>

  <h2 style="margin:10px 0 0;font-size:22px;font-weight:700">B-20 一級／子頁的頁頂標題</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">舊版：置中 AppBar，動作在右，捲動時出現陰影</span></div>
      <div style="background:#141218;border-radius:12px;height:120px;color:#E6E0E9;overflow:hidden">
        <div style="height:64px;display:flex;align-items:center;padding:0 12px;box-shadow:0 1px 3px rgba(0,0,0,.6);background:#1D1B20">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          <span style="flex:1;text-align:center;font-size:22px">播放歷史</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"/></svg>
        </div>
        <div style="padding:12px 16px;font-size:13px;color:#CAC4D0">（內容捲到標題列下方時，標題列浮起一層）</div>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">新版：靠左的頁內大標題，跟內容一起捲走</span></div>
      <div style="background:#141218;border-radius:12px;height:120px;color:#E6E0E9;overflow:hidden">
        <div style="height:72px;display:flex;align-items:center;padding:0 16px;gap:12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          <span style="flex:1;font-size:24px">播放歷史</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      ['首頁', 'M3 11l9-7 9 7v9h-6v-6H9v6H3z', true],
      ['搜尋', 'M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4'],
      ['佇列', 'M3 6h12M3 11h12M3 16h7M19 5v11M14 16.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0'],
      ['音樂庫', 'M8 3h12v12H8zM4 7v13h13'],
      ['電台', 'M3 9h18v11H3zM6 9l12-5'],
      ['設定', 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M12 2v3M12 19v3M2 12h3M19 12h3']
    ].map(([label, d, on]) => ({ label, d, bg: on ? '#4A4458' : 'transparent', fg: on ? '#E8DEF8' : '#CAC4D0' }));
    return { nav };
  }
}
</script>
</body>
</html>

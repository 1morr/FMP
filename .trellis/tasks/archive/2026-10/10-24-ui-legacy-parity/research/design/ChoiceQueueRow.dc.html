<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>P-04 選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1400px;height:520px;box-sizing:border-box;padding:32px 40px;background:#F4F1F8;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;display:flex;flex-direction:column;gap:18px">
  <h2 style="margin:0;font-size:22px;font-weight:700">P-04 佇列每一列</h2>
  <div style="display:flex;gap:40px">
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">A</span><span style="font-size:16px;font-weight:600">舊版：時長＋×；長按整列拖曳；沒有選單</span></div>
      <div style="background:#141218;border-radius:12px;padding:12px;height:360px;box-sizing:border-box;color:#E6E0E9;position:relative">
        <div style="display:flex;align-items:center;height:72px;gap:14px;padding:0 8px">
          <div style="width:48px;height:48px;border-radius:8px;background:#C46B6B"></div>
          <div style="flex:1"><div style="font-size:16px">晚安，月台（雨夜吉他版）</div><div style="font-size:13px;color:#CAC4D0">白晝計畫</div></div>
          <span style="font-size:12px;color:#CAC4D0">3:48</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <div style="height:2px;background:#D0BCFF;margin:0 8px"></div>
        <div style="display:flex;align-items:center;height:72px;gap:14px;padding:0 8px;opacity:.3">
          <div style="width:48px;height:48px;border-radius:8px;background:#4E9A7E"></div>
          <div style="flex:1"><div style="font-size:16px">Northbound Lights</div><div style="font-size:13px;color:#CAC4D0">Lumen Drift</div></div>
          <span style="font-size:12px;color:#CAC4D0">3:31</span>
        </div>
        <div style="position:absolute;left:40px;right:-10px;top:92px;display:flex;align-items:center;height:72px;gap:14px;padding:0 8px;background:#2B2930;border-radius:10px;box-shadow:0 8px 16px rgba(0,0,0,.5)">
          <div style="width:48px;height:48px;border-radius:8px;background:#4E9A7E"></div>
          <div style="flex:1"><div style="font-size:16px">Northbound Lights</div><div style="font-size:13px;color:#CAC4D0">Lumen Drift</div></div>
          <span style="font-size:12px;color:#CAC4D0">長按拖曳中</span>
        </div>
        <div style="display:flex;align-items:center;height:72px;gap:14px;padding:0 8px">
          <div style="width:48px;height:48px;border-radius:8px;background:#C9A24A"></div>
          <div style="flex:1"><div style="font-size:16px">迴聲小巷 Echo Alley</div><div style="font-size:13px;color:#CAC4D0">Echo Avenue</div></div>
          <span style="font-size:12px;color:#CAC4D0">4:02</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
      </div>
    </section>
    <section style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:16px;background:#1D1B20;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">B</span><span style="font-size:16px;font-weight:600">合併：時長＋×＋把手；右鍵／長按開選單</span></div>
      <div style="background:#141218;border-radius:12px;padding:12px;height:360px;box-sizing:border-box;color:#E6E0E9;position:relative">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;height:72px;gap:14px;padding:0 8px;border-radius:8px;background:{{r.bg}}">
            <div style="width:48px;height:48px;border-radius:8px;background:{{r.c}}"></div>
            <div style="flex:1"><div style="font-size:16px">{{r.t}}</div><div style="font-size:13px;color:#CAC4D0">{{r.a}}</div></div>
            <span style="font-size:12px;color:#CAC4D0">{{r.d}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#938F99" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
          </div>
        </sc-for>
        <div role="menu" aria-label="曲目選單" style="position:absolute;left:220px;top:120px;width:220px;background:#2B2930;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.5);padding:6px 0;font-size:14px">
          <div style="padding:9px 16px">下一首播放</div>
          <div style="padding:9px 16px">開始 Mix</div>
          <div style="padding:9px 16px">加入歌單…</div>
          <div style="padding:9px 16px">加入遠端歌單…</div>
          <div style="height:1px;background:#49454F;margin:4px 0"></div>
          <div style="padding:9px 16px;color:#F2B8B5">從佇列移除</div>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { t: '晚安，月台（雨夜吉他版）', a: '白晝計畫', d: '3:48', c: '#C46B6B', bg: 'transparent' },
      { t: 'Northbound Lights', a: 'Lumen Drift', d: '3:31', c: '#4E9A7E', bg: 'rgba(208,188,255,.08)' },
      { t: '迴聲小巷 Echo Alley', a: 'Echo Avenue', d: '4:02', c: '#C9A24A', bg: 'transparent' },
      { t: 'Paper Moons (Live Session)', a: 'The Quiet Rooms', d: '3:57', c: '#5B5F97', bg: 'transparent' }
    ];
    return { rows };
  }
}
</script>
</body>
</html>

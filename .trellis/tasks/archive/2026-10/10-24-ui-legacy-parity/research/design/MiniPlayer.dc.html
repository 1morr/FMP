<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>桌面播放列</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div role="region" aria-label="播放列" style="width:{{w}}px;height:72px;box-sizing:border-box;background:#2B2930;color:#E6E0E9;font-family:'PingFang TC','Microsoft JhengHei UI','Noto Sans TC',sans-serif;position:relative;display:flex;align-items:center;padding:0 16px;gap:16px">
  <sc-if value="{{thin}}" hint-placeholder-val="{{true}}">
    <div style="position:absolute;left:0;right:0;top:0;height:2px;background:#36343B"><div style="width:35%;height:2px;background:#D0BCFF"></div></div>
  </sc-if>
  <sc-if value="{{hover}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;right:0;top:-3px;height:6px;background:#36343B;border-radius:3px"><div style="width:35%;height:6px;background:#D0BCFF;border-radius:3px"></div><div style="position:absolute;left:calc(35% - 6px);top:-3px;width:12px;height:12px;border-radius:6px;background:#D0BCFF"></div></div>
    <span style="position:absolute;left:8px;top:8px;font-size:11px;color:#CAC4D0">1:27</span>
    <span style="position:absolute;right:8px;top:8px;font-size:11px;color:#CAC4D0">4:09</span>
  </sc-if>
  <a href="#" aria-label="開啟播放頁" style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-decoration:none;color:inherit">
    <span style="width:48px;height:48px;border-radius:8px;background:#3F7CAC;position:relative;overflow:hidden;flex-shrink:0;display:block"><span style="position:absolute;left:-8px;top:18px;width:44px;height:44px;border-radius:22px;background:#5A97C4;display:block"></span></span>
    <span style="display:flex;flex-direction:column;min-width:0">
      <span style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">潮汐之間（Live at 河岸音樂節）</span>
      <span style="font-size:12px;color:#CAC4D0">微光樂團</span>
    </span>
  </a>
  <div style="display:flex;align-items:center;gap:6px">
    <button aria-label="隨機" style="width:40px;height:40px;border:0;background:none;color:#D0BCFF;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button aria-label="上一首" style="width:40px;height:40px;border:0;background:none;color:#E6E0E9;padding:0;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14" stroke="currentColor" stroke-width="2"/><path d="M19 5L9 12l10 7z" fill="currentColor"/></svg></button>
    <button aria-label="播放" style="width:44px;height:44px;border:0;background:none;color:#E6E0E9;padding:0;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg></button>
    <button aria-label="下一首" style="width:40px;height:40px;border:0;background:none;color:#E6E0E9;padding:0;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14" stroke="currentColor" stroke-width="2"/><path d="M5 5l10 7-10 7z" fill="currentColor"/></svg></button>
    <button aria-label="循環" style="width:40px;height:40px;border:0;background:none;color:#CAC4D0;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin-left:12px">
    <sc-if value="{{queueButton}}" hint-placeholder-val="{{false}}">
      <button aria-label="佇列" style="width:40px;height:40px;border:0;border-radius:20px;background:#4A4458;color:#E8DEF8;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h12M3 11h12M3 16h7M19 5v11M14 16.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0"/></svg></button>
    </sc-if>
    <button aria-label="輸出裝置" style="width:40px;height:40px;border:0;background:none;color:#CAC4D0;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2h12v20H6zM9 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0M11.5 6.5h1"/></svg></button>
    <button aria-label="靜音" style="width:40px;height:40px;border:0;background:none;color:#CAC4D0;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <div aria-label="音量" style="width:100px;height:4px;border-radius:2px;background:#49454F;position:relative"><div style="width:65px;height:4px;border-radius:2px;background:#D0BCFF"></div><div style="position:absolute;left:59px;top:-4px;width:12px;height:12px;border-radius:6px;background:#D0BCFF"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1280},"hover":{"editor":"boolean","default":false},"queueButton":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const hover = this.props.hover ?? false;
    return { w: this.props.w ?? 1280, hover, thin: !hover, queueButton: this.props.queueButton ?? false };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>佇列 iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FEF7FF;color:#1D1B20;font-family:'PingFang TC','Noto Sans TC',sans-serif;position:relative;overflow:hidden;border-radius:44px">
  <div style="height:54px;position:relative;border-bottom:1px dashed {{safeLine}};box-sizing:border-box">
    <div style="position:absolute;left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000"></div>
  </div>
  <main style="height:612px;overflow:hidden;display:flex;flex-direction:column">
    <header style="height:56px;display:flex;align-items:center;padding:0 4px;flex-shrink:0;position:relative">
      <button aria-label="跳到底部" style="width:44px;height:44px;border:0;background:none;color:#1D1B20;padding:0;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14M12 4v12M7 11l5 5 5-5"/></svg></button>
      <h1 style="flex:1;margin:0;text-align:center;font-size:20px;font-weight:400">播放佇列</h1>
      <button aria-label="打亂" style="width:44px;height:44px;border:0;background:none;color:#1D1B20;padding:0;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button aria-label="清空佇列" style="width:44px;height:44px;border:0;background:none;color:#1D1B20;padding:0;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </header>
    <a href="#" style="height:44px;display:flex;align-items:center;padding:0 16px;background:rgba(103,80,164,.1);color:#1D1B20;text-decoration:none;font-size:14px;flex-shrink:0;position:relative">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="margin-right:8px"><path d="M7 4.5v15l12.5-7.5z" fill="#6750A4"/></svg>
      <span style="flex:1">正在播放第 12 首</span><span style="color:#49454F">共 48 首</span>
      <span style="display:{{tagDisplay}};position:absolute;left:150px;top:-8px;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#C2255C;color:#fff;font-size:10px;font-weight:600">P-06 照舊版</span>
    </a>
    <div style="min-height:34px;display:flex;align-items:center;gap:6px;padding:4px 16px;font-size:12px;color:#49454F;background:#F7F2FA;flex-shrink:0;position:relative;box-sizing:border-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6750A4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      隨機已開啟：順序跟著位置；拖曳只換歌，不改順序
      <span style="display:{{tagDisplay}};position:absolute;right:8px;top:-8px;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#0B7285;color:#fff;font-size:10px;font-weight:600">新版新增</span>
    </div>
    <div style="padding:0 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;height:72px;gap:12px;padding:0 0 0 12px">
          <span style="width:48px;height:48px;border-radius:8px;background:{{r.bg}};position:relative;overflow:hidden;flex-shrink:0;display:block">
            <span style="position:absolute;left:30%;top:30%;width:55%;height:55%;border-radius:{{r.rad}};background:{{r.fg}};display:block"></span>
            <sc-if value="{{r.playing}}" hint-placeholder-val="{{false}}">
              <span style="position:absolute;inset:0;background:rgba(103,80,164,.8);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:15px;box-sizing:border-box"><span style="width:3px;height:10px;background:#fff;display:block"></span><span style="width:3px;height:16px;background:#fff;display:block"></span><span style="width:3px;height:7px;background:#fff;display:block"></span></span>
            </sc-if>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{r.titleColor}};font-weight:{{r.weight}}">{{r.title}}</span>
            <span style="font-size:12px;color:#49454F">{{r.artist}} · {{r.dur}}</span>
          </span>
          <button aria-label="從佇列移除" style="width:40px;height:44px;border:0;background:none;color:#49454F;padding:0;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <button aria-label="拖曳排序" style="width:40px;height:44px;border:0;background:none;color:#79747E;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></button>
        </div>
      </sc-for>
    </div>
  </main>
  <span style="display:{{tagDisplay}};position:absolute;right:10px;top:200px;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#C2255C;color:#fff;font-size:10px;font-weight:600">P-04 B</span>
  <span style="display:{{tagDisplay}};position:absolute;left:150px;top:752px;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:#C2255C;color:#fff;font-size:10px;font-weight:600">P-03 A 佇列是導覽項（整頁）</span>
  <dc-import name="PhoneMini" show-tags="{{false}}" hint-size="390px,64px"></dc-import>
  <dc-import name="PhoneNav" active="queue" show-tags="{{showTags}}" hint-size="390px,114px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTags":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tags = this.props.showTags ?? true;
    const pal = [['#C46B6B','#E09A8F'],['#3F7CAC','#6FA3CC'],['#4E9A7E','#7FC2A6'],['#C9A24A','#E8C97A'],['#5B5F97','#8C90C4'],['#B5838D','#D8AEB6']];
    const rows = [
      ['晚安，月台（雨夜吉他版）', '白晝計畫', '3:48'],
      ['潮汐之間（Live at 河岸音樂節）', '微光樂團', '4:09', true],
      ['Northbound Lights', 'Lumen Drift', '3:31'],
      ['迴聲小巷 Echo Alley', 'Echo Avenue', '4:02'],
      ['Paper Moons (Live Session)', 'The Quiet Rooms', '3:57'],
      ['紙飛機', '林間合唱團', '4:31']
    ].map(([title, artist, dur, playing], i) => ({
      title, artist, dur, playing: !!playing, bg: pal[i][0], fg: pal[i][1], rad: i % 2 ? '18%' : '50%',
      titleColor: playing ? '#6750A4' : '#1D1B20', weight: playing ? 600 : 400
    }));
    return { rows, showTags: tags, tagDisplay: tags ? 'inline-flex' : 'none', safeLine: tags ? 'rgba(194,37,92,.55)' : 'transparent' };
  }
}
</script>
</body>
</html>

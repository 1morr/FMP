<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佇列 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
/* ---------- phone ---------- */
.qu-ititle { height: 44px; padding: 0 6px; font-size: 17px; font-weight: 600; color: var(--label); opacity: 0; transition: opacity var(--t-mid); }
.phone.scrolled .qu-ititle { opacity: 1; }
.qu-bar { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 5px; border-radius: var(--r-cap); flex: none; }
.qu-bar .tog { background: transparent; color: var(--glass-ink); }
.qu-bar .tog:hover { background: var(--glass-press); }
.qu-bar .tog.on { background: var(--accent-fill); color: var(--accent-ink); }
.qu-head { padding: 58px 20px 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.qu-head .qu-totop { text-align: left; }
.qu-list .row { gap: 10px; }
.qu-list .row .qu-x { width: 40px; color: var(--label-3); margin-right: -6px; }
.qu-list .row .qu-x:hover { color: var(--label); }
.qu-cap { padding: 14px 20px 6px; font-size: 13px; line-height: 18px; color: var(--label-2); }
.qu-now { background: var(--accent-soft); }
.qu-now::before, .qu-now + .row::before { display: none; }
.qu-fold { position: relative; display: flex; align-items: baseline; gap: 8px; padding: 18px 20px 8px; font-size: 13px; line-height: 18px; }
.qu-fold::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--sep-strong); }
.qu-fold b { font-weight: 700; color: var(--label); }
.qu-fold span { color: var(--label-2); }
.qu-end { padding: 18px 20px 0; font-size: 13px; line-height: 18px; color: var(--label-3); display: flex; align-items: center; gap: 6px; }
.qu-lift { margin: 0 8px; border-radius: 14px; background: var(--cell-2); box-shadow: var(--shadow-float); transform: scale(1.02); z-index: 3; }
.qu-lift::before, .qu-lift + .row::before { display: none; }
.qu-lift .qu-x { visibility: hidden; }
.qu-slot { height: 6px; margin: 0 20px; border-radius: 3px; background: var(--accent); opacity: .0; }
.qu-temp { margin: 10px 12px 12px; border-radius: var(--r-group); background: var(--accent-soft); padding: 12px 0 12px; }
.qu-temp .qu-th { display: flex; align-items: center; gap: 8px; padding: 0 14px 4px; font-size: 13px; line-height: 18px; }
.qu-temp .qu-th b { color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.qu-temp .row { padding: 0 14px; min-height: 60px; }
.qu-temp .row:hover { background: transparent; }
.qu-temp .qu-tf { display: flex; align-items: flex-start; gap: 10px; padding: 4px 14px 0; font-size: 13px; line-height: 18px; color: var(--label-2); }
.qu-temp .qu-tf svg.i { width: 16px; height: 16px; margin-top: 1px; color: var(--accent); }
.qu-temp .qu-tf b { color: var(--label); font-weight: 600; }
.qu-temp .qu-ta { display: flex; gap: 8px; padding: 10px 14px 0; }
.qu-tag { display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: 5px; background: var(--accent-fill); color: var(--accent-ink); font-size: 11px; font-weight: 700; flex: none; }
.qu-ret { color: var(--accent); font-weight: 600; }
.qu-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 120px 40px 0; gap: 8px; }
.qu-empty .qu-ei { width: 72px; height: 72px; border-radius: var(--r-cap); background: var(--fill); display: grid; place-items: center; color: var(--label-2); margin-bottom: 10px; }
.qu-empty .qu-ei svg.i { width: 34px; height: 34px; stroke-width: 1.6; }
.qu-empty .qu-eb { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; width: 220px; }
.qu-off { opacity: .38; pointer-events: none; }

/* ---------- desktop ---------- */
.qu-dh { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.qu-dh .qu-totop { text-align: left; }
.qu-keys { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--label-3); }
.qu-keys kbd { font: 600 10.5px var(--font-num); color: var(--label-2); background: var(--fill); border-radius: 5px; padding: 2px 6px; }
.qu-wt { pointer-events: auto !important; cursor: pointer; }
.qu-dtop { display: flex; align-items: center; gap: 6px; }
.qu-tr { display: grid; grid-template-columns: 26px 36px minmax(0, 1fr) 112px 48px 66px; align-items: center; gap: 10px; min-height: 48px; padding: 0 10px; border-radius: 8px; position: relative; }
.qu-tr:hover, .qu-tr.hov { background: var(--cell-hover); }
.qu-tr .qn { font-size: 12px; color: var(--label-3); text-align: right; }
.qu-tr .cover { width: 36px; height: 36px; }
.qu-tr .meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.qu-tr .t1 { font-size: 13px; line-height: 17px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.qu-tr .t2 { font-size: 12px; line-height: 15px; color: var(--label-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.qu-tr .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qu-tr .qs { font-size: 12px; }
.qu-tr .qs .src { gap: 6px; }
.qu-tr .qd { font-size: 12px; color: var(--label-3); text-align: right; }
.qu-tr .qa { display: flex; align-items: center; justify-content: flex-end; gap: 2px; opacity: 0; transition: opacity var(--t-fast); }
.qu-tr:hover .qa, .qu-tr.hov .qa { opacity: 1; }
.qu-tr .qa .ibtn { width: 28px; height: 28px; color: var(--label-2); }
.qu-tr .qa .qg { color: var(--label-3); display: grid; place-items: center; width: 26px; cursor: grab; }
.qu-tr.dim .meta, .qu-tr.dim .cover, .qu-tr.dim .qs { opacity: .45; }
.qu-tr.now { background: var(--accent-soft); }
.qu-tr.now .t1 { color: var(--accent); font-weight: 600; }
.qu-tr.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.qu-th-row { display: grid; grid-template-columns: 26px 36px minmax(0, 1fr) 112px 48px 66px; gap: 10px; padding: 0 10px 6px; font-size: 11.5px; font-weight: 600; color: var(--label-3); box-shadow: inset 0 -.5px 0 var(--sep); margin-bottom: 4px; }
.qu-dcap { padding: 10px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--label-3); }
.qu-dfold { position: relative; display: flex; align-items: baseline; gap: 8px; margin-top: 6px; padding: 14px 10px 6px; font-size: 12px; }
.qu-dfold::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--sep-strong); }
.qu-dfold b { font-weight: 700; }
.qu-dfold span { color: var(--label-2); }
.qu-dtemp { margin: 6px 0 8px; border-radius: 12px; background: var(--accent-soft); padding: 10px 12px 12px; }
.qu-dtemp .qu-th { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
.qu-dtemp .qu-th b { color: var(--accent); display: inline-flex; align-items: center; gap: 5px; }
.qu-dtemp .qu-tbody { display: flex; align-items: center; gap: 12px; }
.qu-dtemp .qu-tbody .cover { width: 44px; height: 44px; }
.qu-dtemp .qu-tbody .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.qu-dtemp .t1 { font-size: 13px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.qu-dtemp .t2 { font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
.qu-dtemp .qu-tf { font-size: 12px; color: var(--label-2); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.qu-dtemp .qu-tf svg.i { width: 14px; height: 14px; color: var(--accent); }
.qu-dtemp .qu-tf b { color: var(--label); font-weight: 600; }

/* ---------- medium width ---------- */
.qu-m { padding: 62px 24px 150px 4px; }
.desk .qu-m { padding: 66px 24px 120px 24px; }
.qu-m .qu-head { padding: 0 20px 6px; }
.qu-md { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.qu-md .qu-totop { text-align: left; }
.qu-md .qu-keys { margin-bottom: 12px; }
.qu-md .qu-dtop { padding-bottom: 4px; flex: none; }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const T = FMP.T;

/* ---------------- queue data (synthetic) ---------------- */
// A B站 multi-part video enters the queue as one track per part.
function quPart(n, title, dur) {
  return Object.assign({}, T.t05, { id: 't05p' + n, title: title, dur: dur, parts: 0, partNo: n });
}
const QU_PLAYED = [T.t07, T.t13, T.t14, T.t20, T.t10];
const QU_NOW = T.t01; // #6
const QU_NEXT = [T.t02, T.t03, T.t04, quPart(1, '開場：夏夜序曲', '6:12'), quPart(2, '漫遊者', '5:48'), T.t09, T.t11, T.t12, T.t06, T.t17, T.t15, T.t16, T.t22, T.t23, T.t24, T.t08];
const QU_SHUF = [T.t16, T.t09, T.t02, T.t22, quPart(2, '漫遊者', '5:48'), T.t12, T.t03, T.t24, T.t17, T.t06, T.t11, T.t04, T.t15, T.t23, T.t08, T.t07];
const QU_TOTAL = '64 首 · 4 小時 37 分';
const REPEAT = { off: ['循環', 'repeat', false], all: ['列表循環', 'repeat', true], one: ['單曲循環', 'repeat1', true] };

function quSub(t) {
  if (t.partNo) return '<span class="part">P' + t.partNo + '</span><span class="tt">' + FMP.esc(t.artist) + ' · 夏夜漫遊 全曲 Live</span>';
  return null;
}

/* ---------------- shared bits ---------------- */
function quTogs(o) {
  const r = REPEAT[o.repeat || 'off'];
  return '<button class="tog' + (o.shuffle ? ' on' : '') + '" data-qu="shuffle" aria-pressed="' + !!o.shuffle + '">' + I('shuffle') + '隨機</button>' +
    '<button class="tog' + (r[2] ? ' on' : '') + '" data-qu="repeat" data-v="' + (o.repeat || 'off') + '" aria-pressed="' + r[2] + '">' + I(r[1]) + '<span>' + r[0] + '</span></button>';
}
function quWireTogs(root) {
  root.querySelectorAll('[data-qu="shuffle"]').forEach((b) => b.addEventListener('click', () => b.classList.toggle('on')));
  root.querySelectorAll('[data-qu="repeat"]').forEach((b) => b.addEventListener('click', () => {
    const next = { off: 'all', all: 'one', one: 'off' }[b.dataset.v];
    const r = REPEAT[next];
    b.dataset.v = next;
    b.classList.toggle('on', r[2]);
    b.innerHTML = I(r[1]) + '<span>' + r[0] + '</span>';
  }));
}

/* ---------------- phone ---------------- */
function quRow(t, o) {
  o = o || {};
  const x = '<span class="dur num">' + t.dur + '</span><button class="ibtn qu-x" aria-label="從佇列移除">' + I('close', 's18') + '</button>';
  const sub = o.sub !== undefined ? o.sub : quSub(t);
  const opts = { dim: o.dim, playing: o.playing, noDur: true, more: false, drag: true, trailing: x, cls: o.cls || '' };
  let html = FMP.trackRow(t, sub ? Object.assign(opts, { sub: sub }) : opts);
  // part rows carry their own badge + ellipsis span; unwrap kit's extra .tt
  if (t.partNo && o.sub === undefined) html = html.replace('<span class="tt">' + sub + '</span>', sub);
  return html;
}
function quTemp(t, o) {
  o = o || {};
  return '<div class="qu-temp">' +
    '<div class="qu-th"><b>' + I('history', 's16') + '臨時播放</b><span class="c2">不在佇列裡</span></div>' +
    FMP.trackRow(t, { playing: true, more: false }) +
    '<div class="qu-tf">' + I('chevD') + '<span>播完或切歌後回到下方第 6 首 <b style="white-space:nowrap">「夜行列車」</b>，從 <b class="num">1:26</b> 繼續（倒退 10 秒）</span></div>' +
    '<div class="qu-ta"><button class="btn btn-sm btn-tinted">' + I('history', 's16') + '現在回到佇列</button><button class="btn btn-sm btn-gray">' + I('nextUp', 's16') + '下一首播放</button></div></div>';
}
function quPhoneList(o) {
  o = o || {};
  let h = '<div class="qu-list">';
  if (o.shuffle) {
    h += quRow(QU_NOW, { playing: true, cls: 'qu-now' });
    h += '<div class="qu-fold"><b>接下來</b><span>隨機順序 · 63 首 · 4 小時 33 分</span></div>';
    h += QU_SHUF.map((t) => quRow(t)).join('');
  } else {
    h += '<div class="qu-cap">已播放 5 首</div>';
    h += QU_PLAYED.map((t) => quRow(t, { dim: true })).join('');
    if (o.temp) {
      h += quTemp(T.t19);
      h += quRow(QU_NOW, { sub: FMP.esc(QU_NOW.artist) + ' · <span class="qu-ret">回來時從 1:26 繼續</span>' });
    } else {
      h += quRow(QU_NOW, { playing: true, cls: 'qu-now' });
    }
    h += '<div class="qu-fold"><b>接下來</b><span>58 首 · 3 小時 58 分</span></div>';
    let next = QU_NEXT.slice();
    if (o.drag) {
      // T.t09 is being dragged from #10 to right after #7
      const lifted = next.splice(5, 1)[0];
      h += quRow(next[0]);
      h += quRow(lifted, { cls: 'qu-lift' });
      next = next.slice(1);
    }
    h += next.map((t) => quRow(t)).join('');
  }
  const endText = o.repeat === 'all' ? '列表循環開著：最後一首播完回到第 1 首' + (o.shuffle ? '，並重新打亂' : '')
    : o.repeat === 'one' ? '單曲循環開著：一直重複正在播的那首' : '循環關閉：最後一首播完就停止';
  h += '<div class="qu-end">' + I(o.repeat === 'one' ? 'repeat1' : 'repeat', 's16') + endText + '</div>';
  return h + '</div>';
}
function quPhone(ctx, o) {
  o = o || {};
  const empty = !!o.empty;
  const right = '<div class="lg qu-bar" data-adapt>' + quTogs(o) + '</div>' + FMP.gbtn('trash', '清空佇列', empty ? 'disabled style="opacity:.4"' : '');
  const left = '<button class="qu-ititle" data-qu="totop">佇列</button>';
  const head = '<div class="qu-head"><button class="ty-large qu-totop" data-qu="totop">佇列</button>' +
    (empty ? '' : '<span class="c2 ty-foot num">' + QU_TOTAL + '</span>') + '</div>';
  const body = empty
    ? '<div class="qu-empty"><span class="qu-ei">' + I('queue') + '</span><div class="ty-title3">佇列是空的</div><div class="c2 ty-sub">從搜尋或歌單加入曲目，就會排在這裡</div>' +
      '<div class="qu-eb"><button class="btn btn-primary" data-href="search.html">' + I('search', 's20') + '去搜尋</button><button class="btn btn-gray" data-href="library.html">打開音樂庫</button></div></div>'
    : quPhoneList(o);
  return FMP.phone(ctx, {
    content: head + body,
    top: FMP.ptop('', left, right),
    dock: { tab: 'queue', track: empty ? false : (o.temp ? T.t19 : QU_NOW) },
    overlay: o.overlay,
  });
}
// open the page scrolled to the playing track, then let the title bring it back
function quAfterPhone(root, o) {
  o = o || {};
  const s = root.querySelector('.page.scroll');
  const dock = root.querySelector('.dock');
  const target = root.querySelector(o.temp ? '.qu-temp' : '.qu-now');
  quWireTogs(root);
  if (o.temp) {
    const b = root.querySelector('.mini .mi b');
    if (b) b.insertAdjacentHTML('beforeend', '<span class="qu-tag">臨時</span>');
  }
  if (!s || !target) return;
  const topFor = () => Math.max(0, target.offsetTop - 106 - (o.temp ? 70 : 100));
  root.querySelectorAll('[data-qu="totop"]').forEach((b) => b.addEventListener('click', () => s.scrollTo({ top: topFor(), behavior: 'smooth' })));
  if (o.noScroll) return;
  if (dock) dock.classList.add('pin');
  s.scrollTop = topFor();
  root.classList.add('scrolled');
  setTimeout(() => dock && dock.classList.remove('pin'), 300);
}

/* ---------------- desktop ---------------- */
function quTr(t, o) {
  o = o || {};
  const lead = o.now ? '<span class="eq" style="justify-self:end" aria-label="正在播放"><i></i><i></i><i></i></span>' : '<span class="qn num">' + (o.n || '') + '</span>';
  const part = t.partNo ? '<span class="part">P' + t.partNo + '</span>' : '';
  const artist = t.partNo ? FMP.esc(t.artist) + ' · 夏夜漫遊 全曲 Live' : FMP.esc(t.artist);
  const sub = o.sub || ('<span class="tt">' + artist + '</span>');
  return '<div class="qu-tr' + (o.dim ? ' dim' : '') + (o.now ? ' now' : '') + (o.hov ? ' hov' : '') + (o.sel ? ' sel' : '') + '">' + lead +
    FMP.coverEl(t.cv, 36, 'thumb') +
    '<div class="meta"><div class="t1"><span class="tt">' + FMP.esc(t.title) + '</span>' + FMP.acc(t.acc) + '</div><div class="t2">' + part + sub + '</div></div>' +
    '<span class="qs">' + FMP.src(t.src, 'full') + '</span>' +
    '<span class="qd num">' + t.dur + '</span>' +
    '<span class="qa"><button class="ibtn" aria-label="從佇列移除" title="從佇列移除（Delete）">' + I('close', 's16') + '</button><span class="qg" title="拖動調整順序">' + I('drag', 's16') + '</span></span></div>';
}
function quDeskList(o) {
  o = o || {};
  let h = '<div class="qu-th-row"><span style="text-align:right">#</span><span></span><span>曲目</span><span>音源</span><span style="text-align:right">時長</span><span></span></div>';
  h += '<div class="qu-dcap">已播放 5 首</div>';
  h += QU_PLAYED.map((t, i) => quTr(t, { dim: true, n: i + 1 })).join('');
  if (o.temp) {
    const tt = T.t19;
    h += '<div class="qu-dtemp"><div class="qu-th"><b>' + I('history', 's16') + '臨時播放</b><span class="c2">不在佇列裡</span><span class="sp" style="flex:1"></span>' +
      '<button class="btn btn-sm btn-gray">' + I('nextUp', 's16') + '下一首播放</button><button class="btn btn-sm btn-tinted">' + I('history', 's16') + '現在回到佇列</button></div>' +
      '<div class="qu-tbody">' + FMP.coverEl(tt.cv, 44, 'thumb') + '<div class="meta"><div class="t1"><span class="eq"><i></i><i></i><i></i></span><span class="ell">' + FMP.esc(tt.title) + '</span>' + FMP.acc(tt.acc) + '</div><div class="t2">' + FMP.src(tt.src, 'full') + '<span>' + FMP.esc(tt.artist) + '</span></div></div><span class="num c3" style="font-size:12px">1:12 / ' + tt.dur + '</span></div>' +
      '<div class="qu-tf">' + I('chevD') + '<span>播完或按上一首／下一首，回到下方第 6 首<b>「夜行列車」</b>，從 <b class="num">1:26</b> 繼續（倒退 10 秒，可在設定 › 播放調整）</span></div></div>';
    h += quTr(QU_NOW, { n: 6, sub: '<span class="tt">' + FMP.esc(QU_NOW.artist) + ' · <span class="qu-ret">回來時從 1:26 繼續</span></span>' });
  } else {
    h += quTr(QU_NOW, { now: true });
  }
  h += '<div class="qu-dfold"><b>接下來</b><span>58 首 · 3 小時 58 分</span></div>';
  h += QU_NEXT.map((t, i) => quTr(t, { n: i + 7, hov: o.hov === i, sel: o.sel === i })).join('');
  h += '<div class="qu-end" style="padding:16px 10px 0">' + I('repeat', 's16') + '列表循環開著：最後一首播完回到第 1 首</div>';
  return h;
}
function quDesk(ctx, o) {
  o = o || {};
  const top = '<span class="wt qu-wt" data-qu="totop">佇列</span><span class="sp"></span><div class="qu-dtop">' + quTogs(o) +
    '<button class="btn btn-sm btn-gray" style="margin-left:6px">' + I('trash', 's16') + '清空佇列</button></div>';
  const head = '<div class="qu-dh"><div><button class="ty-large qu-totop" data-qu="totop">佇列</button><div class="c2 ty-foot num" style="margin-top:2px">' + QU_TOTAL + '</div></div>' +
    '<div class="qu-keys">拖動或 <kbd>⌥↑</kbd><kbd>⌥↓</kbd> 調整順序 · <kbd>Delete</kbd> 移除 · <kbd>⏎</kbd> 播放</div></div>';
  return FMP.desktop(ctx, {
    nav: 'queue',
    top: top,
    content: '<div style="padding:66px 28px 120px 8px">' + head + quDeskList(o) + '</div>',
    detailOpts: o.temp ? { track: T.t19 } : undefined,
    transport: o.temp ? T.t19 : true,
    transportOpts: { repeat: o.repeat === 'off' ? false : o.repeat, shuffle: o.shuffle },
    overlay: o.overlay,
  });
}
function quAfterDesk(root, o) {
  o = o || {};
  quWireTogs(root);
  const s = root.querySelector('.wcontent > .scroll');
  const target = root.querySelector(o.temp ? '.qu-dtemp' : '.qu-tr.now');
  if (!s || !target) return;
  const topFor = () => Math.max(0, target.offsetTop - 66 - 48 * 2 - 20);
  root.querySelectorAll('[data-qu="totop"]').forEach((b) => b.addEventListener('click', () => s.scrollTo({ top: topFor(), behavior: 'smooth' })));
  s.scrollTop = topFor();
  root.classList.add('scrolled');
  if (o.menu) {
    const row = root.querySelectorAll('.qu-tr')[QU_PLAYED.length + 1 + o.sel];
    const win = root.getBoundingClientRect();
    const r = row.getBoundingClientRect();
    const sc = win.width / 1280;
    const m = root.querySelector('.gmenu');
    m.style.top = ((r.top - win.top) / sc + 30) + 'px';
  }
}
/* medium width. tablet: phone list + glass toggles in the top bar; window: desktop table, toggles in the title row */
function quMid(ctx, o) {
  o = o || {};
  const touch = o.device === 'tablet';
  const transport = o.temp ? T.t19 : true;
  const transportOpts = { repeat: o.repeat === 'off' ? false : o.repeat, shuffle: o.shuffle };
  if (touch) {
    const top = '<span class="wt qu-wt" data-qu="totop">佇列</span><span class="sp"></span><div class="lg qu-bar" data-adapt>' + quTogs(o) + '</div>' + FMP.gbtn('trash', '清空佇列');
    const head = '<div class="qu-head"><button class="ty-large qu-totop" data-qu="totop">佇列</button><span class="c2 ty-foot num">' + QU_TOTAL + '</span></div>';
    return FMP.medium(ctx, { device: 'tablet', w: o.w, h: o.h, nav: 'queue', top, content: '<div class="qu-m">' + head + quPhoneList(o) + '</div>', transport, transportOpts });
  }
  const top = '<span class="wt qu-wt" data-qu="totop">佇列</span>';
  const head = '<div class="qu-md"><div><button class="ty-large qu-totop" data-qu="totop">佇列</button><div class="c2 ty-foot num" style="margin-top:2px">' + QU_TOTAL + '</div></div>' +
    '<div class="qu-dtop">' + quTogs(o) + '<button class="btn btn-sm btn-gray" style="margin-left:6px">' + I('trash', 's16') + '清空佇列</button></div></div>' +
    '<div class="qu-keys">拖動或 <kbd>⌥↑</kbd><kbd>⌥↓</kbd> 調整順序 · <kbd>Delete</kbd> 移除 · <kbd>⏎</kbd> 播放</div>';
  return FMP.medium(ctx, { device: 'window', w: o.w, h: o.h, nav: 'queue', top, content: '<div class="qu-m">' + head + quDeskList(o) + '</div>', transport, transportOpts });
}
function quAfterMid(root, o) {
  o = o || {};
  quWireTogs(root);
  const s = root.querySelector('.wcontent > .scroll');
  const target = root.querySelector(o.temp ? (o.touch ? '.qu-temp' : '.qu-dtemp') : (o.touch ? '.qu-now' : '.qu-tr.now'));
  if (!s || !target) return;
  const fr = root.getBoundingClientRect();
  const sc = fr.width / root.offsetWidth;
  // land the playing row (or the temporary block) a couple of rows below the top bar
  const topFor = () => Math.max(0, s.scrollTop + (target.getBoundingClientRect().top - fr.top) / sc - (o.touch ? (o.temp ? 120 : 200) : 170));
  root.querySelectorAll('[data-qu="totop"]').forEach((b) => b.addEventListener('click', () => s.scrollTo({ top: topFor(), behavior: 'smooth' })));
  s.scrollTop = topFor();
  root.classList.add('scrolled');
}

function quMenu() {
  const mi = (icon, label, k, cls) => '<button class="mi ' + (cls || '') + '" role="menuitem">' + I(icon) + '<span>' + label + '</span>' + (k ? '<span class="k">' + k + '</span>' : '') + '</button>';
  return '<div class="lg gmenu" data-adapt role="menu" style="left:560px;top:420px">' +
    mi('play', '從這首開始播放', '⏎', 'hl') + mi('nextUp', '移到下一首') + '<div class="ms"></div>' +
    mi('addlist', '加入歌單…') + mi('lyrics', '匹配歌詞…') + mi('info', '曲目資訊', '⌘I') + '<div class="ms"></div>' +
    mi('close', '從佇列移除', 'Delete', 'danger') + '</div>';
}

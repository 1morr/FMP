<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳號與登入 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
.phone.ac-grp { --bg: var(--bg-grouped); }
.ac-lead { padding: 0 20px 4px; font-size: 14px; line-height: 20px; color: var(--label-2); }
/* account card: solid content */
.ac-card { margin: 14px 16px 0; padding: 14px 16px 16px; border-radius: var(--r-group); background: var(--cell); }
.ac-top { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--label-2); }
.ac-top .src svg { width: 18px; height: 18px; }
.ac-top .sp { flex: 1; }
.ac-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--label-2); }
.ac-st i { width: 8px; height: 8px; border-radius: 50%; background: var(--label-3); }
.ac-st.in { color: var(--ok); } .ac-st.in i { background: var(--ok); }
.ac-st.exp { color: var(--warn); } .ac-st.exp i { background: var(--warn); }
.ac-id { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.ac-av { width: 52px; height: 52px; border-radius: 50%; flex: none; }
.ac-av-empty { width: 52px; height: 52px; border-radius: 50%; background: var(--fill); color: var(--label-3); display: grid; place-items: center; flex: none; }
.ac-name { font-size: 17px; line-height: 22px; font-weight: 600; }
.ac-mem { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 13px; color: var(--label-2); flex-wrap: wrap; }
.ac-mem .acc svg { width: 12px; height: 12px; }
.ac-strip { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 18px; background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--label); }
.ac-strip > svg { color: var(--warn); margin-top: 1px; }
.ac-strip b { font-weight: 600; }
.ac-acts { display: flex; gap: 8px; margin-top: 14px; }
.ac-acts .btn { flex: 1; }
.ac-why { margin-top: 12px; font-size: 13.5px; line-height: 19px; color: var(--label-2); }
.desk .ac-card { margin: 0; padding: 12px 14px 14px; border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--sep); display: flex; flex-direction: column; }
.desk .ac-card.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.desk .ac-av, .desk .ac-av-empty { width: 40px; height: 40px; }
.desk .ac-name { font-size: 14px; line-height: 19px; }
.desk .ac-mem { font-size: 11.5px; }
.desk .ac-strip { font-size: 11.5px; line-height: 16px; padding: 8px 10px; border-radius: 9px; }
.desk .ac-acts { margin-top: auto; padding-top: 12px; }
.desk .ac-why { font-size: 12px; line-height: 17px; }
.desk .ac-top { font-size: 12px; }
.desk .ac-top .src svg { width: 15px; height: 15px; }
.desk .ac-st { font-size: 11.5px; }
/* sheet body */
.sheet.ac-full { height: calc(100% - 56px); max-height: none; }
.sheet .sfoot.ac-col { flex-direction: column; gap: 8px; box-shadow: 0 -.5px 0 var(--sep); }
.sheet .sfoot.ac-col .btn { flex: none; width: 100%; }
.sheet .sfoot.ac-col .ty-foot { text-align: center; }
.ac-lapsed { background: var(--fill-2); color: var(--label-2); }
.ac-hsp { width: 44px; flex: none; }
.ac-stitle2 { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.ac-stitle2 b { font-size: 17px; font-weight: 600; }
.ac-stitle2 small { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--label-2); margin-top: 2px; }
.ac-stitle2 small svg.i { width: 12px; height: 12px; }
/* remote playlist rows */
.ac-pl { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; position: relative; }
.ac-pl + .ac-pl::before { content: ""; position: absolute; top: 0; right: 0; left: 108px; height: .5px; background: var(--sep); }
.ac-pl .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ac-pl .meta b { font-size: 16px; font-weight: 400; line-height: 21px; }
.ac-pl .meta span { font-size: 13px; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
.ac-pl.done .meta, .ac-pl.done .cover { opacity: .5; }
.ac-tag { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--fill-2); color: var(--label-2); font-size: 11.5px; font-weight: 600; flex: none; }
.ac-tag svg.i { width: 12px; height: 12px; }
.ac-tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.ac-bar { height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; margin-top: 5px; }
.ac-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
/* login */
.ac-seg { display: flex; justify-content: center; padding: 4px 0 18px; }
.ac-seg .seg button { min-width: 92px; height: 30px; text-align: center; }
.ac-qrbox { display: flex; flex-direction: column; align-items: center; padding: 6px 24px 0; text-align: center; }
.ac-qr { position: relative; padding: 14px; border-radius: 22px; background: var(--bg); box-shadow: 0 8px 28px rgba(0,0,0,.18), 0 0 0 .5px var(--sep); }
.ac-qr svg { display: block; }
.ac-qr .ov { position: absolute; inset: 0; border-radius: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: color-mix(in srgb, var(--bg) 86%, transparent); color: var(--label); font-size: 15px; font-weight: 600; }
.ac-qr .ov .big { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-fill); color: var(--accent-ink); }
.ac-qr .ov .big svg.i { width: 30px; height: 30px; stroke-width: 2.4; }
.ac-qr.blur svg { filter: blur(3px); opacity: .35; }
.ac-qst { margin-top: 22px; font-size: 19px; line-height: 25px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ac-qsub { margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--label-2); max-width: 300px; }
.ac-steps { margin: 26px 16px 0; }
.ac-step { display: flex; gap: 12px; align-items: center; padding: 10px 16px; font-size: 14.5px; }
.ac-step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--fill-2); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; font-family: var(--font-num); }
.ac-safe { display: flex; gap: 10px; align-items: flex-start; margin: 16px 20px 0; font-size: 13px; line-height: 18px; color: var(--label-2); }
.ac-safe svg.i { color: var(--accent); flex: none; }
.ac-ok { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.ac-ok svg.i { width: 44px; height: 44px; stroke-width: 2.4; }
/* webview */
.ac-banner { display: flex; gap: 10px; align-items: flex-start; margin: 0 12px 10px; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); font-size: 13px; line-height: 18px; color: var(--label); }
.ac-banner svg.i { color: var(--accent); flex: none; margin-top: 1px; }
.ac-webcap { margin: 0 16px 6px; font-size: 11.5px; color: var(--label-3); display: flex; align-items: center; gap: 6px; }
.ac-webcap::after { content: ""; flex: 1; height: .5px; background: var(--sep); }
.ac-web { flex: 1; min-height: 0; background: var(--bg); color: var(--label); overflow: hidden; display: flex; flex-direction: column; align-items: stretch; padding: 22px 26px; gap: 14px; }
.ac-web .wl { height: 26px; width: 96px; border-radius: 6px; background: var(--fill-2); }
.ac-web .wh { font-size: 22px; font-weight: 700; margin-top: 10px; }
.ac-web .wtabs { display: flex; gap: 18px; font-size: 14px; color: var(--label-2); }
.ac-web .wtabs b { color: var(--label); border-bottom: 2px solid var(--label); padding-bottom: 4px; }
.ac-web .wfield { height: 44px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--sep-strong); display: flex; align-items: center; padding: 0 12px; color: var(--label-3); font-size: 14px; }
.ac-web .wbtn { height: 44px; border-radius: 22px; background: var(--label-2); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.ac-web .wsm { display: flex; justify-content: center; gap: 18px; margin-top: 8px; }
.ac-web .wsm i { width: 36px; height: 36px; border-radius: 50%; background: var(--fill-2); }
.ac-web .wln { height: 8px; border-radius: 4px; background: var(--fill); }
/* cookie */
.ac-paste { margin: 0 16px; min-height: 92px; border-radius: 14px; background: var(--cell); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ac-mask { font-family: var(--font-num); letter-spacing: .16em; color: var(--label-2); font-size: 15px; word-break: break-all; line-height: 20px; }
.ac-paste .row2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--label-2); }
.ac-paste .row2 .sp { flex: 1; }
.ac-ck { font-family: var(--font-num); font-size: 14.5px; }
.ac-okc { color: var(--ok); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.ac-instr { margin: 0 16px; padding: 4px 0; }
.ac-instr .ac-step { padding: 7px 0; font-size: 14px; line-height: 19px; align-items: flex-start; }
.ac-instr code { font-family: var(--font-num); font-size: 13px; background: var(--fill); padding: 1px 5px; border-radius: 5px; }
.ac-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.ac-tbl { margin-top: 8px; border-radius: 12px; background: var(--cell); box-shadow: inset 0 0 0 .5px var(--sep); padding: 4px; }
.ac-tr { display: grid; grid-template-columns: 28px 40px minmax(0, 1fr) 80px 200px; align-items: center; gap: 8px; min-height: 46px; padding: 0 10px; border-radius: 8px; font-size: 13px; }
.ac-tr.th { min-height: 28px; font-size: 11.5px; font-weight: 600; color: var(--label-2); }
.ac-tr.hov { background: var(--cell-hover); }
.ac-tr.done { color: var(--label-3); }
.ac-tr .sub { font-size: 11.5px; color: var(--label-2); }
.ac-sech { display: flex; align-items: center; gap: 10px; margin-top: 26px; }
.ac-sech .t { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.ac-sech .sp { flex: 1; }
.ac-addr { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 12px; border-radius: 13px; background: var(--fill); font-size: 12px; color: var(--label-2); }
.ac-addr svg.i { width: 12px; height: 12px; }
.ac-cbody .ac-paste, .ac-cbody .ac-instr, .ac-cbody .ac-banner { margin-left: 0 !important; margin-right: 0 !important; }
.ac-cbody .ac-paste { background: var(--cell); box-shadow: inset 0 0 0 .5px var(--sep); }
.ac-alt { margin: 22px 20px 0; text-align: center; font-size: 13.5px; color: var(--label-2); }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const AC_P = {
  logout: '<path d="M14 4.5H7c-.8 0-1.5.7-1.5 1.5v12c0 .8.7 1.5 1.5 1.5h7"/><path d="M10.5 12H20M16.5 8.5 20 12l-3.5 3.5"/>',
  disk: '<ellipse cx="12" cy="6.5" rx="7.5" ry="2.8"/><path d="M4.5 6.5v11c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-11M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
  paste: '<rect x="5.5" y="5" width="13" height="15.5" rx="2.4"/><path d="M9 5V4.2c0-.4.3-.7.7-.7h4.6c.4 0 .7.3.7.7V5M9 11h6M9 14.5h4"/>',
};
const acI = (n, cls) => AC_P[n] ? '<svg class="i ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + AC_P[n] + '</svg>' : I(n, cls);

/* fake QR: deterministic modules with the three finder squares */
function acQR(seed, px) {
  const N = 29;
  let h = 7;
  for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const r = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const fin = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  let d = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (fin(x, y)) continue;
    const timing = (x === 6 || y === 6) ? (x + y) % 2 === 0 : r() > 0.52;
    if (timing) d += 'M' + x + ' ' + y + 'h1v1h-1z';
  }
  const F = (x, y) => '<path d="M' + x + ' ' + y + 'h7v7h-7zM' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5z" fill-rule="evenodd"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
  return '<svg viewBox="0 0 ' + N + ' ' + N + '" width="' + px + '" height="' + px + '" shape-rendering="crispEdges" style="fill:var(--label)"><path d="' + d + '"/>' + F(0, 0) + F(N - 7, 0) + F(0, N - 7) + '</svg>';
}

/* synthetic accounts (names are fictional) */
const AC = {
  bilibili: { name: '晚風收藏家', tier: '大會員', until: '2027-03-02', lapsedOn: '2026-10-31', cv: FMP.cover('acc-bili', { pal: 9, kind: 0 }), lists: 9 },
  netease: { name: '夜行的貓', tier: '黑膠 VIP', until: '2026-11-18', soon: 8, cv: FMP.cover('acc-ne', { pal: 7, kind: 7 }), lists: 6 },
  youtube: {},
};
const acCrown = (tier) => '<span class="acc acc-vip acc-lg">' + I('crown') + tier + '</span>';
function acCard(src, state, o) {
  o = o || {};
  const a = AC[src];
  const desk = o.desk;
  const stl = { in: ['in', '已登入'], lapsed: ['in', '已登入'], exp: ['exp', '登入已失效'], out: ['', '未登入'] }[state];
  let h = '<div class="ac-card' + (o.sel ? ' sel' : '') + '"><div class="ac-top">' + FMP.src(src) + '<span>' + FMP.SRC[src].name + '</span><span class="sp"></span><span class="ac-st ' + stl[0] + '"><i></i>' + stl[1] + '</span></div>';
  if (state === 'out') {
    h += '<div class="ac-id"><span class="ac-av-empty">' + I('user', desk ? 's20' : 's24') + '</span><div><div class="ac-name c2">尚未登入</div></div></div>';
    h += '<div class="ac-why">' + (o.why || '登入後可以播放會員曲目，並讀取、寫入你的遠端歌單。') + '</div>';
    h += '<div class="ac-acts"><button class="btn btn-primary' + (desk ? ' btn-sm' : '') + '">' + I('globe', 's18') + '用網頁登入</button></div>';
  } else {
    const mem = state === 'lapsed'
      ? '<span class="acc acc-lg ac-lapsed">' + I('crown') + a.tier + '已過期</span><span>' + a.lapsedOn + ' 到期</span>'
      : acCrown(a.tier) + '<span>' + a.until + ' 到期</span>';
    h += '<div class="ac-id">' + FMP.coverEl(a.cv, null, 'ac-av') + '<div style="min-width:0"><div class="ac-name ell">' + a.name + '</div>' +
      '<div class="ac-mem">' + mem + '</div></div></div>';
    if (state === 'lapsed') {
      h += '<div class="ac-strip">' + I('warn', 's18') + '<span><b>' + a.tier + '已過期。</b>需要會員的曲目改成試聽或無法播放，會員音質也不會再選到。續費後按右上角的「檢查帳號」更新。</span></div>';
      h += '<div class="ac-acts"><button class="btn btn-tinted' + (desk ? ' btn-sm' : '') + '">' + I('list', 's18') + '歌單</button><button class="btn btn-gray' + (desk ? ' btn-sm' : '') + '">' + acI('logout', 's18') + '登出</button></div>';
    } else if (state === 'exp') {
      h += '<div class="ac-strip">' + I('warn', 's18') + '<span><b>登入已失效。</b>播放與刷新改用未登入的身分，會員曲目只能試聽。重新登入就能恢復。</span></div>';
      h += '<div class="ac-acts"><button class="btn btn-primary' + (desk ? ' btn-sm' : '') + '">重新登入</button><button class="btn btn-gray' + (desk ? ' btn-sm' : '') + '">登出</button></div>';
    } else {
      if (a.soon) h += '<div class="ac-strip">' + I('clock', 's18') + '<span><b>' + a.soon + ' 天後到期。</b>到期後需要會員的曲目只能試聽或無法播放。</span></div>';
      h += '<div class="ac-acts"><button class="btn btn-tinted' + (desk ? ' btn-sm' : '') + '">' + I('list', 's18') + '歌單</button><button class="btn btn-gray' + (desk ? ' btn-sm' : '') + '">' + acI('logout', 's18') + '登出</button></div>';
    }
  }
  return h + '</div>';
}

function acPhone(ctx, o) {
  return FMP.phone(ctx, o).replace('class="phone scr', 'class="phone scr ac-grp');
}
function acPage(ctx, o) {
  o = o || {};
  const st = o.st || { bilibili: 'in', netease: 'in', youtube: 'out' };
  const content = '<div class="lt" style="padding-top:58px"><div class="ty-large">帳號</div></div>' +
    acCard('bilibili', st.bilibili) + acCard('netease', st.netease) + acCard('youtube', st.youtube) +
    '<div class="gfoot" style="margin-top:12px">每個音源一個帳號。登入資訊只存在這台裝置的系統鑰匙圈，不進備份與診斷檔。</div>';
  const right = o.checking ? '<button class="lg gbtn" data-adapt aria-label="檢查中"><span class="spinner"></span></button>' : FMP.gbtn('refresh', '檢查帳號');
  return acPhone(ctx, {
    content,
    top: FMP.ptop('帳號', FMP.gbtn('chevL', '返回'), right, 96),
    dock: { tab: 'settings', compact: o.compact },
    overlay: o.overlay,
  });
}

/* a solid sheet over the account page */
function acSheet(o) {
  return '<div class="sheet-wrap"><div class="sheet solid ac-full"><div class="grab"></div>' +
    '<div class="shead">' + (o.left || '<span class="ac-hsp"></span>') + (o.titleHtml || '<span class="stitle">' + o.title + '</span>') + (o.right || '<span class="ac-hsp"></span>') + '</div>' +
    (o.raw ? o.body : '<div class="sbody" style="padding-bottom:24px">' + o.body + '</div>') + (o.foot ? '<div class="sfoot ac-col">' + o.foot + '</div>' : '') + '</div></div>';
}

const AC_RL = [
  { id: 'cpop', name: '華語私藏 2026', n: 157, kind: '建立', cv: FMP.PL.cpop.cv, done: true },
  { id: 'love', name: '我喜歡的音樂', n: 1024, kind: '建立', cv: FMP.cover('rl-love', { pal: 19, kind: 0 }) },
  { id: 'run', name: '跑步 BPM 170', n: 46, kind: '建立', cv: FMP.cover('rl-run', { pal: 14, kind: 1 }) },
  { id: 'city', name: '城市夜晚 Lo-fi', n: 88, kind: '收藏', cv: FMP.cover('rl-city', { pal: 10, kind: 2 }), by: '夜燈電台' },
  { id: '90s', name: '九〇年代華語金曲', n: 120, kind: '收藏', cv: FMP.cover('rl-90s', { pal: 5, kind: 3, glyph: '九' }), by: '老歌倉庫' },
  { id: 'rain', name: '下雨天的鋼琴', n: 32, kind: '收藏', cv: FMP.cover('rl-rain', { pal: 17, kind: 5 }), by: '琴鍵上的鯨' },
];
const AC_SEL = { love: true, run: true };

function acRemoteRow(p, mode) {
  const sel = AC_SEL[p.id];
  let lead, sub, trail = '';
  sub = '<span>' + p.n.toLocaleString() + ' 首' + (p.by ? ' · ' + p.by : '') + '</span>';
  if (p.done) {
    lead = '<span class="check" style="opacity:.35"></span>';
    trail = '<span class="ac-tag ok">' + I('check') + '已匯入</span>';
  } else if (mode === 'progress' && sel) {
    lead = p.id === 'run' ? '<span class="check on">' + I('check') + '</span>' : '<span class="spinner" style="width:22px;height:22px"></span>';
    sub = p.id === 'run' ? '<span class="ac-okc">' + I('check', 's16') + '完成，46 首</span>' : '<span>取得曲目 412 / 1,024</span>';
    if (p.id === 'love') sub += '<div class="ac-bar"><i style="width:40%"></i></div>';
  } else {
    lead = '<span class="check' + (sel ? ' on' : '') + '" data-toggle>' + I('check') + '</span>';
  }
  return '<div class="ac-pl' + (p.done ? ' done' : '') + '">' + lead + FMP.coverEl(p.cv, 48, 'thumb') + '<div class="meta"><b class="ell">' + p.name + '</b>' + (p.id === 'love' && mode === 'progress' ? '<div>' + sub + '</div>' : sub) + '</div>' + trail + '</div>';
}
function acRemoteSheet(ctx, mode) {
  const g = (k) => '<div class="group" style="margin-top:0">' + AC_RL.filter((p) => p.kind === k).map((p) => acRemoteRow(p, mode)).join('') + '</div>';

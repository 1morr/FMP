<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜尋與結果 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
[class^="srh-"], [class*=" srh-"] { box-sizing: border-box; }
/* ---- phone: bottom search dock (iOS 26 search-tab variant) ---- */
.srh-dock { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; z-index: 50; pointer-events: none; }
.srh-dock::before { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 55%, transparent) 70%); pointer-events: none; }
.srh-dock > .lg { position: absolute; pointer-events: auto; }
.srh-dock .mini { left: 14px; top: 24px; width: 362px; height: 56px; border-radius: 28px; }
.srh-orb { left: 14px; top: 88px; width: 62px; height: 62px; border-radius: 31px; display: grid; place-items: center; color: var(--glass-ink); }
.srh-orb svg.i { width: 25px; height: 25px; stroke-width: 1.7; }
.srh-field { left: 86px; top: 88px; width: 290px; height: 62px; border-radius: 31px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 20px; font-size: 17px; color: var(--glass-ink); }
.srh-field > svg.i { width: 21px; height: 21px; color: var(--glass-ink-2); }
.srh-field .q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srh-field .ph { flex: 1; color: var(--glass-ink-2); }
.srh-field .caret { display: inline-block; width: 2px; height: 22px; margin-left: 1px; vertical-align: -5px; background: var(--accent); border-radius: 1px; }
.srh-field .clr { width: 44px; height: 44px; display: grid; place-items: center; color: var(--glass-ink-2); }
.srh-field .clr span { width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--glass-ink) 18%, transparent); color: var(--glass-ink); }
.srh-field .clr svg.i { width: 13px; height: 13px; stroke-width: 2.6; }
/* focused: the field rides on top of the keyboard, full width */
.srh-dock.kb { bottom: 300px; height: 76px; }
.srh-dock.kb::before { display: none; }
.srh-dock.kb .srh-field { left: 14px; top: 8px; width: 362px; height: 56px; border-radius: 28px; }
.srh-kb { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; z-index: 49; background: var(--cell-2); padding: 10px 3px 0; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 -.5px 0 var(--sep); }
.srh-kb .kr { display: flex; justify-content: center; gap: 6px; }
.srh-kb .k { height: 44px; flex: 0 0 33px; border-radius: 8px; background: var(--cell); display: grid; place-items: center; font-size: 22px; color: var(--label); box-shadow: 0 1px 0 var(--sep-strong); }
.srh-kb .k.w { flex-basis: 44px; font-size: 15px; background: var(--fill-2); }
.srh-kb .k.sp { flex: 1; font-size: 15px; }
.srh-kb .k.go { flex-basis: 92px; font-size: 15px; font-weight: 600; background: var(--accent-fill); color: var(--accent-ink); }

/* ---- phone content ---- */
.srh-fil { display: flex; align-items: center; padding: 2px 0 6px; }
.srh-chips { flex: 1; min-width: 0; display: flex; gap: 8px; padding: 0 8px 0 20px; overflow-x: auto; scrollbar-width: none; -webkit-mask: linear-gradient(90deg, #000 calc(100% - 20px), transparent); mask: linear-gradient(90deg, #000 calc(100% - 20px), transparent); }
/* sort sits at the right end of the filter row, like the legacy app; it stays put while the chips scroll */
.srh-sortc { flex: none; margin-right: 16px; display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 8px 0 10px; border-radius: var(--r-cap); box-shadow: inset 0 0 0 1px var(--sep-strong); font-size: 13px; font-weight: 500; color: var(--label); white-space: nowrap; }
.srh-sortc svg.i { width: 15px; height: 15px; color: var(--label-2); }
.desk .srh-sortc { height: 26px; margin: 0 0 0 14px; font-size: 12px; }
.srh-chips::-webkit-scrollbar { display: none; }
.srh-chips .chip .src svg { width: 15px; height: 15px; }
.srh-chips .chip.on .src { color: inherit; }
.srh-chips .chip .w { color: var(--warn); }
.srh-chips .chip.on .w { color: inherit; }
.srh-sh { display: flex; align-items: baseline; gap: 8px; padding: 18px 20px 6px; }
.srh-sh .ty-title3 { font-weight: 700; }
.srh-sh .cnt { font-size: 15px; color: var(--label-3); font-family: var(--font-num); }
.srh-sh .sp { flex: 1; }
.srh-loc { width: 14px !important; height: 14px !important; color: var(--accent); stroke-width: 2.4 !important; vertical-align: -2px; margin-right: 3px; }
.srh-part { min-height: 48px !important; padding-left: 76px !important; --sep-inset: 76px; }
.srh-part .pn { width: 26px; flex: none; font-size: 12px; font-weight: 600; color: var(--label-3); }
.srh-part .t1 { font-size: 15px !important; }
.row.srh-open { background: var(--fill); }
.srh-err { margin: 4px 16px 10px; padding: 12px 12px 12px 14px; border-radius: var(--r-cell); background: var(--fill); display: flex; align-items: center; gap: 12px; }
.srh-err .ei { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--cell); flex: none; position: relative; }
.srh-err .ei .src svg { width: 18px; height: 18px; }
.srh-err .ei .wb { position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: 9px; background: var(--bg); display: grid; place-items: center; color: var(--warn); }
.srh-err .ei .wb svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.srh-err .et { flex: 1; min-width: 0; }
.srh-err .et b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; }
.srh-err .et span { display: block; font-size: 13px; line-height: 17px; color: var(--label-2); }
.srh-foot { padding: 18px 20px 0; text-align: center; font-size: 13px; color: var(--label-3); }
.srh-hist .row { min-height: 50px; }
.srh-hist .row .hi { color: var(--label-3); width: 22px; display: grid; place-items: center; }
.srh-hist .row .t1 { font-size: 17px; }
.srh-hist .row { --sep-inset: 50px; }
.srh-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 90px 40px 0; gap: 8px; }
.srh-empty .big { width: 64px; height: 64px; border-radius: 32px; background: var(--fill); display: grid; place-items: center; color: var(--label-3); margin-bottom: 8px; }
.srh-empty .big svg.i { width: 30px; height: 30px; }
.srh-empty .ty-title3 { font-weight: 700; }
.srh-sk { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; }
.srh-sk i { display: block; background: var(--fill); border-radius: 6px; }
.srh-sk .c { width: 48px; height: 48px; flex: none; }
.srh-sk .l { display: flex; flex-direction: column; gap: 7px; flex: 1; }

/* ---- glass text capsule (iOS 26 toolbar text button) ---- */
.srh-gtext { height: 44px; padding: 0 17px; border-radius: var(--r-cap); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; color: var(--glass-ink); }
.srh-gtext.acc { color: var(--accent); }
.srh-seltitle { position: absolute; left: 110px; right: 110px; text-align: center; font-size: 17px; font-weight: 600; pointer-events: none; }

/* ---- floating action bar (multi-select) ---- */
.srh-act { position: absolute; z-index: 55; left: 14px; right: 14px; bottom: 30px; height: 64px; border-radius: 32px; display: flex; align-items: center; padding: 0 6px; }
.srh-act button { flex: 1; height: 56px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--glass-ink); }
.srh-act button svg.i { width: 23px; height: 23px; }
.srh-act button:hover { background: var(--glass-press); }

/* ---- glass menu (phone + desktop) ---- */
.srh-scrim { position: absolute; inset: 0; z-index: 64; background: var(--scrim); }

/* ---- desktop results table ---- */
.srh-dhead { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
.srh-dhead .ty-large .c3 { font-weight: 600; }
.srh-dhead .sp { flex: 1; }
.srh-dfil { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.srh-dfil .chip .src svg { width: 13px; height: 13px; }
.srh-dfil .chip.on .src { color: inherit; }
.srh-dfil .chip .w { color: var(--warn); }
.srh-dfil .hint { margin-left: auto; font-size: 11.5px; color: var(--label-3); display: flex; gap: 12px; }
.srh-dfil .hint kbd { font: 500 11px var(--font-num); padding: 1px 5px; border-radius: 4px; background: var(--fill); color: var(--label-2); margin-right: 4px; }
.srh-dsh { display: flex; align-items: baseline; gap: 7px; padding: 22px 10px 6px; font-size: 15px; font-weight: 700; }
.srh-dsh .cnt { font-size: 13px; color: var(--label-3); font-weight: 500; font-family: var(--font-num); }
.srh-th, .srh-tr { display: grid; grid-template-columns: 26px minmax(0, 1fr) 88px 56px 66px 46px 28px; align-items: center; column-gap: 12px; padding: 0 10px; }
.srh-th { height: 28px; font-size: 11px; font-weight: 600; color: var(--label-2); box-shadow: inset 0 -.5px 0 var(--sep); margin-bottom: 4px; }
.srh-th .r, .srh-tr .r { text-align: right; justify-self: end; }
.srh-tr { height: 50px; border-radius: 8px; font-size: 13px; position: relative; }
.srh-tr:hover, .srh-tr.hov { background: var(--cell-hover); }
.srh-tr.sel { background: var(--accent-soft); }
.srh-tr.sel + .srh-tr.sel { border-top-left-radius: 0; border-top-right-radius: 0; }
.srh-tr.sel:has(+ .srh-tr.sel) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.srh-tr .n { text-align: right; font-size: 12px; color: var(--label-3); display: flex; justify-content: flex-end; }
.srh-tr .n svg.i { width: 15px; height: 15px; color: var(--label); }
.srh-tr .tc { display: flex; align-items: center; gap: 10px; min-width: 0; }
.srh-tr .tc .cover { width: 36px; height: 36px; }
.srh-tr .tc .m { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.srh-tr .tc .m b { font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }
.srh-tr .tc .m b .tt, .srh-tr .tc .m span .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.srh-tr .tc .m > span { font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 5px; min-width: 0; }
.srh-tr.playing .tc .m b { color: var(--accent); font-weight: 600; }
.srh-tr .sc { font-size: 12px; color: var(--label-2); }
.srh-tr .sc .src svg { width: 15px; height: 15px; }
.srh-tr .sc .src-name { font-size: 12px; color: var(--label); }
.srh-tr .pc { font-size: 12px; color: var(--label-2); }
.srh-tr .dc { font-size: 12px; color: var(--label-2); }
.srh-tr .mc { opacity: 0; }
.srh-tr:hover .mc, .srh-tr.hov .mc, .srh-tr.sel .mc { opacity: 1; }
.srh-tr .mc .ibtn { width: 28px; height: 28px; color: var(--label-2); }
.srh-tr .xp { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; color: var(--label-2); }
.srh-tr .xp svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
.srh-tr.pt { height: 34px; }
.srh-tr.pt .tc { padding-left: 46px; }
.srh-tr.pt .pn { font-size: 11px; font-weight: 600; color: var(--label-3); width: 22px; flex: none; }
.srh-derr { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; padding: 8px 10px; border-radius: 10px; background: var(--fill); font-size: 12.5px; }
.srh-derr .w { color: var(--warn); display: grid; }
.srh-derr .w svg.i { width: 16px; height: 16px; }
.srh-derr span.t { flex: 1; color: var(--label-2); }
.srh-derr span.t b { color: var(--label); font-weight: 600; }
.srh-dact { position: absolute; z-index: 29; left: 280px; right: 344px; bottom: 94px; display: flex; justify-content: center; pointer-events: none; }
.srh-dact > .lg { pointer-events: auto; height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 16px; font-size: 13px; }
.srh-dact .cnt { font-weight: 600; margin-right: 8px; }
.srh-dact .vs { width: 1px; height: 20px; background: color-mix(in srgb, var(--glass-ink) 14%, transparent); margin: 0 6px; }
.srh-dact button.a { height: 32px; padding: 0 10px; border-radius: 16px; display: inline-flex; align-items: center; gap: 6px; color: var(--glass-ink); font-size: 12.5px; font-weight: 600; }
.srh-dact button.a svg.i { width: 16px; height: 16px; }
.srh-dact button.a:hover { background: var(--glass-press); }
.srh-dact .ibtn { width: 32px; height: 32px; color: var(--glass-ink-2); }

/* ---- medium width: the rail has no search field, so the field sits at the top of the page ---- */
.srh-mf { margin: 0 16px 10px 20px; }
.srh-mf .q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srh-mf .clr { display: grid; place-items: center; width: 28px; height: 28px; margin-right: -6px; color: var(--label-3); }
.srh-mf .clr span { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; background: var(--fill-2); color: var(--label-2); }
.srh-mf .clr svg.i { width: 11px; height: 11px; stroke-width: 2.6; }
.srh-mf kbd { font: 500 11px var(--font-num); padding: 1px 6px; border-radius: 4px; background: var(--fill-2); color: var(--label-2); }
.desk .srh-mf { margin: 0; width: 360px; flex: none; }
.srh-m { padding: 62px 24px 150px 4px; }
.desk .srh-m { padding: 66px 24px 120px 24px; }
.srh-mtop { display: flex; align-items: center; gap: 24px; margin-bottom: 10px; }
.srh-mtop .hint { margin-left: auto; font-size: 11.5px; color: var(--label-3); display: flex; gap: 12px; white-space: nowrap; }
.srh-mtop .hint kbd { font: 500 11px var(--font-num); padding: 1px 5px; border-radius: 4px; background: var(--fill); color: var(--label-2); margin-right: 4px; }
.srh-m .srh-th, .srh-m .srh-tr { grid-template-columns: 26px minmax(0, 1fr) 80px 48px 56px 46px 28px; column-gap: 10px; }
.srh-m .srh-dfil { margin-bottom: 0; }
.srh-m-hov { background: var(--cell-hover); }
</style>

<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;

/* ---------------- demo data: results for 「夜」 (synthetic) ---------------- */
function srhT(id, title, artist, src, dur, acc, x) {
  x = x || {};
  return { id, title, artist, src, dur, acc, parts: x.parts || 0, plays: x.plays || '', cv: FMP.cover('srh-' + id, x.g ? { glyph: x.g, kind: 3 } : undefined), pl: x.pl };
}
const SRH_LOCAL = [
  Object.assign({}, FMP.T.t01, { pl: '通勤路上' }),
  Object.assign({}, FMP.T.t05, { pl: '星野町 Live 合集', title: '【4K】「夏夜漫遊」全曲 Live' }),
  Object.assign({}, FMP.T.t14, { pl: '週末慢活', title: '晚風告白（夜版）' }),
];
const SRH_ONLINE = [
  srhT('o1', '夜行列車（Live at 河岸留言）', '鹿野青', 'youtube', '4:40', null, { plays: '21萬' }),
  srhT('o2', '【鋼琴】夜行列車 改編 附琴譜', '琴鍵上的鯨', 'bilibili', '4:05', null, { plays: '8.4萬' }),
  srhT('o3', '夜行列車（伴奏）', '鹿野青', 'netease', '4:12', 'paid', { g: '伴' }),
  srhT('o4', '夜曲集', '林以澄', 'netease', '3:58', 'trial', { g: '曲' }),
  srhT('o5', 'Night Train to Nowhere', 'Juno Vale', 'youtube', '3:31', null, { plays: '4.7萬' }),
  srhT('o6', '【合集】深夜電台 夜行 BGM', '安靜的午後', 'bilibili', '1:12:40', null, { parts: 3, plays: '56萬' }),
  srhT('o7', '夜色溫柔', '許晴川', 'netease', '4:21', 'vip', { g: '夜' }),
  srhT('o8', 'Midnight Ferry (lofi)', 'lofi atlas', 'youtube', '2:58', null, { plays: '12萬' }),
  srhT('o9', '【翻唱】夜のむこう 女聲版', '栗子Kuri', 'bilibili', '4:22', null, { plays: '31.5萬' }),
];
const SRH_PARTS = { o6: [['深夜電台 Vol.1', '24:10'], ['深夜電台 Vol.2', '23:52'], ['深夜電台 Vol.3', '24:38']] };
const SRH_SRC_NAME = { bilibili: 'B站', youtube: 'YouTube', netease: '網易雲' };

/* ---------------- phone helpers ---------------- */
function srhRow(t, o) {
  o = o || {};
  const plays = t.plays ? ' · ' + t.plays + '次播放' : '';
  const sub = t.pl
    ? I('check', 'srh-loc') + FMP.esc(t.artist) + ' · ' + FMP.esc(t.pl)
    : FMP.esc(t.artist) + plays;
  let h = FMP.trackRow(t, Object.assign({ sub }, o));
  // mixed results: show the source name next to its mark, not just the mark
  h = h.replace('<div class="t2">' + FMP.src(t.src), '<div class="t2">' + FMP.src(t.src, true));
  return h;
}
function srhParts(t, playingIdx) {
  return (SRH_PARTS[t.id] || FMP.partsOf(t).map((p) => [p.title, p.dur])).map(([title, dur], i) =>
    '<div class="row srh-part' + (i === playingIdx ? ' playing' : '') + '"><span class="pn num">P' + (i + 1) + '</span><div class="meta"><div class="t1">' +
    (i === playingIdx ? '<span class="eq"><i></i><i></i><i></i></span>' : '') + '<span class="tt">' + FMP.esc(title) + '</span></div></div><span class="dur num">' + dur + '</span>' +
    '<button class="ibtn" aria-label="更多" style="color:var(--label-2);margin-right:-10px">' + I('more', 's20') + '</button></div>').join('');
}
function srhChips(on, o) {
  o = o || {};
  const c = (k, label, cnt) => '<button class="chip' + (on === k ? ' on' : '') + '">' + (k !== 'all' ? FMP.src(k) : '') + label +
    (o.err === k ? '<span class="w">' + I('warn', 's16') + '</span>' : (cnt !== undefined ? '<span class="cnt num">' + cnt + '</span>' : '')) + '</button>';
  return '<div class="srh-fil"><div class="srh-chips">' + c('all', '全部', o.counts ? o.counts[0] : undefined) + c('bilibili', 'Bilibili', o.counts ? o.counts[1] : undefined) +
    c('youtube', 'YouTube', o.counts ? o.counts[2] : undefined) + c('netease', '網易雲', o.counts ? o.counts[3] : undefined) + '</div>' + SRH_SORTC + '</div>';
}
function srhSH(title, cnt, right) {
  return '<div class="srh-sh"><span class="ty-title3">' + title + '</span>' + (cnt !== undefined ? '<span class="cnt">' + cnt + '</span>' : '') + '<span class="sp"></span>' + (right || '') + '</div>';
}
const SRH_SORTC = '<button class="srh-sortc" aria-label="排序：綜合排序">' + I('sort') + '綜合排序' + I('chevD') + '</button>';
function srhDock(o) {
  o = o || {};
  const field = '<div class="lg srh-field" data-adapt>' + I('search') +
    (o.query ? '<span class="q">' + FMP.esc(o.query) + (o.caret ? '<span class="caret"></span>' : '') + '</span><button class="clr" aria-label="清除"><span>' + I('close') + '</span></button>'
      : '<span class="ph">搜尋歌曲、歌手' + (o.caret ? '<span class="caret"></span>' : '') + '</span>') + '</div>';
  if (o.kb) return '<div class="srh-dock kb">' + field + '</div>' + srhKeyboard();
  return '<div class="srh-dock">' + (o.track === false ? '' : FMP.mini(o.track)) +
    '<button class="lg srh-orb" data-adapt data-href="library.html" aria-label="回到音樂庫">' + I('library') + '</button>' + field + '</div>';
}
function srhKeyboard() {
  const row = (keys) => '<div class="kr">' + keys + '</div>';
  const ks = (s) => s.split('').map((k) => '<span class="k">' + k + '</span>').join('');
  return '<div class="srh-kb" aria-hidden="true">' + row(ks('qwertyuiop')) + row(ks('asdfghjkl')) +
    row('<span class="k w">' + I('up', 's18') + '</span>' + ks('zxcvbnm') + '<span class="k w">' + I('chevL', 's18') + '</span>') +
    row('<span class="k w">123</span><span class="k w">' + I('globe', 's18') + '</span><span class="k sp">空格</span><span class="k go">搜尋</span>') + '</div>';
}
function srhPhone(ctx, o) {
  const title = '<div class="lt" style="padding-top:58px"><div class="ty-large">搜尋</div></div>';
  const top = o.top !== undefined ? o.top : FMP.ptop('搜尋', '', '', 120);
  return FMP.phone(ctx, {
    content: title + (o.chips === false ? '' : (o.chips || srhChips('all'))) + o.body,
    top,
    dock: false,
    overlay: (o.dockHtml !== undefined ? o.dockHtml : srhDock(o.dock || {})) + (o.overlay || ''),
  });
}
function srhResults(o) {
  o = o || {};
  let h = srhSH('歌單中', SRH_LOCAL.length);

function srhAfterPopover(rowIndex, w) {
  return (root) => {

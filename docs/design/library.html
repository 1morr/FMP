<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音樂庫 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
[class^="lib-"], [class*=" lib-"] { box-sizing: border-box; }
/* ---- cards ---- */
.lib-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; padding: 4px 20px 0; }
.desk .lib-grid { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 22px 18px; padding: 0; }
.lib-card { display: flex; flex-direction: column; gap: 7px; min-width: 0; position: relative; }
.lib-card .cw { position: relative; }
.lib-card .cw > .cover { width: 100%; aspect-ratio: 1; border-radius: 12px; }
.desk .lib-card .cw > .cover { border-radius: 10px; }
.lib-card .nm { font-size: 15px; line-height: 1.3; font-weight: 500; }
.lib-card .sb { font-size: 13px; color: var(--label-2); display: flex; align-items: center; gap: 5px; margin-top: 1px; white-space: nowrap; }
.lib-card .sb .src-name { color: var(--label-2); font-size: 13px; }
.desk .lib-card .nm { font-size: 13px; }
.desk .lib-card .sb, .desk .lib-card .sb .src-name { font-size: 12px; }
.lib-card .sb .dot { color: var(--label-3); }
.lib-card .sb .err { color: var(--warn); display: inline-flex; align-items: center; gap: 3px; }
.lib-card .sb .err svg.i { width: 13px; height: 13px; }
/* refreshing: dim the cover, determinate ring */
.lib-ring { position: absolute; inset: 0; display: grid; place-items: center; border-radius: inherit; background: color-mix(in srgb, var(--bg) 45%, transparent); }
.lib-card .cw .lib-ring { border-radius: 12px; }
.lib-ring svg { width: 54px; height: 54px; transform: rotate(-90deg); }
.lib-ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.lib-ring .tr { stroke: color-mix(in srgb, var(--label) 18%, transparent); }
.lib-ring .pr { stroke: var(--label); }
.lib-ring b { position: absolute; font: 700 13px var(--font-num); color: var(--label); }
.desk .lib-ring svg { width: 44px; height: 44px; }
.desk .lib-ring b { font-size: 11px; }
/* desktop hover: glass play + more over the cover */
.lib-hov .cw > .cover { filter: brightness(.92); }
.lib-cplay { position: absolute; left: 8px; bottom: 8px; width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; z-index: 2; }
.lib-cplay svg.i { width: 18px; height: 18px; }
.lib-cmore { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; z-index: 2; }
.lib-cmore svg.i { width: 16px; height: 16px; }
.lib-rsel .cw > .cover { box-shadow: 0 0 0 3px var(--accent); }
/* drag sort */
.lib-slot { width: 100%; aspect-ratio: 1; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--sep-strong); background: var(--fill); }
.lib-lift { position: absolute; z-index: 20; transform: scale(1.06) rotate(-2deg); }
.lib-lift .cw > .cover { box-shadow: var(--shadow-float); }
.lib-sorting .lib-card:not(.lib-lift) .cw > .cover { animation: lib-jiggle 260ms ease-in-out infinite alternate; }
.lib-sorting .lib-card:nth-child(2n) .cw > .cover { animation-delay: -130ms; }
@keyframes lib-jiggle { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
@media (prefers-reduced-motion: reduce) { .lib-sorting .lib-card .cw > .cover { animation: none; } }
.lib-hint { padding: 0 20px 14px; font-size: 13px; color: var(--label-2); }

/* ---- top bar text capsule ---- */
.lib-gtext { height: 44px; padding: 0 18px; border-radius: var(--r-cap); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; color: var(--glass-ink); }
.lib-gtext.acc { color: var(--accent); }

/* ---- empty ---- */
.lib-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 120px 36px 0; gap: 8px; }
.lib-empty .big { width: 72px; height: 72px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; color: var(--label-2); margin-bottom: 10px; }
.lib-empty .big svg.i { width: 34px; height: 34px; }
.lib-empty .ty-title2 { margin-bottom: 2px; }
.lib-empty .acts { display: flex; gap: 10px; margin-top: 20px; }

/* ---- context menu (phone + desktop) ---- */
.lib-scrim { position: absolute; inset: 0; z-index: 64; background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.lib-preview { position: absolute; z-index: 66; left: 24px; top: 128px; width: 196px; }
.lib-preview .cw > .cover { box-shadow: var(--shadow-float); }
.lib-preview .nm { color: var(--label); }

/* ---- sheets & dialogs ---- */
/* kit gap: the second line of a highlighted desktop menu item keeps glass-ink-2 */
/* page content inside the shared sheet/dialog */
.lib-form { padding: 6px 16px 4px; display: flex; flex-direction: column; gap: 10px; }
.lib-form .src-chip { background: color-mix(in srgb, var(--glass-ink) 10%, transparent); color: var(--glass-ink); }
.dlg .lib-form { padding: 0; }
.desk .lib-f { min-height: 34px; font-size: 13px; border-radius: 8px; padding: 0 10px; gap: 8px; }
.desk .lib-f > svg.i { width: 15px; height: 15px; }
.desk .lib-lab { font-size: 11.5px; font-weight: 600; padding: 4px 2px 0; }
.desk .lib-tip { font-size: 11.5px; line-height: 15px; padding: 0 2px; }
.desk .lib-sw { min-height: 48px; padding: 6px 12px; border-radius: 10px; }
.desk .lib-sw .gl { font-size: 13px; }
.desk .lib-sw .gl small { font-size: 11.5px; line-height: 15px; }
.desk .lib-form .src-chip { height: 20px; font-size: 11.5px; }

.lib-f { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: color-mix(in srgb, var(--glass-ink) 7%, transparent); font-size: 17px; color: var(--glass-ink); }
.lib-f .ph { color: var(--glass-ink-2); }
.lib-f .v { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-f > svg.i { width: 19px; height: 19px; color: var(--glass-ink-2); }
.lib-f.ta { align-items: flex-start; min-height: 88px; padding-top: 15px; }
.lib-f.bad { box-shadow: inset 0 0 0 1.5px var(--danger); }
.lib-f .caret { display: inline-block; width: 2px; height: 21px; vertical-align: -4px; background: var(--accent); border-radius: 1px; }
.lib-lab { font-size: 13px; color: var(--glass-ink-2); padding: 6px 4px 0; }
.lib-tip { font-size: 13px; line-height: 18px; color: var(--glass-ink-2); padding: 0 4px; }
.lib-tip.bad { color: var(--danger); display: flex; gap: 6px; }
.lib-tip.bad svg.i { width: 16px; height: 16px; margin-top: 1px; }
.lib-sw { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-radius: 14px; background: color-mix(in srgb, var(--glass-ink) 7%, transparent); }
.lib-sw .gl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 16px; color: var(--glass-ink); }
.lib-sw .gl small { font-size: 13px; line-height: 17px; color: var(--glass-ink-2); display: flex; align-items: center; gap: 5px; }
.lib-sw.hl { box-shadow: inset 0 0 0 1.5px var(--accent); }
.lib-prog { display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 0; }
.lib-prog .hd { display: flex; align-items: center; gap: 14px; }
.lib-prog .hd .cover { width: 72px; height: 72px; border-radius: 12px; }
.lib-prog .hd b { display: block; font-size: 19px; line-height: 24px; font-weight: 700; color: var(--glass-ink); }
.lib-prog .hd span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--glass-ink-2); margin-top: 4px; }
.lib-bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--glass-ink) 12%, transparent); overflow: hidden; }
.lib-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent-fill); }
.lib-pt { display: flex; justify-content: space-between; font-size: 13px; color: var(--glass-ink-2); margin-top: -6px; }
.lib-pt b { color: var(--glass-ink); font-weight: 600; }
.lib-steps { display: flex; flex-direction: column; gap: 0; border-radius: 14px; background: color-mix(in srgb, var(--glass-ink) 7%, transparent); padding: 4px 14px; }
.lib-steps .st { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; color: var(--glass-ink); }
.lib-steps .st + .st { box-shadow: inset 0 .5px 0 color-mix(in srgb, var(--glass-ink) 10%, transparent); }
.lib-steps .st .ic { width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.lib-steps .st .ic svg.i { width: 18px; height: 18px; }
.lib-steps .st.done .ic { color: var(--ok); }
.lib-steps .st.todo { color: var(--glass-ink-2); }
.lib-steps .st .ic .dotc { width: 8px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--glass-ink) 25%, transparent); }
.lib-steps .st .n { margin-left: auto; font: 500 13px var(--font-num); color: var(--glass-ink-2); }
.lib-kbd { font: 500 11px var(--font-num); color: var(--glass-ink-2); }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const PL = FMP.PL;

/* ---------------- cards ---------------- */
// the user's own order: local and imported mixed, as people actually arrange them
const LIB_ORDER = ['commute', 'covers', 'code', 'lofi', 'weekend', 'cpop', 'learn', 'live'];
function libRing(pct) {
  const r = 22, c = 2 * Math.PI * r;
  return '<span class="lib-ring"><svg viewBox="0 0 54 54"><circle class="tr" cx="27" cy="27" r="' + r + '"/><circle class="pr" cx="27" cy="27" r="' + r + '" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg><b>' + pct + '%</b></span>';
}
function libCard(p, o) {
  o = o || {};
  const cls = ['lib-card'];
  if (o.hov) cls.push('lib-hov');
  if (o.rsel) cls.push('lib-rsel');
  if (o.cls) cls.push(o.cls);
  let sub;
  if (o.refreshing) sub = '<span>刷新中…</span>';
  else if (o.failed) sub = FMP.src(p.src) + '<span class="err">' + I('warn') + '刷新失敗</span>';
  else if (p.kind === 'imported') sub = FMP.src(p.src, true) + '<span class="dot">·</span><span class="num">' + p.count + ' 首</span>';
  else sub = '<span class="num">' + p.count + ' 首</span>';
  const over = (o.refreshing ? libRing(o.refreshing) : '') +
    (o.hov ? '<button class="lg lib-cplay" data-adapt aria-label="播放全部">' + I('play') + '</button><button class="lg lib-cmore" data-adapt aria-label="更多">' + I('more') + '</button>' : '');
  return '<div class="' + cls.join(' ') + '" style="' + (o.style || '') + '"><div class="cw">' + FMP.coverEl(p.cv) + over + '</div>' +
    '<div style="min-width:0"><div class="nm ell">' + FMP.esc(p.name) + '</div><div class="sb">' + sub + '</div></div></div>';
}
function libGrid(o) {
  o = o || {};
  const order = o.order || LIB_ORDER;
  const gs = o.cols ? ' style="grid-template-columns:repeat(' + o.cols + ',minmax(0,1fr));gap:' + (o.gap || '22px 18px') + ';padding:0"' : '';
  return '<div class="lib-grid' + (o.cls ? ' ' + o.cls : '') + '"' + gs + '>' + order.map((id) => {
    if (id === '_slot') return '<div class="lib-card"><div class="lib-slot"></div></div>';
    const s = (o.state || {})[id] || {};
    return libCard(PL[id], s);
  }).join('') + '</div>';
}
const LIB_TITLE = '<div class="lt" style="padding-top:58px"><div class="ty-large">音樂庫</div></div>';
function libPhone(ctx, o) {
  o = o || {};
  const right = o.right !== undefined ? o.right : FMP.gpill([['sort', '排序歌單'], ['plus', '新建歌單'], ['link', '匯入歌單']]);
  return FMP.phone(ctx, {
    content: (o.title || LIB_TITLE) + (o.body !== undefined ? o.body : libGrid(o.grid)),
    top: FMP.ptop(o.inline || '音樂庫', o.left || '', right, 150),
    dock: o.dock !== undefined ? o.dock : { tab: 'library' },
    overlay: o.overlay,
  });
}

/* ---------------- menu ---------------- */
function libMenu(p, style, o) {
  o = o || {};
  const mi = (icon, label, small, cls, k) => '<button class="mi ' + (cls || '') + '" role="menuitem">' + I(icon) + '<span>' + label + (small ? '<small>' + small + '</small>' : '') + '</span>' + (k ? '<span class="k">' + k + '</span>' : '') + '</button>';
  const imp = p.kind === 'imported';
  return '<div class="lg gmenu" data-adapt role="menu" style="' + style + '">' +
    mi('play', '播放全部', o.desk ? '' : '取代目前的佇列', o.hl === 'play' ? 'hl' : '') + mi('shuffle', '隨機播放') +
    '<div class="ms"></div>' + mi('edit', '編輯…', '', o.hl === 'edit' ? 'hl' : '', o.desk ? '⌘I' : '') +
    (imp ? mi('refresh', '立即刷新', '上次 ' + p.last, o.hl === 'refresh' ? 'hl' : '', o.desk ? '⌘R' : '') : '') +
    '<div class="ms thick"></div>' + mi('trash', '刪除歌單', imp ? '只刪 FMP 裡的鏡像，' + (p.src === 'youtube' ? 'YouTube ' : FMP.SRC[p.src].short) + '上的歌單不受影響' : '', 'danger', o.desk ? '⌘⌫' : '') + '</div>';
}

/* ---------------- sheets ---------------- */
function libSheet(title, body, o) {
  o = o || {};
  return '<div class="sheet-wrap"><div class="sheet lg" role="dialog" style="' + (o.style || '') + '"><div class="grab"></div><div class="shead">' +
    FMP.gbtn('close', '取消') + '<span class="stitle">' + title + '</span>' +
    (o.ok === false ? '<span style="width:44px"></span>' : '<button class="gbtn acc-solid" aria-label="完成"' + (o.okDisabled ? ' disabled' : '') + '>' + I('check') + '</button>') + '</div>' + body + '</div></div>';
}
function libImportBody(o) {
  o = o || {};
  const link = o.link === false ? '<span class="v ph">貼上歌單連結</span>' : '<span class="v">' + (o.link || 'https://www.bilibili.com/medialist/detail/ml***') + '</span>';
  const det = o.src ? FMP.srcChip(o.src, true) : '';
  return '<div class="sbody">' + libImportForm(o) + '</div><div class="sfoot"><button class="btn btn-primary"' + (o.disabled ? ' disabled' : '') + '>' + (o.cta || '匯入') + '</button></div>';
}
function libImportForm(o) {
  o = o || {};
  const link = o.link === false ? '<span class="v ph">貼上歌單連結</span>' : '<span class="v">' + (o.link || 'https://www.bilibili.com/medialist/detail/ml***') + '</span>';
  const det = o.src ? FMP.srcChip(o.src, true) : '';
  return '<div class="lib-form">' +
    '<div class="lib-f' + (o.bad ? ' bad' : '') + '">' + I('link') + link + det + '</div>' +
    (o.bad ? '<div class="lib-tip bad">' + I('warn') + '<span>' + o.bad + '</span></div>' : '<div class="lib-tip">支援 Bilibili 收藏夾與合集、YouTube 播放清單、網易雲歌單的分享連結。</div>') +
    '<div class="lib-lab">歌單名稱（選填）</div><div class="lib-f"><span class="v ph">沿用遠端的名稱</span></div>' +
    '<div class="lib-sw' + (o.hlSwitch ? ' hl' : '') + '"><div class="gl">使用登入狀態匯入<small>' + (o.src ? FMP.src(o.src) + '已登入 ' + FMP.SRC[o.src].name + '・私人歌單需要開啟' : '讀取私人歌單需要先登入該音源') + '</small></div><span class="switch' + (o.on ? ' on' : '') + '"></span></div>' +
    '</div>';
}
function libProgBody(o) {
  o = o || {};
  const p = PL.covers;
  return '<div class="sbody"><div class="lib-prog"><div class="hd">' + FMP.coverEl(p.cv, 72) + '<div style="min-width:0"><b>' + p.name + '</b><span>' + FMP.src('bilibili', 'full') + '<span>·</span><span>' + p.owner + '</span><span>·</span><span class="num">' + p.count + ' 首</span></span></div></div>' +
    '<div class="lib-bar"><i style="width:60%"></i></div><div class="lib-pt"><span>正在讀取曲目</span><b class="num">128 / 214</b></div>' +
    '<div class="lib-steps"><div class="st done"><span class="ic">' + I('check') + '</span>取得歌單資訊</div>' +
    '<div class="st"><span class="ic"><span class="spinner"></span></span>讀取曲目<span class="n">128 / 214</span></div>' +
    '<div class="st todo"><span class="ic"><span class="dotc"></span></span>建立匯入歌單</div></div>' +
    '<div class="lib-tip">可以先關掉這個視窗，匯入會在背景繼續，音樂庫的卡片會顯示進度。</div></div></div>' +
    '<div class="sfoot"><button class="btn btn-gray">在背景繼續</button></div>';
}

/* ---------------- desktop ---------------- */
function libDesk(ctx, o) {
  o = o || {};
  const content = '<div style="padding:66px 28px 120px 8px"><div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px"><div><div class="ty-large">音樂庫</div><div class="c2" style="font-size:12px;margin-top:2px">8 張歌單 · 4 張本地、4 張匯入</div></div>' +
    '<div style="display:flex;gap:6px"><button class="btn btn-gray btn-sm">' + I('sort', 's16') + '排序</button><button class="btn btn-gray btn-sm">' + I('link', 's16') + '匯入歌單…</button><button class="btn btn-primary btn-sm">' + I('plus', 's16') + '新建歌單</button></div></div>' +
    libGrid(o.grid) + '</div>';
  return FMP.desktop(ctx, { nav: 'library', content, top: '<span class="wt">音樂庫</span>', detail: o.detail, overlay: o.overlay });
}
function libDeskImport() {
  return '<div class="dialog-wrap"><div class="lg dlg" role="dialog"><div class="dlg-head"><span class="dt">匯入歌單</span><button class="ibtn" aria-label="關閉">' + I('close', 's16') + '</button></div><div class="dlg-body"><div class="lib-form">' +
    '<div class="lib-lab">歌單連結</div><div class="lib-f">' + I('link') + '<span class="v">https://music.163.com/playlist?id=***</span>' + FMP.srcChip('netease', true) + '</div>' +
    '<div class="lib-tip">支援 Bilibili 收藏夾與合集、YouTube 播放清單、網易雲歌單的分享連結。</div>' +
    '<div class="lib-lab">歌單名稱（選填）</div><div class="lib-f"><span class="v ph">沿用遠端的名稱</span></div>' +
    '<div class="lib-sw"><div class="gl">使用登入狀態匯入<small>' + FMP.src('netease') + '已登入網易雲音樂・私人歌單需要開啟</small></div><span class="switch on"></span></div>' +
    '</div></div><div class="dlg-foot"><span class="lib-kbd" style="margin-right:auto">預設每 6 小時自動刷新</span><button class="btn btn-gray">取消</button><button class="btn btn-primary">匯入</button></div></div></div>';
}

/* ---------------- medium width (tablet / narrow window) ---------------- */
function libMid(ctx, o) {
  o = o || {};
  const touch = o.device === 'tablet';
  const head = touch
    ? '<div class="ty-large" style="margin-bottom:18px">音樂庫</div>'
    : '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px"><div><div class="ty-large">音樂庫</div><div class="c2" style="font-size:12px;margin-top:2px">8 張歌單 · 4 張本地、4 張匯入</div></div>' +
      '<div style="display:flex;gap:6px"><button class="btn btn-gray btn-sm">' + I('sort', 's16') + '排序</button><button class="btn btn-gray btn-sm">' + I('link', 's16') + '匯入歌單…</button><button class="btn btn-primary btn-sm">' + I('plus', 's16') + '新建歌單</button></div></div>';
  const content = '<div style="padding:' + (touch ? '62px 32px 150px 24px' : '66px 32px 120px 24px') + '">' + head +
    libGrid({ cols: o.cols, gap: touch ? '26px 20px' : '22px 18px', state: o.state, cls: o.cls }) + '</div>';
  const top = touch
    ? '<span class="wt">音樂庫</span><span class="sp"></span>' + FMP.gpill([['sort', '排序歌單'], ['plus', '新建歌單'], ['link', '匯入歌單']])
    : '<span class="wt">音樂庫</span>';
  return FMP.medium(ctx, { device: o.device, w: o.w, h: o.h, nav: 'library', content, top, overlay: o.overlay });
}
function libMidImport() {
  return '<div class="dialog-wrap"><div class="lg dlg" role="dialog" style="width:560px"><div class="dlg-head"><span class="dt">匯入歌單</span><button class="ibtn" aria-label="關閉">' + I('close', 's20') + '</button></div>' +
    '<div class="dlg-body">' + libImportForm({ src: 'bilibili', on: true }) + '</div>' +
    '<div class="dlg-foot"><span class="lib-kbd" style="margin-right:auto;font-size:13px">預設每 6 小時自動刷新</span><button class="btn btn-gray">取消</button><button class="btn btn-primary">匯入</button></div></div></div>';
}

/* ---------------- page ---------------- */
const ALL = FMP.playlists.map((p) => p.id);
FMP.page({
  title: '音樂庫',

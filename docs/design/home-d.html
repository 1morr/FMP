<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁候選丁：小工具 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
[class^="hd-"], [class*=" hd-"] { box-sizing: border-box; }

/* ---- board surface: light theme puts white tiles on grouped grey (iOS widgets) ---- */
.phone.t-light:has(.hd-board) { --bg: var(--bg-grouped); }
.win.t-light:has(.hd-board) { --bg: var(--bg-grouped); }
.win.t-light:has(.hd-board) .detail { background: var(--cell); }

/* ---- grid: phone 2 columns of 168, desktop auto-fill (4 with the detail panel, 6 without) ---- */
.hd-board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 168px; grid-auto-flow: row dense; gap: 14px; padding: 4px 20px 0; }
.hd-m { grid-column: span 2; }
.hd-l { grid-column: span 2; grid-row: span 2; }
.hd-xl { grid-column: span 4; grid-row: span 2; }
.desk .hd-board { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: 150px; gap: 16px; padding: 0; }

/* ---- tile: solid content ---- */
.hd-t { position: relative; min-width: 0; border-radius: 20px; background: var(--cell); }
.desk .hd-t { border-radius: 14px; }
.hd-in { position: absolute; inset: 0; padding: 10px 12px 0 14px; display: flex; flex-direction: column; overflow: hidden; border-radius: inherit; }
.hd-s .hd-in { padding-bottom: 12px; }
.desk .hd-in { padding: 10px 10px 0 12px; }
.desk .hd-s .hd-in { padding-bottom: 10px; }

.hd-h { display: flex; align-items: center; gap: 6px; height: 22px; margin-bottom: 4px; flex: none; font-size: 13px; line-height: 16px; font-weight: 600; min-width: 0; }
.hd-h b { font-weight: 600; }
.hd-h .sp { flex: 1; }
.hd-h .mt { font-size: 12px; font-weight: 500; color: var(--label-3); white-space: nowrap; }
.hd-h .cv { display: grid; place-items: center; color: var(--label-3); }
.hd-h .cv svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
.hd-h .hm { display: none; width: 24px; height: 24px; color: var(--label-2); }
.hd-h .hm svg.i { width: 16px; height: 16px; }
.hd-mk { display: grid; place-items: center; flex: none; }
.hd-mk svg { width: 16px; height: 16px; display: block; }
.hd-ic { display: grid; place-items: center; flex: none; color: var(--label-2); }
.hd-ic svg.i { width: 17px; height: 17px; }
.hd-ic.gold { color: var(--vip); }
.desk .hd-h { height: 18px; margin-bottom: 6px; font-size: 12px; }
.desk .hd-h .mt { font-size: 11px; }
.desk .hd-mk svg { width: 14px; height: 14px; }
.desk .hd-ic svg.i { width: 15px; height: 15px; }

/* ---- rows inside tiles (not cards: no fill, no border) ---- */
.hd-list { display: flex; flex-direction: column; min-height: 0; }
.hd-r { position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; min-width: 0; }
.hd-r .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hd-r .a { display: flex; align-items: center; gap: 5px; font-size: 14px; line-height: 18px; font-weight: 500; min-width: 0; }
.hd-r .b { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 15px; color: var(--label-2); min-width: 0; }
.hd-r .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hd-r .src svg { width: 13px; height: 13px; }
.hd-r .thumb { border-radius: 6px; }
.hd-r.playing .a { color: var(--accent); font-weight: 600; }
.hd-rk { width: 16px; flex: none; text-align: center; font-size: 13px; font-weight: 600; color: var(--label-2); display: grid; place-items: center; }
.hd-rk svg.i { width: 14px; height: 14px; color: var(--label); }
.hd-du { font-size: 12px; color: var(--label-3); flex: none; }
.hd-r .hd-more { width: 36px; height: 44px; margin-right: -8px; color: var(--label-3); }
.hd-r .hd-more svg.i { width: 18px; height: 18px; }
.hd-dl { flex: none; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; gap: 6px; }
.hd-dl .neg { color: var(--label-3); }
.hd-r .b .w { color: var(--warn); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
.hd-r .b .w svg.i { width: 13px; height: 13px; }
.hd-s .hd-r { min-height: 36px; gap: 8px; }
.hd-s .hd-r .a { font-size: 13.5px; }
.hd-l .hd-r { min-height: 50px; }
.hd-l .hd-list.pl .hd-r, .hd-l .hd-list.nw .hd-r { min-height: 44px; }
.hd-sub { display: flex; align-items: center; gap: 6px; height: 24px; flex: none; font-size: 12px; font-weight: 600; color: var(--label-2); }
.hd-sub .cover { width: 18px; height: 18px; border-radius: 4px; }
.hd-hr { height: .5px; background: var(--sep); margin: 4px 0; flex: none; }

.desk .hd-r { min-height: 37px; gap: 9px; padding: 0 6px; margin: 0 -6px; border-radius: 8px; }
.desk .hd-r .a { font-size: 12.5px; line-height: 16px; }
.desk .hd-r .b { font-size: 11px; line-height: 14px; }
.desk .hd-r .src svg { width: 12px; height: 12px; }
.desk .hd-s .hd-r { min-height: 34px; gap: 7px; }
.desk .hd-s .hd-r .a { font-size: 12px; }
.desk .hd-l .hd-r { min-height: 44px; }
.desk .hd-l .hd-list.pl .hd-r, .desk .hd-l .hd-list.nw .hd-r { min-height: 37px; }
.desk .hd-xl .hd-r { min-height: 52px; }
.desk .hd-rk { font-size: 12px; }
.desk .hd-du { font-size: 11px; }
.desk .hd-dl { font-size: 13px; }
.desk .hd-r .hd-more { display: none; width: 28px; height: 28px; margin: 0; }
.desk .hd-r:hover, .desk .hd-r.hov { background: var(--fill); }
.desk .hd-r:hover .hd-more, .desk .hd-r.hov .hd-more { display: inline-grid; }
.desk .hd-r.hov .hd-du { display: none; }
.hd-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; column-gap: 28px; }

/* ---- per-type content ---- */
/* up next, small */
.hd-nx .cover { width: 56px; height: 56px; border-radius: 8px; }
.hd-nt { margin-top: 8px; display: flex; align-items: center; gap: 5px; font-size: 14px; line-height: 18px; font-weight: 600; min-width: 0; }
.hd-ns { margin-top: 2px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 15px; color: var(--label-2); min-width: 0; }
.hd-ns .src svg { width: 13px; height: 13px; }
.hd-nt .tt, .hd-ns .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* refresh results, small: the number is the news */
.hd-big { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.hd-big .n { font-family: var(--font-display); font-size: 40px; line-height: 42px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.hd-big .n small { font-family: var(--font); font-size: 15px; font-weight: 600; margin-left: 3px; letter-spacing: 0; color: var(--label-2); }
.hd-big .cover { width: 44px; height: 44px; border-radius: 8px; }
.hd-foot-n { margin-top: auto; font-size: 12px; line-height: 15px; color: var(--label-3); }
.desk .hd-big .n { font-size: 32px; line-height: 34px; }
.desk .hd-big .cover { width: 36px; height: 36px; }
.desk .hd-nt { font-size: 12.5px; } .desk .hd-ns, .desk .hd-foot-n { font-size: 11px; }
/* playlists strip */
.hd-pls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hd-l .hd-pls { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.hd-pl { min-width: 0; }
.hd-pl .cover { width: 100%; aspect-ratio: 1; border-radius: 10px; }
.hd-pl .nm { margin-top: 5px; display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 15px; font-weight: 500; min-width: 0; }
.hd-pl .nm .ell { flex: 1; }
.hd-pl .nm .src svg { width: 12px; height: 12px; }
.hd-pl .sb { font-size: 11.5px; line-height: 14px; color: var(--label-2); }
.desk .hd-pl .cover { border-radius: 8px; }
.desk .hd-pl .nm { font-size: 11.5px; }
/* pinned playlist */
.hd-pin { display: flex; flex-direction: column; height: 100%; }
.hd-pin .top { display: flex; justify-content: space-between; align-items: flex-start; }
.hd-pin .top .cover { width: 76px; height: 76px; border-radius: 10px; }
.hd-playb { width: 44px; height: 44px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; color: var(--label); flex: none; }
.hd-playb svg.i { width: 20px; height: 20px; }
.hd-pin .nm { margin-top: auto; font-size: 15px; line-height: 20px; font-weight: 600; }
.hd-pin .sb { font-size: 12px; line-height: 16px; color: var(--label-2); display: flex; align-items: center; gap: 4px; }
.desk .hd-pin .top .cover { width: 64px; height: 64px; border-radius: 8px; }
.desk .hd-playb { width: 32px; height: 32px; }
.desk .hd-playb svg.i { width: 16px; height: 16px; }
.desk .hd-pin .nm { font-size: 13px; line-height: 17px; }
.desk .hd-pin .sb { font-size: 11px; }
.hd-pinm { display: flex; gap: 14px; height: 100%; padding: 2px 0 12px; }
.hd-pinm > .cover { width: 144px; height: 144px; border-radius: 12px; }
.hd-pinm .r { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hd-pinm .r b { font-size: 17px; line-height: 22px; font-weight: 600; }
.hd-pinm .r .sb { font-size: 12px; color: var(--label-2); margin-top: 2px; }
.hd-pinm .r p { margin: 6px 0 0; font-size: 13px; line-height: 17px; color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hd-pinm .r .bt { margin-top: auto; display: flex; gap: 8px; }
/* membership */
.hd-mem { display: flex; flex-direction: column; gap: 8px; }
.hd-mr { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hd-mr .src svg { width: 15px; height: 15px; }
.hd-mr .m { flex: 1; min-width: 0; }
.hd-mr .m b { display: block; font-size: 13px; line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd-mr .m span { display: block; font-size: 12px; line-height: 15px; color: var(--label-2); white-space: nowrap; }
.hd-mr .m span.w { color: var(--warn); font-weight: 600; }
.hd-mr.out .m b { color: var(--label-3); font-weight: 500; }
.desk .hd-mem { gap: 6px; }
.desk .hd-mr .m b { font-size: 12px; line-height: 15px; }
.desk .hd-mr .m span { font-size: 11px; line-height: 14px; }

/* ---- empty, offline, failure: in place, same position ---- */
.hd-st { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; padding-bottom: 6px; }
.hd-st .ic { color: var(--label-3); margin-bottom: 4px; display: grid; }
.hd-st .ic svg.i { width: 24px; height: 24px; }
.hd-st b { font-size: 15px; line-height: 20px; font-weight: 600; }
.hd-st .tx { font-size: 13px; line-height: 17px; color: var(--label-2); }
.hd-st .bt { display: flex; gap: 8px; margin-top: 8px; }
.hd-st.err .ic { color: var(--warn); }
.hd-t.off .hd-h { color: var(--label-2); }

/* ---- top-bar text capsule, hint lines ---- */
.hd-gtext { height: 44px; padding: 0 18px; border-radius: var(--r-cap); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; color: var(--glass-ink); }
.hd-gtext.acc { color: var(--accent); }
.hd-hint { padding: 0 20px 14px; font-size: 13px; line-height: 18px; color: var(--label-2); }
.hd-note { display: flex; align-items: center; gap: 8px; margin: 0 20px 12px; min-height: 32px; font-size: 13px; line-height: 18px; color: var(--label-2); }
.hd-note > svg.i { width: 18px; height: 18px; flex: none; }
.hd-note .tx { flex: 1; min-width: 0; }
.hd-note .ibtn { margin-right: -12px; color: var(--label-3); }
.hd-note .ibtn svg.i { width: 18px; height: 18px; }
.hd-foot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 20px 0; }
.hd-foot span { font-size: 13px; color: var(--label-3); }

/* ---- edit mode (phone): jiggle, remove badge, size button ---- */
.hd-editing .hd-t { animation: hd-jig 300ms ease-in-out infinite alternate; }
.hd-editing .hd-t:nth-child(2n) { animation-delay: -150ms; }
.hd-editing .hd-m, .hd-editing .hd-l { animation-name: hd-jig-wide; }
@keyframes hd-jig { from { transform: rotate(-.9deg); } to { transform: rotate(.9deg); } }
@keyframes hd-jig-wide { from { transform: rotate(-.35deg); } to { transform: rotate(.35deg); } }
@media (prefers-reduced-motion: reduce) { .hd-editing .hd-t { animation: none; } }
.hd-editing .hd-t.sel { animation: none; z-index: 5; box-shadow: 0 0 0 2px var(--accent); }
.hd-rm { position: absolute; z-index: 3; left: -8px; top: -8px; width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
.hd-rm svg.i { width: 15px; height: 15px; stroke-width: 2.8; }
.hd-rs { position: absolute; z-index: 3; right: 8px; bottom: 8px; width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
.hd-rs svg.i { width: 16px; height: 16px; stroke-width: 2.2; }
.hd-rs.sel { background: var(--accent-fill); color: var(--accent-ink); }
.hd-dragwrap { position: relative; }
.hd-slot { border-radius: 20px; box-shadow: inset 0 0 0 1.5px var(--sep-strong); background: var(--fill); }
.hd-lift { position: absolute !important; z-index: 10; transform: scale(1.05) rotate(-2deg); box-shadow: var(--shadow-float); animation: none !important; }
/* size menu */
.hd-szm { top: calc(100% + 8px); left: 0; }
.hd-szm .mi { gap: 12px; }
.hd-szm .mi > span:not(.hd-gly) { flex: 1; min-width: 0; }
.hd-szm .mi svg.i { margin-left: 0; }
.hd-szm .mi:not(.on) svg.i.chk { visibility: hidden; }
.hd-gly { display: grid; grid-template-columns: repeat(2, 9px); grid-auto-rows: 9px; gap: 2px; width: 20px; flex: none; order: 0; }
.hd-gly i { border-radius: 2.5px; background: color-mix(in srgb, var(--glass-ink) 18%, transparent); }
.hd-gly i.f { background: var(--glass-ink); }

/* ---- add-tile sheet ---- */
.hd-ag .cap { padding: 8px 20px 2px; font-size: 13px; color: var(--glass-ink-2); }
.hd-ar { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px 0 20px; color: var(--glass-ink); }
.hd-ar + .hd-ar::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: .5px; background: color-mix(in srgb, var(--glass-ink) 12%, transparent); }
.hd-ai { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--glass-ink) 8%, transparent); color: var(--glass-ink); flex: none; }
.hd-ai svg { width: 20px; height: 20px; }
.hd-ai svg.i { width: 20px; height: 20px; }
.hd-ai.gold { color: var(--vip); }
.hd-ar .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
.hd-ar .m b { font-size: 16px; line-height: 21px; font-weight: 500; }
.hd-ar .m small { font-size: 12.5px; line-height: 16px; color: var(--glass-ink-2); }
.hd-on { display: inline-flex; align-items: center; gap: 3px; flex: none; padding-right: 8px; font-size: 13px; color: var(--glass-ink-2); }
.hd-on svg.i { width: 16px; height: 16px; }
.hd-plus { width: 44px; height: 44px; display: grid; place-items: center; flex: none; }
.hd-plus .o { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; background: var(--accent-fill); color: var(--accent-ink); }
.hd-plus svg.i { width: 17px; height: 17px; stroke-width: 2.4; }
.hd-afoot { padding: 10px 20px 22px; font-size: 12.5px; line-height: 17px; color: var(--glass-ink-2); }

/* ---- ranking page ---- */
.hd-chips { display: flex; gap: 8px; padding: 0 20px 16px; }
.hd-rhd { padding: 0 20px 14px; }
.hd-rhd .s { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--label-2); }
.hd-rhd .s .src-name { font-size: 13px; }
.hd-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 12px; }

/* ---- desktop ---- */
.hd-dwrap { padding: 66px 24px 120px; }
.hd-dh { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 20px; }
.hd-dh .sp { flex: 1; }
.hd-dh .c2 { font-size: 12px; margin-top: 2px; }
.desk .hd-t.hov .hd-h .cv { display: none; }
.desk .hd-t.hov .hd-h .hm { display: inline-grid; }
.desk .hd-t.hov .hd-h { cursor: grab; }
.desk .hd-t.rsel { box-shadow: 0 0 0 2px var(--accent); }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const T = FMP.T;
const PL = FMP.PL;
const esc = FMP.esc;

/* icons the kit lacks */
const X = {
  resize: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-6.5 6.5M10 20H4v-6M4 20l6.5-6.5"/></svg>',
  offline: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10a11 11 0 0 1 4-2.5M13.8 6.7A11 11 0 0 1 19.5 10M7.5 13.2a6.6 6.6 0 0 1 2.6-1.5" stroke-width="2"/><circle cx="12" cy="16.8" r="1.5" fill="currentColor" stroke="none"/><path d="M4.5 4.5l15 15"/></svg>',
};

/* ---------------- data (v1 only: rankings, queue, imported refresh results, playlists, membership) ---------------- */
const RANK = {
  netease: { title: '網易雲 熱歌榜', name: '熱歌榜', ids: ['t23', 't01', 't14', 't09', 't04', 't20', 't12', 't17', 't07', 't24'], when: '2 小時前' },
  bilibili: { title: 'B站 音樂排行', name: '音樂區排行', ids: ['t11', 't03', 't21', 't05', 't08', 't18', 't15'], when: '35 分鐘前' },
  youtube: { title: 'YouTube 音樂熱門', name: '音樂熱門', ids: ['t13', 't02', 't19', 't10', 't06', 't22', 't16'], when: '1 小時前' },
};
const NEXT = ['t02', 't03', 't04', 't05', 't06'];
const UPD = [
  { p: 'lofi', add: 3, when: '2 小時前', news: ['t19', 't16', 't22'] },
  { p: 'covers', add: 2, del: 1, when: '12 分鐘前' },
  { p: 'cpop', err: '登入已失效', when: '1 小時前' },
];
const LIB = ['commute', 'covers', 'code', 'lofi', 'weekend', 'cpop', 'learn', 'live'];

/* ---------------- tile parts ---------------- */
function head(lead, title, o) {
  o = o || {};
  return '<div class="hd-h">' + lead + '<b class="ell">' + title + '</b><span class="sp"></span>' +
    (o.meta ? '<span class="mt num">' + o.meta + '</span>' : '') +
    (o.chev === false ? '' : '<span class="cv">' + I('chevR') + '</span><button class="ibtn hm" aria-label="小工具選單">' + I('more') + '</button>') + '</div>';
}
const mk = (s) => '<span class="hd-mk">' + FMP.srcMark(s) + '</span>';
const ic = (name, cls) => '<span class="hd-ic ' + (cls || '') + '">' + I(name) + '</span>';

function row(t, o) {
  o = o || {};
  const rank = o.rank !== undefined ? '<span class="hd-rk num">' + (o.hov ? I('play') : o.rank) + '</span>' : '';
  const cv = o.cv ? FMP.coverEl(t.cv, o.cv, 'thumb') : '';
  const eq = o.playing ? '<span class="eq" aria-label="正在播放"><i></i><i></i><i></i></span>' : '';
  const part = t.parts > 1 ? '<span class="part">' + t.parts + 'P</span>' : '';
  return '<div class="hd-r' + (o.playing ? ' playing' : '') + (o.hov ? ' hov' : '') + '">' + rank + cv +
    '<div class="m"><div class="a">' + eq + '<span class="tt">' + esc(t.title) + '</span>' + FMP.acc(t.acc) + '</div>' +
    '<div class="b">' + FMP.src(t.src) + part + '<span class="tt">' + esc(t.artist) + '</span></div></div>' +
    (o.dur ? '<span class="hd-du num">' + t.dur + '</span>' : '') +
    (o.more ? '<button class="ibtn hd-more" aria-label="更多">' + I('more') + '</button>' : '') + '</div>';
}

function stateBlock(o) {
  return '<div class="hd-st ' + (o.cls || '') + '">' + (o.icon ? '<span class="ic">' + o.icon + '</span>' : '') +
    '<b>' + o.title + '</b>' + (o.text ? '<span class="tx">' + o.text + '</span>' : '') + (o.bt ? '<div class="bt">' + o.bt + '</div>' : '') + '</div>';
}

function tile(size, inner, o) {
  o = o || {};
  const cls = ['hd-t', 'hd-' + size];
  if (o.cls) cls.push(o.cls);
  const edit = o.edit
    ? '<button class="lg hd-rm" data-adapt aria-label="從首頁移除">' + I('minus') + '</button>' +
      (o.rsSel ? '<button class="hd-rs sel" aria-label="改尺寸" aria-expanded="true">' + X.resize + '</button>' : '<button class="lg hd-rs" data-adapt aria-label="改尺寸">' + X.resize + '</button>')
    : '';
  return '<section class="' + cls.join(' ') + '"' + (o.style ? ' style="' + o.style + '"' : '') + '><div class="hd-in">' + inner + '</div>' + edit + (o.extra || '') + '</section>';
}

/* ---------------- tile types ---------------- */
function rankTile(src, size, o) {
  o = o || {};
  const R = RANK[src];
  const d = o.desk;
  const h = head(mk(src), R.title, { chev: size !== 's' });
  let body;
  if (o.state === 'offline') {
    body = stateBlock({ cls: 'off', icon: X.offline, title: '離線', text: '連上網路後自動更新' });
  } else if (o.state === 'error') {
    body = stateBlock({ cls: 'err', icon: I('warn'), title: '讀不到排行榜', text: FMP.SRC[src].short + '回應「請求太頻繁」', bt: '<button class="btn btn-gray btn-xs">' + I('refresh', 's16') + '重試</button>' });
  } else {
    const n = { s: 3, m: 3, l: 6, xl: 10 }[size];
    const ids = R.ids.slice(0, n);
    const r = (id, i) => row(T[id], {
      rank: i + 1, playing: !o.idle && id === FMP.now.id,
      cv: size === 's' ? 0 : d ? (size === 'xl' ? 36 : size === 'l' ? 32 : 28) : (size === 'l' ? 40 : 36),
      more: size !== 's', dur: d && size !== 's', hov: o.hov === i,
    });
    body = '<div class="hd-list' + (size === 'xl' ? ' hd-cols' : '') + '">' + ids.map(r).join('') + '</div>';
  }
  return tile(size, h + body, { ...o, cls: (o.cls || '') + (o.state === 'offline' ? ' off' : '') });
}

function nextTile(size, o) {
  o = o || {};
  const h = head(ic('nextUp'), '接下來', { meta: o.empty ? '' : (size === 's' ? '6 / 64' : '佇列第 6 / 64 首'), chev: size !== 's' });
  if (o.empty) {
    return tile(size, h + stateBlock({ title: '佇列是空的', text: '點下面排行榜的任一首就會開始播放，或去搜尋三個音源。', bt: '<button class="btn btn-gray btn-sm">' + I('search', 's16') + '搜尋</button>' }), o);
  }
  if (size === 's') {
    const t = T[NEXT[0]];
    return tile('s', h + '<div class="hd-nx">' + FMP.coverEl(t.cv, 56) + '</div><div class="hd-nt"><span class="tt">' + esc(t.title) + '</span>' + FMP.acc(t.acc) + '</div><div class="hd-ns">' + FMP.src(t.src) + '<span class="tt">' + esc(t.artist) + '</span></div>', o);
  }
  const ids = size === 'm' ? NEXT.slice(0, 3) : [FMP.now.id].concat(NEXT);
  return tile(size, h + '<div class="hd-list">' + ids.map((id) => row(T[id], { cv: o.desk ? 28 : (size === 'l' ? 40 : 36), more: true, dur: o.desk, playing: id === FMP.now.id })).join('') + '</div>', o);
}

function plRow(u, o) {
  const p = PL[u.p];
  const sub = u.err
    ? '<span class="w">' + I('warn') + '刷新失敗 · ' + u.err + '</span>'
    : '<span class="tt">' + (u.add ? '多了 ' + u.add + ' 首' : '') + (u.del ? '、少了 ' + u.del + ' 首' : '') + ' · ' + u.when + '</span>';
  const delta = u.err ? '' : '<span class="hd-dl"><span>+' + u.add + '</span>' + (u.del ? '<span class="neg">−' + u.del + '</span>' : '') + '</span>';
  return '<div class="hd-r">' + FMP.coverEl(p.cv, o.desk ? 28 : 36, 'thumb') + '<div class="m"><div class="a"><span class="tt">' + esc(p.name) + '</span></div><div class="b">' + FMP.src(p.src) + sub + '</div></div>' + delta + '</div>';
}
function updTile(size, o) {
  o = o || {};
  const h = head(ic('refresh'), '歌單更新', { meta: size === 's' || o.empty ? '' : '最近 7 天', chev: size !== 's' && !o.empty });
  if (o.empty) {
    return tile(size, h + stateBlock({ title: '還沒有匯入歌單', text: '匯入後，新加的曲目會出現在這裡。', bt: '<button class="btn btn-gray btn-xs">' + I('link', 's16') + '匯入歌單</button>' }), o);
  }
  const u = UPD[0], p = PL[u.p];
  if (size === 's') {
    return tile('s', h + '<div class="hd-big"><span class="n">+' + u.add + '<small>首</small></span>' + FMP.coverEl(p.cv, null, '') + '</div>' +
      '<div class="hd-nt"><span class="tt">' + esc(p.name) + '</span></div><div class="hd-ns">' + FMP.src(p.src) + '<span class="tt">' + u.when + '</span></div>' +
      '<div class="hd-foot-n">另有 2 張有變動</div>', o);
  }
  if (size === 'm') {
    return tile('m', h + '<div class="hd-list pl">' + UPD.map((x) => plRow(x, o)).join('') + '</div>', o);
  }
  return tile(size, h + '<div class="hd-sub">' + FMP.coverEl(p.cv, 18) + esc(p.name) + ' 新加的 ' + u.add + ' 首 · ' + u.when + '</div>' +
    '<div class="hd-list nw">' + u.news.map((id) => row(T[id], { cv: o.desk ? 28 : 36, more: true, dur: o.desk })).join('') + '</div>' +
    '<div class="hd-hr"></div><div class="hd-list pl">' + UPD.slice(1).map((x) => plRow(x, o)).join('') + '</div>', o);
}

function libTile(size, o) {
  o = o || {};
  const h = head(ic('library'), '歌單', { meta: o.empty ? '' : LIB.length + ' 張', chev: !o.empty });
  if (o.empty) {
    return tile(size, h + stateBlock({ title: '還沒有歌單', text: '建立自己的歌單，或貼上連結匯入。', bt: '<button class="btn btn-gray btn-sm">' + I('plus', 's16') + '新建</button><button class="btn btn-gray btn-sm">' + I('link', 's16') + '匯入</button>' }), o);
  }
  const ids = LIB.slice(0, size === 'm' ? 4 : 6);
  return tile(size, h + '<div class="hd-pls">' + ids.map((id) => {
    const p = PL[id];
    return '<div class="hd-pl">' + FMP.coverEl(p.cv) + '<div class="nm">' + (p.kind === 'imported' ? FMP.src(p.src) : '') + '<span class="ell">' + esc(p.name) + '</span></div>' +
      (size === 'l' ? '<div class="sb num">' + p.count + ' 首</div>' : '') + '</div>';
  }).join('') + '</div>', o);
}

function pinTile(id, size, o) {
  o = o || {};
  const p = PL[id];
  const sub = (p.kind === 'imported' ? FMP.src(p.src) : '') + '<span class="num">' + p.count + ' 首</span>';
  if (size === 's') {
    return tile('s', '<div class="hd-pin"><div class="top">' + FMP.coverEl(p.cv) + '<button class="hd-playb" aria-label="播放「' + esc(p.name) + '」">' + I('play') + '</button></div>' +
      '<div class="nm ell">' + esc(p.name) + '</div><div class="sb">' + sub + '</div></div>', o);
  }
  return tile('m', '<div class="hd-pinm">' + FMP.coverEl(p.cv) + '<div class="r"><b class="ell">' + esc(p.name) + '</b><span class="sb num">' + p.count + ' 首 · ' + p.dur + '</span>' + (p.desc ? '<p>' + esc(p.desc) + '</p>' : '') +
    '<div class="bt"><button class="btn btn-primary btn-sm">' + I('play', 's16') + '播放</button><button class="btn btn-gray btn-sm">' + I('shuffle', 's16') + '隨機</button></div></div></div>', o);
}

function memTile(size, o) {
  o = o || {};
  const h = head(ic('crown', 'gold'), '會員', { chev: size !== 's' });
  const line = (s, b, span, cls) => '<div class="hd-mr ' + (cls || '') + '">' + FMP.src(s) + '<div class="m"><b>' + b + '</b>' + (span ? '<span class="' + (cls === 'warn' ? 'w' : '') + '">' + span + '</span>' : '') + '</div></div>';
  return tile(size, h + '<div class="hd-mem">' +
    line('netease', size === 's' ? '黑膠 VIP' : '網易雲音樂 · 黑膠 VIP', '8 天後到期', 'warn') +
    line('bilibili', size === 's' ? '大會員' : 'Bilibili · 大會員', '2027-03-02 到期') +
    line('youtube', size === 's' ? 'YouTube' : 'YouTube', '未登入', 'out') + '</div>', o);
}

/* ---------------- boards ---------------- */
const board = (tiles, cls) => '<div class="hd-board' + (cls ? ' ' + cls : '') + '">' + tiles.join('') + '</div>';
// the default arrangement for a new user (phone)
function defaultTiles(o) {

}

FMP.page({

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設計系統 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
  .sys-panel { border-radius: 22px; padding: 26px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.08); }
  .sys-h { font-size: 13px; font-weight: 600; color: var(--label-2); margin: 0 0 12px; }
  .sys-h + .sys-h { margin-top: 24px; }
  .sys-grid { display: grid; gap: 18px; }
  .sys-sw { display: flex; align-items: center; gap: 12px; }
  .sys-sw i { width: 44px; height: 44px; border-radius: 12px; flex: none; box-shadow: inset 0 0 0 .5px var(--sep-strong); }
  .sys-sw b { display: block; font-size: 13px; font-weight: 600; }
  .sys-sw small { display: block; font: 12px var(--font-num); color: var(--label-2); }
  .sys-stage { position: relative; height: 430px; border-radius: 18px; overflow: hidden; background: var(--bg); }
  .sys-belt { position: absolute; top: 14px; left: 0; display: flex; gap: 14px; animation: sysBelt 26s linear infinite alternate; }
  .sys-belt .cover { width: 150px; height: 150px; border-radius: 14px; }
  .sys-belt.b2 { top: 240px; animation-duration: 33s; animation-direction: alternate-reverse; }
  .sys-text { position: absolute; left: 24px; top: 184px; font: 700 38px/1 var(--font-display); color: var(--label); letter-spacing: -.01em; white-space: nowrap; }
  @keyframes sysBelt { from { transform: translateX(0); } to { transform: translateX(-520px); } }
  @media (prefers-reduced-motion: reduce) { .sys-belt { animation: none; } }
  .sys-tiers { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 22px; }
  .sys-tier { margin: 0; flex: none; }
  .sys-tier figcaption { margin-top: 8px; font-size: 12px; color: var(--label-2); line-height: 1.45; }
  .sys-tier figcaption b { display: block; font-size: 13px; color: var(--label); }
  .sys-scr { position: relative; border-radius: 10px; overflow: hidden; background: var(--cell-2); box-shadow: inset 0 0 0 .5px var(--sep-strong); }
  .sys-scr i { position: absolute; display: block; }
  .sys-scr .g { background: color-mix(in srgb, var(--label) 22%, transparent); }
  .sys-scr .c { background: var(--fill-2); border-radius: 3px; }
  .sys-scr .s { background: color-mix(in srgb, var(--label) 7%, var(--bg)); box-shadow: inset 1px 0 0 var(--sep-strong); }
  .sys-tt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .sys-tt th, .sys-tt td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; border-bottom: .5px solid var(--sep); }
  .sys-tt th { color: var(--label-2); font-weight: 600; }
  .sys-kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; font-size: 13px; }
  .sys-kv dt { color: var(--label-2); }
  .sys-kv dd { margin: 0; }
  .sys-type > div { display: flex; align-items: baseline; gap: 18px; padding: 7px 0; border-bottom: .5px solid var(--sep); }
  .sys-type > div > small { width: 120px; flex: none; font: 12px var(--font-num); color: var(--label-2); }
  .sys-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .sys-box { border-radius: 16px; background: var(--cell); overflow: hidden; box-shadow: inset 0 0 0 .5px var(--sep); }
  .t-light .sys-box { box-shadow: inset 0 0 0 .5px var(--sep), 0 1px 2px rgba(0,0,0,.04); }
  .sys-note { font-size: 12.5px; color: var(--label-2); line-height: 1.5; margin-top: 10px; }
  .sys-acc-demo { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .sys-radius { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .sys-radius div { background: var(--fill-2); display: grid; place-items: center; font: 11px var(--font-num); color: var(--label-2); }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const panel = (ctx, w, html, style) => '<div class="scr sys-panel t-' + ctx.theme + '" data-tone="' + ctx.theme + '" style="width:' + w + 'px;background:' + (ctx.theme === 'dark' ? '#0D0C11' : '#FFFFFF') + ';' + (style || '') + '">' + html + '</div>';

function stage(ctx) {
  const covers = (k) => FMP.tracks.slice(k, k + 9).map((t) => FMP.coverEl(t.cv)).join('');
  return '<div class="sys-stage">' +
    '<div class="sys-belt">' + covers(0) + '</div><div class="sys-text">文字也會被折彎 Liquid Glass</div><div class="sys-belt b2">' + covers(9) + '</div>' +
    // regular glass: tab bar
    '<nav class="lg tabbar" data-adapt style="position:absolute;left:24px;top:346px;width:290px;height:62px;border-radius:31px;display:flex;align-items:center;padding:0 4px">' +
    '<span class="tab-ind" style="left:4px;width:94px"></span>' +
    '<button class="tab on">' + I('library') + '<span>音樂庫</span></button><button class="tab">' + I('queue') + '<span>佇列</span></button><button class="tab">' + I('settings') + '<span>設定</span></button></nav>' +
    '<button class="lg search-orb" data-adapt style="position:absolute;left:324px;top:346px;width:62px;height:62px;border-radius:31px;display:grid;place-items:center">' + I('search') + '</button>' +
    // mini player
    '<div class="lg mini" data-adapt style="position:absolute;left:24px;top:174px;width:362px;height:56px;border-radius:28px">' + FMP.coverEl(FMP.now.cv, 40) + '<div class="mi"><b><span class="tt">夜行列車</span></b><span>' + FMP.src('netease') + '<span class="ell">鹿野青</span></span></div><button class="ibtn">' + I('pause', 's24') + '</button><button class="ibtn">' + I('next', 's24') + '</button><span class="prog"><i style="width:38%"></i></span></div>' +
    // round buttons + pill
    '<div style="position:absolute;right:24px;top:24px;display:flex;gap:10px">' + FMP.gbtn('chevL', '返回') + FMP.gpill([['select', '多選'], ['sort', '排序'], ['plus', '新建']]) + FMP.gbtn('more', '更多') + '</div>' +
    // clear glass over media
    '<button class="lg gbtn" data-lg-variant="clear" style="position:absolute;right:48px;top:290px;width:64px;height:64px">' + I('play', 's28') + '</button>' +
    '</div>';
}

const ACC_NAME = () => (FMP.ACCENTS.find(([k]) => k === document.documentElement.dataset.accent) || FMP.ACCENTS[0])[1];
function swatches(ctx) {
  const sw = (name, v, note) => '<div class="sys-sw"><i style="background:' + v + '"></i><span><b>' + name + '</b><small>' + note + '</small></span></div>';
  const dark = ctx.theme === 'dark';
  return '<div class="sys-h">中性色（' + (dark ? '深色' : '淺色') + '）</div><div class="sys-grid" style="grid-template-columns:repeat(4,1fr)">' +
    sw('底 bg', 'var(--bg)', dark ? '#0D0C11' : '#FFFFFF') +
    sw('分組底 bg-grouped', 'var(--bg-grouped)', dark ? '#0D0C11' : '#F2F1F6') +
    sw('格 cell', 'var(--cell)', dark ? '#19181F' : '#FFFFFF') +
    sw('填色 fill', 'var(--fill)', dark ? 'white 8%' : 'ink 6%') +
    sw('主文字 label', 'var(--label)', dark ? '#F5F4FA' : '#15141A') +
    sw('次文字 label-2', 'var(--label-2)', dark ? '62%' : '60%') +
    sw('三級 label-3', 'var(--label-3)', '40%') +
    sw('分隔線 sep', 'var(--sep)', dark ? 'white 9%' : 'ink 10%') +
    '</div><div class="sys-h" style="margin-top:24px">功能色</div><div class="sys-grid" style="grid-template-columns:repeat(4,1fr)">' +
    sw('強調 accent', 'var(--accent)', '目前：' + ACC_NAME() + '；文字與圖示') +
    sw('強調底 accent-fill', 'var(--accent-fill)', '按鈕底，字 ≥ 5:1') +
    sw('會員 vip', 'var(--vip)', '#F4B400') +
    sw('試聽 trial', 'var(--trial-ink)', dark ? '#6CB6FF' : '#0066D6') +
    sw('錯誤 danger', 'var(--danger)', dark ? '#FF6961' : '#E5372B') +
    sw('警告 warn', 'var(--warn)', dark ? '#FFC23D' : '#B87800') +
    sw('成功 ok', 'var(--ok)', dark ? '#42D88A' : '#148A4C') +
    sw('遮罩 scrim', 'var(--scrim)', dark ? 'black 50%' : 'ink 28%') +
    '</div><div class="sys-h" style="margin-top:24px">音源（由插件宣告，宿主只負責畫）</div><div class="sys-grid" style="grid-template-columns:repeat(4,1fr)">' +
    sw('Bilibili', 'var(--src-bilibili)', '#FB7299') + sw('YouTube', 'var(--src-youtube)', '#FF3B30') + sw('網易雲音樂', 'var(--src-netease)', '#E8463B') + sw('lrclib', 'var(--src-lrclib)', '#8E8A99') + '</div>';
}

function typeScale(ctx, desk) {
  const rows = desk
    ? [['ty-large', '頁面標題 26/32 Bold', '音樂庫'], ['ty-title2', '區段標題 19/24 Bold', '線上結果'], ['ty-head', '列表標題 14/18 Semibold', '夜行列車'], ['ty-body', '內文 14/19', '收錄於 2026 年專輯《夜行》'], ['ty-sub', '次要 13/17', '鹿野青 · 4:12'], ['ty-foot', '註腳 12/16', '每 6 小時刷新'], ['ty-cap', '說明 11/14', '分 P 6']]
    : [['ty-large', '大標題 34/41 Bold', '音樂庫'], ['ty-title2', '標題二 22/28 Bold', '線上結果'], ['ty-title3', '標題三 20/25 Semibold', '通勤路上'], ['ty-head', '標題列 17/22 Semibold', '夜行列車'], ['ty-body', '內文 17/22', '收錄於 2026 年專輯《夜行》'], ['ty-sub', '次要 15/20', '鹿野青'], ['ty-foot', '註腳 13/18', '每 6 小時刷新 · 12 分鐘前'], ['ty-cap', '說明 12/16', '共 64 首']];
  return '<div class="sys-h">' + (desk ? '桌面（macOS／Windows 的內文較小）' : '手機（iOS 文字樣式，跟隨系統字級）') + '</div><div class="sys-type' + (desk ? ' desk' : '') + '">' + rows.map(([c, n, s]) => '<div><small>' + n + '</small><span class="' + c + '">' + s + '</span></div>').join('') + '</div>' +
    '<div class="sys-note">字體用各平台的系統字：Apple 是 SF Pro＋蘋方，Android 是 Roboto＋Noto Sans CJK，Windows 是 Segoe UI Variable＋微軟正黑體。不打包字體，設定也不提供字體選項。數字一律等寬數字（tabular）。</div>';
}

function badges(ctx) {
  const rows = ['t01', 't04', 't09', 't05', 't02'].map((id, i) => FMP.trackRow(FMP.T[id], { playing: i === 0 })).join('');
  return '<div class="sys-h">音源標識</div><div class="sys-row">' + ['bilibili', 'youtube', 'netease', 'lrclib'].map((s) => FMP.src(s, true)).join('<span style="width:10px"></span>') + '</div>' +
    '<div class="sys-row" style="margin-top:10px">' + ['bilibili', 'youtube', 'netease'].map((s) => FMP.srcChip(s, true)).join('') + '</div>' +
    '<div class="sys-h" style="margin-top:22px">存取等級</div><div class="sys-row">' + FMP.acc('vip') + FMP.acc('paid') + FMP.acc('trial') + '<span style="width:16px"></span>' + FMP.acc('vip', true) + FMP.acc('paid', true) + FMP.acc('trial', true) + '<span class="part">6P</span></div>' +
    '<div class="sys-note">三種會限制收聽的等級才顯示，形狀各不同（實心、外框、半圓），色盲也分得出；免費與插件判斷不了的不顯示，列表不會被徽章淹沒。</div>' +
    '<div class="sys-h" style="margin-top:22px">在曲目列裡</div><div class="sys-box" style="--sep-inset:76px">' + rows + '</div>';
}

function components(ctx) {
  return '<div class="sys-h">按鈕</div><div class="sys-row"><button class="btn btn-primary">' + I('play', 's18') + '播放全部</button><button class="btn btn-tinted">' + I('shuffle', 's18') + '隨機播放</button><button class="btn btn-gray">取消</button><button class="btn btn-plain">清空</button><button class="btn btn-danger">從遠端移除</button><button class="btn btn-primary btn-sm">新建歌單</button></div>' +
    '<div class="sys-h" style="margin-top:22px">切換</div><div class="sys-row"><button class="tog on" data-toggle>' + I('shuffle') + '隨機</button><button class="tog" data-toggle>' + I('repeat') + '循環</button><button class="tog on">' + I('repeat1') + '單曲循環</button><span style="width:12px"></span><span class="switch on"></span><span class="switch"></span><span class="check on">' + I('check') + '</span><span class="check">' + I('check') + '</span></div>' +
    '<div class="sys-h" style="margin-top:22px">篩選與分段</div><div class="sys-row"><button class="chip on">全部音源</button><button class="chip">' + FMP.srcMark('bilibili') + 'Bilibili</button><button class="chip">' + FMP.srcMark('youtube') + 'YouTube</button><button class="chip">' + FMP.srcMark('netease') + '網易雲</button><div class="seg"><button class="on">歌詞</button><button>佇列</button></div></div>' +
    '<div class="sys-h" style="margin-top:22px">欄位</div><div class="field" style="max-width:360px">' + I('search') + '<span class="ph">搜尋三個音源</span></div>' +
    '<div class="sys-h" style="margin-top:22px">群組列表</div><div class="group" style="margin:0;max-width:420px">' +
    '<div class="gcell" style="--sep-inset:58px"><span class="gicon" style="background:#8E8A99">' + I('user') + '</span><span class="gl">帳號<small>2 個已登入 · 1 個會員快到期</small></span><span class="gv">' + I('chevR', 'chev') + '</span></div>' +
    '<div class="gcell" style="--sep-inset:58px"><span class="gicon" style="background:#8E8A99">' + I('plugin') + '</span><span class="gl">插件</span><span class="gv">1 個更新' + I('chevR', 'chev') + '</span></div>' +
    '<div class="gcell" style="--sep-inset:58px"><span class="gicon" style="background:#8E8A99">' + I('lyrics') + '</span><span class="gl">自動匹配歌詞</span><span class="switch on"></span></div></div>';
}

function overlays(ctx) {
  return '<div style="position:relative;height:400px;border-radius:18px;overflow:hidden;background:var(--bg)">' +
    '<div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px">' + FMP.playlists.map((p) => FMP.coverEl(p.cv, null, '', 'width:100%;aspect-ratio:1')).join('') + '</div>' +
    FMP.confirm({ title: '從「翻唱精選」移除 2 首？', body: '會從你在 Bilibili 的收藏夾刪掉，App 裡的匯入歌單隨後刷新。', tracks: ['t03', 't08'], ok: '移除 2 首' }).replace('class="dialog-wrap"', 'class="dialog-wrap" style="position:absolute"') +
    FMP.toast('<span style="display:flex;align-items:center;gap:8px">' + I('check', 's18') + '<span>已加入「通勤路上」</span></span><button class="btn btn-plain">查看</button>', { style: 'bottom:14px;left:60px;right:60px' }) +
    '</div><div class="sys-note">提示只有一個入口（brief §13），依錯誤類別給文字與動作，例如「登入」「重試」。警示框、sheet、選單都是加厚的玻璃（填色比導覽重），因為它們上面有整段文字。確認框列出它作用的曲目，每首帶封面。</div>' +
    '<div class="sys-h" style="margin-top:22px">手機：一首歌的「更多」是底部 sheet</div><div style="position:relative;height:560px;max-width:390px;border-radius:18px;overflow:hidden;background:var(--bg)">' +
    FMP.trackSheet(FMP.T.t08, [['play', '播放', '臨時播放，不動佇列'], ['nextUp', '下一首播放'], ['queue', '加入佇列', '加在佇列最後'], ['addlist', '加入歌單…'], '-', ['lyrics', '匹配歌詞…'], ['link', '複製連結'], '=', ['cloud', '從 B 站收藏夾移除', '寫回 B 站，會先確認', 'danger']]).replace('class="sheet-wrap"', 'class="sheet-wrap" style="position:absolute"') +
    '</div><div class="sys-note">選單和確認刻意不同形狀：手機上一首歌的「更多」從底部升起（拇指搆得到，頂端是曲目摘要），會寫到遠端的確認是置中的對話框。連點兩下不會從選單直接點進「移除」。頂列按鈕（例如歌單右上的 ⋯）的選單照 iOS 慣例從按鈕往下長；長按卡片是 iOS 的情境選單。桌面一律右鍵選單＋置中確認框。</div>' +
    '<div class="sys-h" style="margin-top:22px">刷新狀態列</div><div style="max-width:420px;border-radius:12px;overflow:hidden;background:var(--bg)">' +
    FMP.refreshLine({ text: '刷新中 · 已讀 128 / 214 首', pct: 60 }) + FMP.refreshLine({ state: 'err', text: '刷新失敗：B 站的登入已失效', action: '<button class="btn btn-plain">重新登入</button>' }) +
    '</div><div class="sys-note">匯入歌單刷新時，在按鈕下方出現一條狀態列，底邊的細線就是進度（取自 A）；不用卡片。</div>';
}

function radii(ctx) {
  const r = (n, w, h) => '<div style="width:' + w + 'px;height:' + h + 'px;border-radius:' + n + '">' + n + '</div>';
  return '<div class="sys-h">圓角：控制項一律膠囊，容器和裝它的東西同心</div><div class="sys-radius">' + r('6px', 48, 48) + r('10px', 72, 72) + r('14px', 96, 96) + r('16px', 120, 72) + r('26px', 120, 80) + r('30px', 120, 80) + r('999px', 150, 44) + '</div>' +
    '<div class="sys-kv" style="margin-top:18px"><dt>縮圖</dt><dd>6（列表 48×48、桌面 36×36）</dd><dt>封面卡</dt><dd>10–12；大封面 14</dd><dt>群組列表</dt><dd>16（手機）、12（桌面）</dd><dt>對話框／sheet</dt><dd>26／30；浮動 sheet 34</dd><dt>視窗</dt><dd>16，側欄內縮 8 → 圓角 12（同心）</dd><dt>間距</dt><dd>4 的倍數：4、8、12、16、20、24、32、40、56；手機邊距 16–20，桌面內容邊距 32</dd><dt>觸控目標</dt><dd>手機的點擊區域 ≥ 44：視覺比 44 小的控制（切換鈕 34、chip 32、勾選 24）四周補透明的點擊區；桌面滑鼠目標 ≥ 28</dd></div>';
}

function motion(ctx) {
  return '<div class="sys-kv"><dt>變形（morph）</dt><dd>520ms，cubic-bezier(.32,.72,0,1)：sheet 升起、播放頁左右滑換畫面（導覽與迷你播放器捲動時不變形）</dd><dt>彈性（spring）</dt><dd>520ms，cubic-bezier(.32,1.28,.52,1)：選取膠囊滑動、開關</dd><dt>一般</dt><dd>160ms／280ms，ease-out：hover、顏色、明暗翻轉</dd><dt>按下</dt><dd>按鈕縮到 0.96；導覽的選取膠囊放大到 1.12 再回彈，像一滴水被按住</dd><dt>減少動態效果</dt><dd>sheet 與換畫面改成淡入淡出，選取膠囊不彈跳，播放頁背景停止流動，等化器靜止</dd><dt>降低透明度</dt><dd>玻璃全部換成「最低」：不透明的實心底，保留邊緣高光</dd></div>';
}

/* width tiers: three schematic screens + the rules table */
function widthTiers(ctx) {
  const cards = (x0, y0, w, h, cols, rows, gap) => { let o = ''; const cw = (w - gap * (cols - 1)) / cols; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) o += '<i class="c" style="left:' + (x0 + c * (cw + gap)) + 'px;top:' + (y0 + r * (cw + gap)) + 'px;width:' + cw + 'px;height:' + cw + 'px"></i>'; return o; };
  const narrow = '<div class="sys-scr" style="width:96px;height:180px">' + cards(10, 22, 76, 0, 2, 3, 8) +
    '<i class="g" style="left:6px;right:6px;bottom:38px;height:14px;border-radius:7px"></i><i class="g" style="left:6px;width:62px;bottom:10px;height:22px;border-radius:11px"></i><i class="g" style="right:6px;width:22px;bottom:10px;height:22px;border-radius:11px"></i></div>';
  const mid = '<div class="sys-scr" style="width:240px;height:180px">' +
    '<i class="g" style="left:5px;top:5px;bottom:5px;width:20px;border-radius:7px"></i>' + cards(36, 18, 196, 0, 4, 2, 8) +
    '<i class="g" style="left:36px;right:8px;bottom:8px;height:18px;border-radius:9px"></i></div>';
  const wide = '<div class="sys-scr" style="width:324px;height:180px">' +
    '<i class="g" style="left:5px;top:5px;bottom:5px;width:56px;border-radius:7px"></i>' + cards(72, 18, 168, 0, 5, 3, 6) +
    '<i class="s" style="right:0;top:0;bottom:0;width:76px"></i><i class="c" style="right:12px;top:16px;width:52px;height:52px"></i><i class="c" style="right:12px;top:76px;width:52px;height:6px"></i><i class="c" style="right:28px;top:88px;width:36px;height:6px"></i>' +

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播放頁 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
/* on-media token set: everything inside sits on the cover-coloured field */
.pl-m { position: absolute; inset: 0; color: #fff;
  --label: #fff; --label-2: rgba(255, 255, 255, .74); --label-3: rgba(255, 255, 255, .52); --label-4: rgba(255, 255, 255, .3);
  --fill: rgba(255, 255, 255, .14); --fill-2: rgba(255, 255, 255, .24); --sep: rgba(255, 255, 255, .14);
  --cell-hover: rgba(255, 255, 255, .08); --accent: var(--accent-300); --accent-soft: rgba(255, 255, 255, .12); --trial-ink: var(--trial-dark); }
/* no accent: on the cover field the "on" fill is white with ink text */
html:not([data-accent]) .pl-m, html[data-accent="none"] .pl-m { --accent-fill: #fff; --accent-ink: #15141A; }
.pl-m .acc-paid { color: var(--vip); box-shadow: inset 0 0 0 1.3px var(--vip); }
/* luminance scrim: keeps white type at AA over light covers */
.pl-scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0, 0, 0, .26), rgba(0, 0, 0, .1) 30%, rgba(0, 0, 0, .2) 55%, rgba(0, 0, 0, .5)); }

/* ---------- phone ---------- */
.pl-top { position: absolute; top: 54px; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 16px; z-index: 35; }
.pl-ctx { flex: 1; min-width: 0; text-align: center; font-size: 12px; line-height: 15px; color: var(--label-2); }
.pl-ctx b { display: block; color: var(--label); font-size: 13px; line-height: 17px; font-weight: 600; }
.pl-ctx.temp b { color: var(--accent); }
.pl-cover { position: absolute; left: 45px; top: 118px; width: 300px; height: 300px; border-radius: var(--r-cover-lg); box-shadow: 0 24px 50px rgba(0, 0, 0, .38); }
.pl-info { position: absolute; left: 28px; right: 28px; top: 442px; }
.pl-title { font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pl-title .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pl-artist { font-size: 17px; line-height: 22px; color: var(--label-2); margin-top: 1px; }
.pl-prog { position: absolute; left: 28px; right: 28px; top: 580px; }
.pl-prog .slider { height: 6px; background: var(--fill-2); }
.pl-prog .slider > i { background: #fff; }
.pl-prog .slider .knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.pl-times { display: flex; justify-content: space-between; align-items: center; font-size: 12px; line-height: 16px; color: var(--label-2); margin-top: 7px; }
.pl-band { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: rgba(255, 255, 255, .42); }
.pl-trial .slider { background: var(--fill); }
.pl-trial .slider > i { border-radius: 0; }
.pl-ctl { position: absolute; left: 22px; right: 22px; top: 622px; height: 76px; display: flex; align-items: center; justify-content: space-between; }
.pl-ctl .ibtn { width: 56px; height: 56px; color: #fff; position: relative; }
.pl-ctl .ibtn:hover { background: var(--fill); }
.pl-ctl .ibtn.big { width: 76px; height: 76px; }
.pl-ctl .ibtn svg.i { width: 34px; height: 34px; }
.pl-ctl .ibtn.big svg.i { width: 46px; height: 46px; }
.pl-ctl .ibtn.md svg.i { width: 24px; height: 24px; }
.pl-ctl .ibtn.md { color: var(--label-2); }
.pl-ctl .ibtn.on { color: var(--accent); }
.pl-ctl .ibtn.on::after { content: ""; position: absolute; bottom: 8px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
/* the signature: source + access level + stream quality, one capsule above the progress bar */
.pl-sig { position: absolute; left: 26px; top: 536px; display: inline-flex; align-items: center; gap: 6px; height: 30px; max-width: calc(100% - 52px); padding: 0 7px 0 9px; border-radius: var(--r-cap); font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; }
.pl-sig > svg:not(.i) { width: 14px; height: 14px; flex: none; }

.pl-sig svg.i { width: 13px; height: 13px; }
.pl-sig svg.i.chev { width: 13px; height: 13px; opacity: .7; margin-left: -2px; }
.pl-sig .acc { height: 16px; font-size: 10px; padding: 0 4px; }
.pl-sig span.q { font-weight: 500; color: rgba(255, 255, 255, .88); }
.pl-sig.trial { --glass-fill: color-mix(in srgb, var(--trial) 46%, transparent); }
.pl-sig.trial b { font-weight: 700; }
.pl-sig.trial span.q { color: #fff; font-weight: 600; }
/* top-right glass capsule: add to playlist + more */
.pl-gp { display: inline-flex; align-items: center; height: 44px; padding: 0 2px; border-radius: var(--r-cap); flex: none; }
.pl-gp .ibtn { color: #fff; width: 44px; height: 44px; }
.pl-gp .ibtn svg.i { width: 20px; height: 20px; }
/* swipe pages: 佇列 ← 封面 → 歌詞. Dots show where you are; the active one stretches (iOS 26 page control) */
.pl-pane { position: absolute; inset: 0; pointer-events: none; }
.pl-pane > * { pointer-events: auto; }
.pl-dots { position: absolute; left: 50%; top: 752px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; }

.pl-pq { position: absolute; left: 0; right: 0; top: 178px; height: 332px; overflow: hidden; -webkit-mask: linear-gradient(#000 82%, transparent); mask: linear-gradient(#000 82%, transparent); }
.pl-pq .qh { white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 6px 20px 8px 24px; font-size: 13px; font-weight: 700; }

.pl-pq .row { padding: 0 20px 0 24px; min-height: 56px; }

.pl-mini { position: absolute; left: 24px; right: 24px; top: 112px; display: flex; gap: 12px; align-items: center; }

.pl-mini .m { flex: 1; min-width: 0; }

.pl-ly { position: absolute; left: 0; right: 0; top: 200px; height: 312px; overflow: hidden;
  -webkit-mask: linear-gradient(transparent, #000 10%, #000 82%, transparent); mask: linear-gradient(transparent, #000 10%, #000 82%, transparent); }
.pl-ly .in { padding: 24px 28px 120px; }
.pl-l { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 24px; line-height: 30px; font-weight: 700; color: var(--label-3); transition: color var(--t-mid); cursor: pointer; }
.pl-l .tx { flex: 1; min-width: 0; }
.pl-l small { display: block; font-size: 16px; line-height: 21px; font-weight: 600; margin-top: 3px; }
.pl-l.cur { color: #fff; }

.pl-back { position: absolute; left: 50%; top: 462px; transform: translateX(-50%); z-index: 5; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: var(--r-cap); font-size: 14px; font-weight: 600; white-space: nowrap; }

.pl-off .ob { display: flex; gap: 4px; }
.pl-off .ob button { display: grid; place-items: center; flex: 1; height: 40px; border-radius: var(--r-cap); background: rgba(255, 255, 255, .14); color: #fff; font: 600 13px var(--font-num); }
.pl-off .ob button.rs { flex: 1.3; font-family: var(--font); }
.pl-state { position: absolute; left: 32px; right: 32px; top: 200px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.pl-state .si { width: 64px; height: 64px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; margin-bottom: 8px; }

/* menus, sheets, dialogs are the shared components; below is only the content inside them */
.pl-sb { padding: 0 16px 24px; }

.pl-menu-scrim { position: absolute; inset: 0; z-index: 74; background: rgba(0, 0, 0, .18); }

.pl-matched .ok { color: var(--ok); }

.pl-matched span.t b { color: var(--glass-ink); font-weight: 600; }
.pl-sb .field { background: color-mix(in srgb, var(--glass-ink) 8%, transparent); color: var(--glass-ink); }
.pl-chips { display: flex; gap: 8px; margin: 12px 0 6px; }
.pl-chips .chip { background: color-mix(in srgb, var(--glass-ink) 8%, transparent); color: var(--glass-ink); }
.pl-chips .chip.on { background: var(--glass-ink); color: var(--glass-solid); }
.pl-res { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 4px; position: relative; }
.pl-res + .pl-res::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: .5px; background: color-mix(in srgb, var(--glass-ink) 12%, transparent); }
.pl-res .ic { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--glass-ink) 8%, transparent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--glass-ink-2); flex: none; }
.pl-res .ic svg.i { width: 17px; height: 17px; }
.pl-res .ic em { font-style: normal; font-size: 9px; line-height: 10px; font-weight: 700; }

.pl-res .m b .tt, .pl-res .m > span .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.pl-res .ck svg.i { width: 18px; height: 18px; stroke-width: 2.4; }
.pl-tr { display: inline-flex; align-items: center; height: 17px; padding: 0 5px; border-radius: 5px; background: color-mix(in srgb, var(--glass-ink) 10%, transparent); color: var(--glass-ink); font-size: 11px; font-weight: 600; flex: none; }
.pl-hint { font-size: 12px; line-height: 17px; color: var(--glass-ink-2); padding: 12px 4px 0; }
.pl-ih { display: flex; gap: 14px; align-items: center; padding: 4px 4px 16px; }

.pl-ih .m > span { display: block; font-size: 14px; line-height: 19px; color: var(--glass-ink-2); }
.pl-kv { display: flex; align-items: flex-start; gap: 12px; padding: 11px 4px; font-size: 15px; line-height: 20px; position: relative; }

.pl-sb .btn-gray { background: color-mix(in srgb, var(--glass-ink) 8%, transparent); color: var(--glass-ink); }

<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const T = FMP.T;
const PL_T = T.t23; // 星屑ランデブー: netease, member-only, has a translation
const PL_LY = [
  ['1:15', '夜明け前の駅で', '在黎明前的車站'],
  ['1:21', '君の名前を数えた', '一遍遍數著你的名字'],
  ['1:27', '星屑みたいな約束', '像星屑一樣的約定'],
  ['1:34', 'ポケットの中で光る', '在口袋裡閃著光'],
  ['1:40', 'ランデブー 遠回りして', '約會吧 繞一段遠路'],
  ['1:46', 'ランデブー 迷子のままで', '約會吧 就這樣迷路'],
  ['1:53', '終電の窓に映る', '映在末班車窗上的'],
  ['1:59', 'ふたりの影が揺れた', '兩個人的影子在搖晃'],
  ['2:06', 'さよならは まだ言わない', '還不說再見'],
  ['2:12', '朝が来るまで', '直到早晨來臨'],

<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首頁候選丙：封面 · FMP D 設計稿</title>
<link rel="stylesheet" href="assets/fmp.css">
<style>
[class^="hc-"], [class*=" hc-"] { box-sizing: border-box; }

/* ---- shelf head: source mark + source name + ranking name ---- */
.hc-h { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; margin-top: 22px; min-width: 0; }
.hc-h .src svg { width: 20px; height: 20px; }
.hc-h .nm { font-size: 20px; line-height: 25px; font-weight: 700; white-space: nowrap; }
.hc-h .k { font-size: 15px; line-height: 20px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hc-h .sp { flex: 1; }
.hc-all { display: inline-flex; align-items: center; gap: 1px; height: 44px; padding: 0 0 0 12px; font-size: 15px; font-weight: 500; color: var(--label-2); flex: none; }
.hc-all svg.i { width: 16px; height: 16px; stroke-width: 2.2; }

/* ---- horizontal shelves ---- */
.hc-rail { display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; padding: 6px 20px 2px; scroll-snap-type: x mandatory; scroll-padding: 0 20px; scrollbar-width: none; }
.hc-rail::-webkit-scrollbar { display: none; }
.hc-rail > * { flex: none; scroll-snap-align: start; }

/* ---- rank cards: covers bottom-aligned so captions share one line; the rank is set big against the artwork ---- */
.hc-rr { align-items: flex-end; }
.hc-rc { width: 132px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.hc-rc.lead { width: 204px; }
.hc-cw { position: relative; }
.hc-cw > .cover { width: 100%; aspect-ratio: 1; border-radius: 12px; }
.hc-rc.lead .hc-cw > .cover { border-radius: var(--r-cover-lg); }
/* the numeral: label colour with a stroke in the page colour, so it reads on any cover and on the page */
.hc-n { position: absolute; left: -6px; bottom: -9px; z-index: 2; font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -.06em; font-variant-numeric: tabular-nums; color: var(--label); -webkit-text-stroke: 7px var(--bg); paint-order: stroke fill; pointer-events: none; }
.hc-rc.lead .hc-n { font-size: 104px; left: -8px; bottom: -14px; -webkit-text-stroke-width: 9px; }

/* ---- captions under covers (title + access level; source + artist) ---- */
.hc-cap { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hc-cap .ey { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc-cap b { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 14px; line-height: 18px; font-weight: 600; }
.hc-cap b .tt, .hc-cap > span .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hc-cap > span { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--label-2); }
.hc-cap > span .src svg { width: 14px; height: 14px; }
.hc-rc.lead .hc-cap b, .hc-pc .hc-cap b { font-size: 15px; line-height: 20px; }
.hc-rc.lead .hc-cap > span, .hc-pc .hc-cap > span { font-size: 13px; line-height: 17px; }
.hc-cap.playing b { color: var(--accent); }

/* ---- 接著聽: queue + playlists in one small shelf ---- */
.hc-pc { width: 128px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hc-pc .hc-cw > .cover { border-radius: 12px; }
.hc-stack { position: relative; width: 128px; height: 128px; }
.hc-stack > .cover { position: absolute; width: 112px; height: 112px; border-radius: 12px; box-shadow: 0 0 0 2px var(--bg); }
.hc-stack > .cover:nth-child(1) { right: 0; top: 0; }
.hc-stack > .cover:nth-child(2) { right: 8px; top: 8px; }
.hc-stack > .cover:nth-child(3) { left: 0; bottom: 0; }
.hc-new { position: absolute; right: 6px; top: 6px; z-index: 2; min-width: 30px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--label); color: var(--bg); font: 700 12px/22px var(--font-num); font-variant-numeric: tabular-nums; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.hc-tile { width: 128px; height: 128px; border-radius: 12px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--label-2); font-size: 13px; font-weight: 600; }
.hc-tile svg.i { width: 26px; height: 26px; }

/* ---- states ---- */
.hc-err { margin: 6px 20px 0; padding: 14px 12px 14px 14px; border-radius: 16px; background: var(--fill); display: flex; align-items: center; gap: 12px; }
.hc-err .ei { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--cell); flex: none; position: relative; }
.hc-err .ei .src svg { width: 22px; height: 22px; }
.hc-err .ei .wb { position: absolute; right: -5px; bottom: -5px; width: 19px; height: 19px; border-radius: 10px; background: var(--bg); display: grid; place-items: center; color: var(--warn); }
.hc-err .ei .wb svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
.hc-err .et { flex: 1; min-width: 0; }
.hc-err .et b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; }
.hc-err .et span { display: block; font-size: 13px; line-height: 17px; color: var(--label-2); margin-top: 1px; }
.hc-off { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 2px 0 0; padding: 0 20px; box-shadow: inset 0 .5px 0 var(--sep), inset 0 -.5px 0 var(--sep); font-size: 13px; line-height: 17px; color: var(--label-2); }
.hc-off b { color: var(--label); font-weight: 600; }
.hc-off svg { width: 18px; height: 18px; flex: none; color: var(--label); }
.hc-ghosts { display: flex; gap: 14px; padding: 6px 20px 0; }
.hc-ghost { flex: 1; aspect-ratio: 1; border-radius: 12px; background: var(--fill); display: grid; place-items: center; }
.hc-ghost .src svg { width: 26px; height: 26px; opacity: .55; }
.hc-gtext { padding: 12px 20px 0; font-size: 13px; line-height: 18px; color: var(--label-2); }
.hc-start { margin: 6px 20px 0; padding: 18px 18px 16px; border-radius: 16px; background: var(--fill); }
.hc-start .ttl { font-size: 17px; line-height: 22px; font-weight: 600; }
.hc-start p { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--label-2); }
.hc-start .srcs { display: flex; gap: 6px; margin-top: 12px; }
.hc-start .acts { display: flex; gap: 10px; margin-top: 16px; }
.hc-start .acts .btn { flex: 1; }

/* ---- full top 10 (pushed page) ---- */
.hc-hbg { position: absolute; left: 0; right: 0; top: 0; height: 470px; overflow: hidden; pointer-events: none; z-index: 0; }
.hc-hbg img { position: absolute; left: -20%; top: -30%; width: 140%; height: 140%; object-fit: cover; filter: blur(46px) saturate(1.5); opacity: .9; }
.hc-hbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(color-mix(in srgb, var(--bg) 40%, transparent), color-mix(in srgb, var(--bg) 66%, transparent) 55%, var(--bg)); }
.hc-in { position: relative; z-index: 1; }
.hc-fhero { padding: 60px 20px 0; }
.hc-fhero h1 { margin: 10px 0 0; font: 700 28px/34px var(--font-display); letter-spacing: -.01em; }
.hc-fmeta { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--label-2); }
.hc-flead { display: flex; gap: 16px; align-items: flex-end; padding: 22px 20px 0; }
.hc-flead .hc-cw { width: 156px; flex: none; }
.hc-flead .hc-cw > .cover { border-radius: var(--r-cover-lg); box-shadow: var(--shadow-float); }
.hc-flead .hc-n { font-size: 96px; -webkit-text-stroke-width: 9px; left: -8px; bottom: -13px; }
.hc-flead .m { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; padding-bottom: 2px; }
.hc-flead .m b { font-size: 20px; line-height: 25px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.hc-flead .m .a { font-size: 15px; color: var(--label-2); }
.hc-flead .m .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.hc-fbtns { display: flex; gap: 10px; padding: 18px 20px 6px; }
.hc-fbtns .btn { flex: 1; }
.hc-lr { min-height: 70px; --sep-inset: 118px; }
.hc-lr .hc-ln { width: 38px; flex: none; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--label); }
.hc-lr > .cover { width: 52px; height: 52px; border-radius: 8px; }
.hc-foot { padding: 16px 20px 0; font-size: 12px; line-height: 16px; color: var(--label-3); text-align: center; }

/* ---- desktop ---- */
.hc-d { padding: 66px 28px 140px 8px; }
.hc-dh { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.hc-dh .sp { flex: 1; }
.hc-dh .up { font-size: 12px; color: var(--label-2); padding-bottom: 6px; }
.hc-dsec { display: flex; align-items: center; gap: 8px; height: 28px; margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.hc-dsec .sp { flex: 1; }
.hc-dsec .btn-plain { font-size: 12.5px; height: 26px; color: var(--label-2); font-weight: 500; }
.hc-band { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); grid-template-rows: auto; grid-auto-rows: 0; column-gap: 18px; overflow: hidden; }
.hc-band .hc-pc { width: auto; }
.hc-band .hc-cw > .cover { border-radius: 10px; }
.desk .hc-cap .ey { font-size: 11px; line-height: 14px; }
.desk .hc-pc .hc-cap b, .desk .hc-cap b { font-size: 13px; line-height: 17px; }
.desk .hc-pc .hc-cap > span, .desk .hc-cap > span { font-size: 12px; line-height: 15px; }
.hc-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 24px; margin-top: 30px; }
.hc-cols.w4 { grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 28px; margin-top: 0; }
.hc-dch { display: flex; align-items: center; gap: 7px; height: 30px; margin-bottom: 8px; font-size: 13px; min-width: 0; }
.hc-dch .src svg { width: 16px; height: 16px; }
.hc-dch b { font-size: 14px; font-weight: 700; white-space: nowrap; }
.hc-dch .k { color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hc-dch .sp { flex: 1; }
.hc-dch .ibtn { width: 28px; height: 28px; color: var(--label-2); }
.hc-dch .ibtn svg.i { width: 16px; height: 16px; }
.hc-dlead { position: relative; }
.hc-dlead .hc-cw > .cover { border-radius: 10px; }
.hc-dlead .hc-n { font-size: 92px; left: -7px; bottom: -12px; -webkit-text-stroke-width: 8px; }
.hc-dlead .hc-cap { margin: 12px 0 8px; padding-left: 2px; }
.hc-dlead .hc-cap b { font-size: 14px; line-height: 18px; }
.hc-dlead.hov .hc-cw > .cover { filter: brightness(.9); }
.hc-cplay { position: absolute; right: 50px; bottom: 10px; width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; z-index: 3; }
.hc-cplay svg.i { width: 18px; height: 18px; }
.hc-cmore { position: absolute; right: 10px; bottom: 14px; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; z-index: 3; }
.hc-cmore svg.i { width: 16px; height: 16px; }
.hc-dr { position: relative; display: grid; grid-template-columns: 18px 36px minmax(0, 1fr); align-items: center; column-gap: 10px; height: 48px; padding: 0 8px 0 2px; border-radius: 8px; }
.hc-dr.np { grid-template-columns: 36px minmax(0, 1fr); padding-left: 6px; }
.hc-dr:hover, .hc-dr.hov { background: var(--cell-hover); }
.hc-dr .rn { text-align: right; font: 600 13px var(--font-num); font-variant-numeric: tabular-nums; color: var(--label-2); display: flex; justify-content: flex-end; }
.hc-dr .rn svg.i { width: 15px; height: 15px; color: var(--label); }
.hc-dr > .cover { width: 36px; height: 36px; border-radius: 6px; }
.hc-dr .m { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hc-dr .m b { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 13px; line-height: 17px; font-weight: 500; }
.hc-dr .m b .tt, .hc-dr .m > span .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hc-dr .m > span { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; line-height: 15px; color: var(--label-2); }
.hc-dr.playing .m b { color: var(--accent); font-weight: 600; }
.hc-dr .mr { position: absolute; right: 4px; top: 10px; width: 28px; height: 28px; border-radius: 14px; display: none; place-items: center; color: var(--label-2); background: var(--cell-hover); }
.hc-dr .mr svg.i { width: 16px; height: 16px; }
.hc-dr:hover .mr, .hc-dr.hov .mr { display: grid; }
.hc-dsub { font-size: 12px; font-weight: 700; color: var(--label-2); margin: 18px 0 4px 2px; }
.hc-np .ey { font-size: 11px; line-height: 14px; font-weight: 600; color: var(--label-2); }
</style>
</head>
<body>
<script src="assets/glass.js"></script>
<script src="assets/kit.js"></script>
<script>
const I = FMP.icon;
const T = FMP.T;
const PL = FMP.PL;
const esc = FMP.esc;

/* ---------------- demo data (synthetic) ---------------- */
// the kit has 7 Bilibili and 7 YouTube tracks; rankings need 10 each
function hcT(id, title, artist, src, dur, acc) {
  return { id, title, artist, src, dur, acc, parts: 0, plays: '', cv: FMP.cover('hc-' + id + title) };
}
const HX = {
  b1: hcT('b1', '【原創】海風收音機', 'Lumi 工作室', 'bilibili', '4:05', null),
  b2: hcT('b2', '【翻彈】夜に駆ける 吉他版', '指尖的貓', 'bilibili', '4:22', null),
  b3: hcT('b3', '【阿卡貝拉】晴天 五人版', '和聲研究所', 'bilibili', '4:31', null),
  y1: hcT('y1', 'Afterglow Avenue', 'Nova Reyes', 'youtube', '3:29', null),
  y2: hcT('y2', 'Neon Rain (Official Video)', 'Hollow Pines', 'youtube', '3:51', null),
  y3: hcT('y3', 'Wildflower Static', 'June & the Echoes', 'youtube', '4:14', null),
};
const tk = (id) => T[id] || HX[id];
// one ranking per source; names and order come from the plugins (capability 排行榜)
const RK = {
  bilibili: { src: 'bilibili', name: '音樂區排行', ids: ['t11', 't03', 'b1', 't18', 't05', 'b2', 't08', 'b3', 't15', 't21'] },
  youtube: { src: 'youtube', name: '音樂熱門', ids: ['t13', 't02', 'y1', 't10', 't06', 'y2', 't22', 't16', 'y3', 't19'] },
  netease: { src: 'netease', name: '熱歌榜', ids: ['t23', 't14', 't04', 't01', 't24', 't09', 't07', 't12', 't17', 't20'] },
};
const RK_ORDER = ['bilibili', 'youtube', 'netease'];
// queue: FMP.now (t01) is #6 of 64; the next three match the desktop detail panel
const HC_NEXT = ['t02', 't03', 't04', 't06', 't07'];
// imported playlists refreshed with new tracks (newest first), then the user's own library order
const HC_UPD = [['lofi', 3, '2 小時前刷新'], ['cpop', 1, '5 小時前刷新']];
const HC_REST = ['commute', 'covers', 'code', 'weekend', 'live', 'learn'];

/* ---------------- shared pieces ---------------- */
const isNow = (t) => t.id === FMP.now.id;
function hcCap(t, o) {
  o = o || {};
  const playing = isNow(t) && !o.noPlay;
  const part = t.parts > 1 ? '<span class="part">' + t.parts + 'P</span>' : '';
  return '<div class="hc-cap' + (playing ? ' playing' : '') + '">' + (o.ey ? '<span class="ey">' + o.ey + '</span>' : '') +
    '<b>' + (playing ? '<span class="eq" aria-label="正在播放"><i></i><i></i><i></i></span>' : '') + '<span class="tt">' + esc(t.title) + '</span>' + FMP.acc(t.acc) + '</b>' +
    '<span>' + FMP.src(t.src) + part + '<span class="tt">' + esc(o.sub || t.artist) + '</span></span></div>';
}
const hcNum = (n) => '<span class="hc-n" aria-hidden="true">' + n + '</span>';
const WIFI_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 10a11 11 0 0 1 4.2-2.6M13.5 7.1a11 11 0 0 1 6 2.9M7.5 13.2a6.6 6.6 0 0 1 3-1.6"/><circle cx="12" cy="16.8" r="1.4" fill="currentColor" stroke="none"/><path d="M4 4l16 16"/></svg>';

/* ---------------- phone ---------------- */
function hcRankCard(t, n) {
  return '<div class="hc-rc' + (n === 1 ? ' lead' : '') + '" role="button" aria-label="第 ' + n + ' 名：' + esc(t.title) + '"><div class="hc-cw">' + FMP.coverEl(t.cv) + hcNum(n) + '</div>' + hcCap(t) + '</div>';
}
function hcHead(src, name, all) {
  return '<div class="hc-h">' + FMP.src(src) + '<span class="nm">' + FMP.SRC[src].name + '</span><span class="k">' + name + '</span><span class="sp"></span>' +
    (all ? '<button class="hc-all" aria-label="' + FMP.SRC[src].name + name + '的完整前 10 名">全部' + I('chevR') + '</button>' : '') + '</div>';
}
function hcShelf(key) {
  const r = RK[key];
  return '<section aria-label="' + FMP.SRC[r.src].name + ' ' + r.name + '">' + hcHead(r.src, r.name, true) +
    '<div class="hc-rail hc-rr">' + r.ids.map((id, i) => hcRankCard(tk(id), i + 1)).join('') + '</div></section>';
}
function hcErrBlock(src, title, why) {
  return '<div class="hc-err" role="status"><span class="ei">' + FMP.src(src) + '<span class="wb">' + I('warn') + '</span></span><div class="et"><b>' + title + '</b><span>' + why + '</span></div>' +
    '<button class="btn btn-tinted btn-sm">' + I('refresh', 's16') + '重試</button></div>';
}
function hcPersonal() {
  const q = HC_NEXT.slice(0, 3).map(tk);
  const queue = '<div class="hc-pc" role="button" aria-label="打開佇列"><div class="hc-stack">' + FMP.coverEl(q[2].cv) + FMP.coverEl(q[1].cv) + FMP.coverEl(q[0].cv) + '</div>' +
    hcCap(q[0], { ey: '接下來 · 還有 58 首' }) + '</div>';
  const pcard = (p, ey, badge) => '<div class="hc-pc" role="button"><div class="hc-cw">' + FMP.coverEl(p.cv) + (badge ? '<span class="hc-new" aria-label="多了 ' + badge + ' 首">+' + badge + '</span>' : '') + '</div>' +
    '<div class="hc-cap"><span class="ey">' + ey + '</span><b><span class="tt">' + esc(p.name) + '</span></b><span>' +
    (p.kind === 'imported' ? FMP.src(p.src) + '<span class="tt">' + FMP.SRC[p.src].short + ' · ' + p.count + ' 首</span>' : '<span class="tt num">' + p.count + ' 首</span>') + '</span></div></div>';
  const upd = HC_UPD.map(([id, n, when]) => pcard(PL[id], when, n)).join('');
  const rest = HC_REST.map((id) => pcard(PL[id], PL[id].kind === 'imported' ? '匯入歌單' : '本地歌單')).join('');
  const tile = '<div class="hc-pc" role="button"><span class="hc-tile">' + I('library') + '音樂庫</span></div>';
  return '<div class="hc-rail" aria-label="接著聽" style="margin-top:2px">' + queue + upd + rest + tile + '</div>';
}
const HC_TITLE = '<div class="lt" style="padding-top:58px"><div class="ty-large">首頁</div></div>';
function hcPhone(ctx, o) {
  o = o || {};
  let body = HC_TITLE;
  if (o.offline) body += '<div class="hc-off" role="status">' + WIFI_OFF + '<span><b>目前離線</b> · 排行榜連上網路後會自動載入</span></div>';
  if (o.firstRun) {
    body += '<div class="hc-start"><div class="ttl">從排行榜挑一首開始</div><p>點任何一首就會播放。也可以把你在三個音源上的歌單匯入，之後會出現在這裡。</p>' +
      '<div class="srcs">' + FMP.srcChip('bilibili', true) + FMP.srcChip('youtube', true) + FMP.srcChip('netease', true) + '</div>' +
      '<div class="acts"><button class="btn btn-primary">' + I('link', 's20') + '匯入歌單</button><button class="btn btn-gray">' + I('search', 's20') + '搜尋</button></div></div>';
  } else {
    body += hcPersonal();
  }
  if (o.offline) {
    body += '<div class="hc-h"><span class="nm">排行榜</span></div><div class="hc-ghosts">' + RK_ORDER.map((k) => '<span class="hc-ghost">' + FMP.src(k) + '</span>').join('') + '</div>' +
      '<div class="hc-gtext">排行榜要連網才拿得到；佇列和歌單照常能看。</div>';
  } else {
    RK_ORDER.forEach((k) => {
      if (o.failed === k) body += '<section>' + hcHead(k, RK[k].name, false) + hcErrBlock(k, 'B 站排行榜這次沒載入', '請求太頻繁，被 B 站風控攔下。') + '</section>';
      else body += hcShelf(k);
    });
  }
  return FMP.phone(ctx, {
    content: body,
    top: FMP.ptop('首頁', '', '', 110),

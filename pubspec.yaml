name: fmp
description: "Flutter Music Player - 跨平台音乐播放器，支持 Bilibili、YouTube 与网易云音乐音源"
publish_to: 'none'

version: 1.9.1+1009001

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 本地存储
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  path: ^1.9.0

  # 音频播放
  # Android: just_audio (ExoPlayer, 更轻量，省 ~10-15MB 内存)
  # Windows/Linux: media_kit (libmpv, 支持设备切换)
  just_audio: ^0.9.40             # Android 音频后端
  media_kit: ^1.1.11              # Windows/Linux 音频后端
  media_kit_libs_windows_audio: ^1.0.9  # Windows 音频支持
  rxdart: ^0.28.0  # 用于流组合（BehaviorSubject 等）
  audio_service: ^0.18.15  # Android 媒体通知控制
  audio_session: ^0.1.25
  smtc_windows: ^1.1.0    # Windows 媒体键和 SMTC 控制

  # 网络
  dio: ^5.11.1

  # 加密
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # YouTube 数据提取
  youtube_explode_dart: ^3.1.0

  # 路由
  go_router: ^18.0.1
  url_launcher: ^6.3.1

  # UI 组件
  scrollable_positioned_list: ^0.3.8  # 支持快速跳转到指定索引

  # 图片缓存
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2

  # 桌面平台
  tray_manager: ^0.2.3
  window_manager: ^0.4.3
  hotkey_manager: ^0.2.3

  # 应用更新
  package_info_plus: ^9.0.1
  open_filex: ^4.5.0
  archive: ^4.2.0

  # 帐号管理
  flutter_inappwebview: ^6.1.5   # WebView 登录（WebView2 on Windows）
  qr_flutter: ^4.1.0             # QR 码生成（备选登录方式）
  # 升到 11.x 之前先讀 lib/services/AGENTS.md 的 Account System 一節：
  # v10 是憑證遷移的必經踏腳石，跳過會讓既有使用者的憑證讀不出來。
  flutter_secure_storage: ^10.3.1  # Cookie/Token 安全儲存
  pointycastle: ^3.9.1           # RSA 加密（Cookie 刷新流程）

  # 工具
  file_picker: ^8.3.7
  collection: ^1.19.1
  equatable: ^2.1.0
  slang_flutter: ^4.19.0
  # slang 4 生成的 strings.g.dart 直接 import package:intl（DateFormat /
  # NumberFormat）。版本交給 flutter_localizations 決定，不要自己釘。
  intl: any
  flutter_localizations:
    sdk: flutter
  simple_icons: ^16.23.0
  reorderable_grid_view: ^2.2.8
  launch_at_startup: ^0.5.1
  desktop_multi_window: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2
  flutter_lints: ^6.0.0
  # i18n 走 `dart run slang` 的獨立 CLI（設定在 slang.yaml），不經 build_runner。
  # slang_build_runner 因此是純負擔：它會把 dart_style/analyzer 的上界一起拖進解析。
  slang: ^4.19.1
  flutter_launcher_icons: ^0.14.1
  inno_bundle: ^0.11.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icon/
    # 授權全文同時是 repo 檔案與 app 內的資源：showLicensePage 收不到建置時才
    # 下載的 libmpv/FFmpeg，由 lib/core/third_party_licenses.dart 從這裡補上。
    - licenses/

# Windows 安装包配置 (InnoSetup)
inno_bundle:
  id: BAF6CE8D-E1C8-4C29-AE0B-EDE98D5F8FAA
  name: FMP
  description: "Flutter Music Player - 跨平台音乐播放器"
  publisher: FMP
  installer_icon: windows/runner/resources/app_icon.ico
  admin: false

# 图标生成配置
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  # Android
  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  # Windows
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256 # 可以是 48, 64, 128, 256

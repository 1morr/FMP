# build_runner 的設定（drift）；產生檔提交（app/AGENTS.md § 資料層）。翻譯不走
# build_runner，設定在 slang.yaml。
targets:
  $default:
    builders:
      # drift（https://drift.simonbinder.eu/migrations/）。`databases:` 給
      # `dart run drift_dev make-migrations` 找資料庫類別；快照存在
      # drift_schemas/<名稱>/，測試輔助碼在 test/drift/<名稱>/generated/
      # （兩者都是 make-migrations 的預設位置）。步驟見 .trellis/spec/app/data/index.md。
      # cache_database 是快取庫的索引 cache.db：版本不同就清空重建，不產生
      # 逐步 migration，快照只給 schema_test 守「改了表卻沒加版本」。
      drift_dev:
        options:
          databases:
            app_database: lib/data/database/app_database.dart
            cache_database: lib/data/cache/cache_database.dart
      # 舊 Isar 模型的 `*.g.dart` 在 workspace 外產生後提交（lib/legacy_import/isar/README.md）；
      # workspace 沒有 isar 的產生器，不排除的話 combining builder 會把它們當成自己的輸出刪掉。
      source_gen:combining_builder:
        generate_for:
          exclude:
            - lib/legacy_import/isar/**

name: fmp
description: "FMP — Flutter music player (rewrite)."
publish_to: 'none'
# 只由 release-please 的發版 PR 改，等於 ../.release-please-manifest.json。
# 不寫 +build：release-please 會把數字的 build number 加 1，versionCode 改由
# 發版 workflow 從 tag 算（app/AGENTS.md § 發版）。本機建置的 versionCode 是 1。
version: 0.1.0

environment:
  sdk: ^3.13.4

# pub workspace 的根（ADR 0015）。成員和 app 共用一次解析，所以 flutter_test
# 的釘版也限制成員（packages/fmp_lints/pubspec.yaml 的 analyzer 版本）。
# analysis_server_plugin 的 `plugins:` 只能寫在 package 或 workspace 根，
# 所以 app/ 本身就是根，不另設外層 pubspec。
workspace:
  - packages/fmp_lints
  - packages/flutter_inappwebview_linux_stub
  - packages/flutter_inappwebview_macos_stub

dependencies:
  # 系統媒體控制的 Android 實作（ADR 0018 §決定 8）：通知、鎖定畫面、媒體鍵。
  # 只准在 lib/platform/ import（fmp_layer_imports）。
  audio_service: ^0.18.19
  # Android 的音訊中斷與拔耳機（design §7.6）：JustAudioBackend 關掉 just_audio
  # 的內建處理、自己聽它的事件；只准在 lib/playback/backends/ import
  # （fmp_layer_imports）。本來就是 just_audio 的傳遞依賴，直接依賴才能 import。
  audio_session: ^0.2.4
  # 封面（ADR 0016 §決定 4）：widget 只准在 lib/ui/artwork/ import，它的磁碟
  # 快取經 flutter_cache_manager 的自訂 cache manager 接到統一快取庫
  # （lib/data/cache/，fmp_layer_imports）。
  cached_network_image: ^4.0.4
  # Toast 去重的時間（ADR 0023 §決定 2）：lib/ 以 clock.now() 讀時間，測試的
  # fake_async 才改得到它。
  clock: ^1.1.3
  # 有沒有網路介面（ADR 0016 §決定 6）；只准在 lib/platform/ import
  # （fmp_layer_imports）。它的 Android manifest 會併入 ACCESS_NETWORK_STATE。
  connectivity_plus: ^7.3.1
  # 插件宿主 API 的 crypto.md5／sha256（ADR 0014 §決定 5）。
  crypto: ^3.0.7
  # 網路層（ADR 0012 §決定 1）：每插件一個 dio 與記憶體 cookie jar。三個都只准
  # 在 lib/core/network/ import（fmp_layer_imports）。
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  # 資料層（ADR 0010）。sqlite3 3.x 以 build hooks 打包 SQLite 原生庫，不用已
  # EOL 的 sqlite3_flutter_libs；兩者只准在 lib/data/ import（fmp_layer_imports）。
  drift: ^2.35.0
  # flutter_cache_manager 的 FileSystem 介面回傳它的 File 型別（lib/data/cache/）。
  file: ^7.0.1
  # 從檔案安裝插件時選 .js（ADR 0009 §決定 6、ADR 0030 §決定 8）；只准在
  # lib/platform/ import（fmp_layer_imports）。
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  # 插件的 JS 引擎（ADR 0014 §決定 2），只准在 lib/plugins/runtime/ import
  # （fmp_layer_imports）。釘死版本：執行環境繼承 QuickJsRuntime2 並依賴它在
  # 建構子呼叫 init()，測試直接載入套件內附的原生庫（test/support/quickjs.dart），
  # Linux 的 bundle 由 linux/CMakeLists.txt 補上它漏裝的原生庫，三者都是套件的
  # 內部結構，升版時要重看。
  flutter_js: 0.8.7
  # 封面的 cache manager（ADR 0016 §決定 4）：索引、檔案、下載三個介面換成統一
  # 快取庫與媒體 client，只准在 lib/data/cache/ import（fmp_layer_imports）。
  # 它帶進 sqflite（Android 原生庫）；App 不用它的預設索引。
  flutter_cache_manager: ^3.4.5
  # App 內網頁登入（ADR 0029 §決定 9）；只准在 lib/platform/ import
  # （fmp_layer_imports）。釘死 beta：唯一的 stable 6.1.5 的 Android 部分在 AGP 9
  # 要靠會被拿掉的暫時旗標才建得起來（R1）。6.2.0 出 stable 就換；退回 6.1.5 時
  # 連 pubspec.lock 一起還原（lockfile 會留著 beta 的 platform_interface）。
  # Windows 的 STL1011 define 在 windows/CMakeLists.txt。
  flutter_inappwebview: 6.2.0-beta.3
  # Linux 不用套件預設的 flutter_inappwebview_linux（WPE WebKit，建置與執行都要裝 WPE）：
  # 直接依賴的實作優先於 default_package，換成什麼都不做的本機 stub。Linux 沒有登入
  # WebView（ADR 0012 §決定 8）。理由與閘門見 packages/flutter_inappwebview_linux_stub。
  flutter_inappwebview_linux_stub:
    path: packages/flutter_inappwebview_linux_stub
  # macOS 同理：flutter_inappwebview_macos 1.2.0-beta.3 在目前的 Xcode 編不過，macOS 也沒有登入
  # WebView（ADR 0012 §決定 8），換成本機 stub。理由與閘門見 packages/flutter_inappwebview_macos_stub。
  flutter_inappwebview_macos_stub:
    path: packages/flutter_inappwebview_macos_stub
  # 憑證存放（ADR 0012 §決定 3、ADR 0029 §決定 5）；只准在 lib/platform/ import
  # （fmp_layer_imports）。
  flutter_secure_storage: ^11.2.0
  # 必須等於 smtc_windows 的 rust/Cargo.toml 釘的版本（目前 =2.11.1）：套件的
  # pubspec 寫 ^2.11.1，Dart 端會解析到較新的版本，執行時 SMTC 初始化就失敗。
  # 升級 smtc_windows 時一起改（閘門 test/platform/smtc_bridge_version_test.dart）。
  flutter_rust_bridge: 2.11.1
  # 狀態管理（ADR 0013）。不用 riverpod_generator：provider 少，手寫即可。
  flutter_riverpod: ^3.4.3
  # 播放後端（ADR 0018 §決定 3）：just_audio（ExoPlayer）給 Android，media_kit
  # （libmpv）給 Windows；兩者只准在 lib/playback/backends/ import
  # （fmp_layer_imports）。
  # slang 的產生檔（lib/i18n/strings.g.dart）一律 import 它，不宣告就是靠
  # material_ui 的傳遞依賴；數字縮寫（ADR 0024 §決定 6）也用它。版本跟
  # material_ui 的限制走。
  intl: ^0.20.2
  just_audio: ^0.10.6
  # Flutter 3.47 起 Material 以獨立套件發佈，app/ 直接用它，不 import
  # package:flutter/material.dart（app/AGENTS.md § Material）。
  material_ui: ^1.5.0
  media_kit: ^1.2.6
  # media_kit 的 README 建議的 media_kit_libs_audio 會連 Android 的 libmpv 一起
  # 打包（每個 ABI 多幾 MB，ADR 0018 否決的做法），所以只加 Windows 那一個。它
  # 停在 2023-09 的 libmpv，建置時從 GitHub 下載。
  media_kit_libs_windows_audio: ^1.0.9
  path: ^1.9.1
  path_provider: ^2.1.6
  # 插件版本比較（ADR 0030 §決定 4）；只准在 lib/plugins/repository/ import（fmp_layer_imports）。
  pub_semver: ^2.2.1
  # QR 登入畫面畫 QR 碼（design §6.4、§14）；只准在 lib/ui/accounts/ import
  # （fmp_layer_imports）。2023-05 後沒有新版，壞掉時換 pretty_qr_code。
  qr_flutter: ^4.1.0
  # 介面字串（ADR 0024 §決定 7）。不用 slang_flutter：翻譯以 Riverpod 注入
  # （lib/ui/i18n/），不用 slang 的 LocaleSettings／TranslationProvider。
  slang: ^4.19.2
  # Windows 的系統媒體控制（SMTC，ADR 0018 §決定 8）；只准在 lib/platform/ import
  # （fmp_layer_imports）。釘死版本：它每次建置都從原始碼編 Rust（cargokit 沒有
  # 預編譯二進位），要升級就連建置一起驗。它依賴的 flutter_rust_bridge 見下方，
  # 規則與閘門見 AGENTS.md § 平台層的 Windows SMTC。
  smtc_windows: 1.1.0
  sqlite3: ^3.6.0
  # log 門面的歷史與分派（ADR 0011 §決定 1）；只准在 lib/core/logging/
  # import（fmp_log_facade）。
  talker: ^5.1.20

dev_dependencies:
  # 播放列的 golden（ADR 0024 §如何確認）。只用它的 CI 版（文字畫成色塊），
  # 設定在 test/flutter_test_config.dart。
  alchemist: ^0.14.0
  # 只給 test/core/errors/app_error_surface_test.dart 解析原始碼（parseString）。
  # 版本由 packages/fmp_lints 的釘版決定（同一個 workspace 只解出一份）。
  analyzer: any
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  # 播放控制器的測試以假時間跑重試與網址期限（test/playback/）。
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 插件執行環境的實機量測（integration_test/plugin_runtime_benchmark_test.dart）。
  integration_test:
    sdk: flutter
  # test/identity/android_manifest_test.dart 解析 AndroidManifest.xml。
  xml: ^7.1.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # 沒帶 --flavor 的 run／build／test 一律是開發版（ADR 0015 §決定 8）；
  # 發版必須明確帶 --flavor prod。
  default-flavor: dev
  # 測試插件（ADR 0015 §決定 6）只打包進開發版：實機驗證與量測從 asset 讀
  # 腳本，它的串流指向同目錄的音檔（asset:///…）。
  assets:
    - path: test/fixtures/plugins/test_plugin/
      flavors:
        - dev

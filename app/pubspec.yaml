name: fmp
description: "FMP 新版：音源由插件提供的跨平台音樂播放器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  logger: ^2.8.0
  path_provider: ^2.1.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.7.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

name: fmp
description: "FMP — Flutter music player (rewrite)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# pub workspace 的根（ADR 0015）。成員和 app 共用一次解析，所以 flutter_test
# 的釘版也限制成員（packages/fmp_lints/pubspec.yaml 的 analyzer 版本）。
# analysis_server_plugin 的 `plugins:` 只能寫在 package 或 workspace 根，
# 所以 app/ 本身就是根，不另設外層 pubspec。
workspace:
  - packages/fmp_lints

dependencies:
  # 插件宿主 API 的 crypto.md5／sha256（ADR 0014 §決定 5）。
  crypto: ^3.0.7
  # 網路層（ADR 0012 §決定 1）：每插件一個 dio 與記憶體 cookie jar。三個都只准
  # 在 lib/core/network/ import（fmp_layer_imports）。
  cookie_jar: ^4.0.9
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  # 資料層（ADR 0010）。sqlite3 3.x 以 build hooks 打包 SQLite 原生庫，不用已
  # EOL 的 sqlite3_flutter_libs；兩者只准在 lib/data/ import（fmp_layer_imports）。
  drift: ^2.35.0
  flutter:
    sdk: flutter
  # 插件的 JS 引擎（ADR 0014 §決定 2），只准在 lib/plugins/runtime/ import
  # （fmp_layer_imports）。釘死版本：執行環境繼承 QuickJsRuntime2 並依賴它在
  # 建構子呼叫 init()，測試直接載入套件內附的原生庫（test/support/quickjs.dart），
  # 兩者都是套件的內部結構，升版時要重看。
  flutter_js: 0.8.7
  # 狀態管理（ADR 0013）。不用 riverpod_generator：provider 少，手寫即可。
  flutter_riverpod: ^3.4.3
  # Flutter 3.47 起 Material 以獨立套件發佈，app/ 直接用它，不 import
  # package:flutter/material.dart（app/AGENTS.md § Material）。
  material_ui: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0
  # log 門面的歷史與分派（ADR 0011 §決定 1）；只准在 lib/core/logging/
  # import（fmp_log_facade）。
  talker: ^5.1.20

dev_dependencies:
  # 只給 test/core/errors/app_error_surface_test.dart 解析原始碼（parseString）。
  # 版本由 packages/fmp_lints 的釘版決定（同一個 workspace 只解出一份）。
  analyzer: any
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 插件執行環境的實機量測（integration_test/plugin_runtime_benchmark_test.dart）。
  integration_test:
    sdk: flutter
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # 沒帶 --flavor 的 run／build／test 一律是開發版（ADR 0015 §決定 8）；
  # 發版必須明確帶 --flavor prod。
  default-flavor: dev
  # 測試插件（ADR 0015 §決定 6）只打包進開發版：實機驗證與量測從 asset 讀
  # 腳本，它的串流指向同目錄的音檔（asset:///…）。
  assets:
    - path: test/fixtures/plugins/test_plugin/
      flavors:
        - dev

name: flutter_inappwebview_linux_stub
description: >-
  FMP 的 flutter_inappwebview Linux 實作，什麼都不做：取代套件預設的
  flutter_inappwebview_linux（WPE WebKit），Linux 建置不必裝 WPE。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

# Linux 宣告沒有登入 WebView（PlatformCapabilities.loginWebView 為假），App 不會在
# Linux 呼叫 flutter_inappwebview。這個實作只是讓 Flutter 選它而不選預設的
# flutter_inappwebview_linux：App 直接依賴的實作優先於 default_package（Flutter 工具
# flutter_plugins.dart 的 _resolveImplementationOfPlugin）。純 Dart、沒有原生碼，
# 所以 linux/flutter/generated_plugins.cmake 不列任何 flutter_inappwebview 的原生插件。
# 閘門：app/test/platform/webview_stub_test.dart。Linux 的 WebView 在 Linux 平台任務
# 決定（ADR 0012 §決定 8），屆時刪掉這個套件。
flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: InAppWebViewLinuxStub
